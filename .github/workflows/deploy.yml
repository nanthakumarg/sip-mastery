name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache RFC text files
        uses: actions/cache@v4
        with:
          path: .cache/rfc
          key: rfc-${{ hashFiles('src/content/rfc-quotes.yaml') }}
          restore-keys: rfc-

      - name: Verify RFC quotes
        run: npm run verify:rfc

      - name: Unit tests
        run: npm test

      - name: Build (runs the content checks first)
        run: npm run build
        env:
          # Custom domain (Settings → Pages → Custom domain), served from the root.
          SITE: https://sip.nanthakumar.com
          BASE: /
          PUBLIC_REPO_URL: https://github.com/${{ github.repository }}

      - name: Check SEO metadata
        run: npm run check:seo

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
