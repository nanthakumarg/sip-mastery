# The RFC map (Module 1.4).
# Title, date, status, and obsoletes/updates links come from the official RFC
# index: run `npm run sync:rfc-index` after editing this list. Only the area,
# the protocol stripe, the summary, and the modules are written here.
#
# proto: the protocol colour stripe on the map (sip, sdp, rtp, rtcp, dns) or omitted.

areas:
  - { id: core, label: SIP core }
  - { id: ext, label: SIP extensions }
  - { id: media, label: Media }
  - { id: nat, label: NAT traversal }
  - { id: sec, label: Security and identity }
  - { id: mobile, label: WebRTC and IMS }
  - { id: guide, label: Guides and examples }

rfcs:
  # --- SIP core ---------------------------------------------------------------
