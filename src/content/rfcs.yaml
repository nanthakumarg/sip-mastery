  - { n: 5922, area: core, proto: sip, short: Domain certificates, summary: "How a SIP element checks the TLS certificate of a SIP domain.", modules: [14, 19] }
  - { n: 5923, area: core, proto: sip, short: Connection reuse, summary: "Lets a server send requests back over a TLS connection that the client opened.", modules: [19] }
