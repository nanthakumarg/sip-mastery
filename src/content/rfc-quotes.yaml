# Exact RFC quotes. `npm run verify:rfc` checks each `text` word for word
# against the cited section at rfc-editor.org. Line breaks and spacing are
# normalised; words and punctuation must match.

- id: rfc3261-22.2-challenge-401
  rfc: 3261
  section: "22.2"
  title: User-to-User Authentication
  text: >-
    If no credentials (in the Authorization header field) are provided in the
    request, the UAS can challenge the originator to provide credentials by
    rejecting the request with a 401 (Unauthorized) status code.

- id: rfc3261-22.2-www-authenticate
  rfc: 3261
  section: "22.2"
  title: User-to-User Authentication
  text: >-
    The WWW-Authenticate response-header field MUST be included in 401
    (Unauthorized) response messages.

- id: rfc3261-22.2-cseq-increment
  rfc: 3261
  section: "22.2"
  title: User-to-User Authentication
  text: >-
    When a UAC resubmits a request with its credentials after receiving a 401
    (Unauthorized) or 407 (Proxy Authentication Required) response, it MUST
    increment the CSeq header field value as it would normally when sending an
    updated request.

- id: rfc3261-22.3-challenge-407
  rfc: 3261
  section: "22.3"
  title: Proxy-to-User Authentication
  text: >-
    The proxy MUST populate the 407 (Proxy Authentication Required) message
    with a Proxy-Authenticate header field value applicable to the proxy for
    the requested resource.

- id: rfc3261-22.3-uac-adds
  rfc: 3261
  section: "22.3"
  title: Proxy-to-User Authentication
  text: >-
    Proxies MUST NOT add values to the Proxy-Authorization header field.

- id: rfc3261-22.3-consume-realm
  rfc: 3261
  section: "22.3"
  title: Proxy-to-User Authentication
  text: >-
    When multiple proxies are used in a chain, a Proxy-Authorization header
    field value MUST NOT be consumed by any proxy whose realm does not match
    the "realm" parameter specified in that value.

- id: rfc3261-22.1-ack-credentials
  rfc: 3261
  section: "22.1"
  title: Framework
  text: >-
    UACs creating an ACK message will duplicate all of the Authorization and
    Proxy-Authorization header field values that appeared in the INVITE to
    which the ACK corresponds.  Servers MUST NOT attempt to challenge an ACK.

- id: rfc3261-22.1-cancel
  rfc: 3261
  section: "22.1"
  title: Framework
  text: >-
    Although the CANCEL method does take a response (a 2xx), servers MUST NOT
    attempt to challenge CANCEL requests since these requests cannot be
    resubmitted.

- id: rfc3261-22.4-qop
  rfc: 3261
  section: "22.4"
  title: The Digest Authentication Scheme
  text: >-
    However, servers MUST always send a "qop" parameter in WWW-Authenticate and
    Proxy-Authenticate header field values.  If a client receives a "qop"
    parameter in a challenge header field, it MUST send the "qop" parameter in
    any resulting authorization header field.

- id: rfc3261-22.4-basic
  rfc: 3261
  section: "22.4"
  title: The Digest Authentication Scheme
  text: >-
    Note, however, that SIP servers MUST NOT accept or request Basic
    authentication.

- id: rfc3261-22.4-uri-check
  rfc: 3261
  section: "22.4"
  title: The Digest Authentication Scheme
  text: >-
    Therefore, in SIP, a server MAY check that the Request-URI in the
    Authorization header field value corresponds to a user for whom the server
    is willing to accept forwarded or direct requests, but it is not
    necessarily a failure if the two fields are not equivalent.

- id: rfc3261-17.1.1.3-ack-via
  rfc: 3261
  section: "17.1.1.3"
  title: Construction of the ACK Request
  text: >-
    The ACK MUST contain a single Via header field, and this MUST be equal to
    the top Via header field of the original request.  The CSeq header field in
    the ACK MUST contain the same value for the sequence number as was present
    in the original request, but the method parameter MUST be equal to "ACK".

- id: rfc3261-17.2.1-timer-g
  rfc: 3261
  section: "17.2.1"
  title: INVITE Server Transaction
  text: >-
    If timer G fires, the response is passed to the transport layer once more
    for retransmission, and timer G is set to fire in MIN(2*T1, T2) seconds.

- id: rfc3261-17.2.1-timer-h
  rfc: 3261
  section: "17.2.1"
  title: INVITE Server Transaction
  text: >-
    If timer H fires while in the "Completed" state, it implies that the ACK
    was never received.

- id: rfc8760-2.4-topmost
  rfc: 8760
  section: "2.4"
  title: UAC Behavior
  text: >-
    When the UAC receives a response with multiple
    WWW-Authenticate/Proxy-Authenticate header fields with the same realm, it SHOULD use the
    topmost header field that it supports unless a local policy dictates
    otherwise.

- id: rfc8760-2.3-order
  rfc: 8760
  section: "2.3"
  title: UAS Behavior
  text: >-
    The UAS MUST add these header fields to the response in the order in which
    it would prefer to see them used, starting with the most preferred
    algorithm at the top.

# --- Module 0 -------------------------------------------------------------

- id: rfc3261-2-control-protocol
  rfc: 3261
  section: "2"
  title: Overview of SIP Functionality
  text: >-
    SIP is an application-layer control protocol that can establish, modify,
    and terminate multimedia sessions (conferences) such as Internet telephony
    calls.

- id: rfc3261-2-component
  rfc: 3261
  section: "2"
  title: Overview of SIP Functionality
  text: >-
    SIP is not a vertically integrated communications system.  SIP is rather a
    component that can be used with other IETF protocols to build a complete
    multimedia architecture.

- id: rfc3261-4-media-path
  rfc: 3261
  section: "4"
  title: Overview of Operation
  text: >-
    In general, the end-to-end media packets take a different path from the
    SIP signaling messages.

- id: rfc3550-1-rtp
  rfc: 3550
  section: "1"
  title: Introduction
  text: >-
    This memorandum specifies the real-time transport protocol (RTP), which
    provides end-to-end delivery services for data with real-time
    characteristics, such as interactive audio and video.

- id: rfc8866-1-format
  rfc: 8866
  section: "1"
  title: Introduction
  text: >-
    SDP is purely a format for session description -- it does not incorporate
    a transport protocol, and it is intended to use different transport
    protocols as appropriate

- id: rfc3261-4-transaction-model
  rfc: 3261
  section: "4"
  title: Overview of Operation
  text: >-
    SIP is based on an HTTP-like request/response transaction model.  Each
    transaction consists of a request that invokes a particular method, or
    function, on the server and at least one response.

# --- Module 1 -------------------------------------------------------------

- id: rfc3261-2-primitives
  rfc: 3261
  section: "2"
  title: Overview of SIP Functionality
  text: >-
    SIP does not provide services.  Rather, SIP provides primitives that can
    be used to implement different services.

- id: rfc3261-7-text-based
  rfc: 3261
  section: "7"
  title: SIP Messages
  text: >-
    SIP is a text-based protocol and uses the UTF-8 charset (RFC 2279 [7]).

- id: rfc3261-7.3-like-http
  rfc: 3261
  section: "7.3"
  title: Header Fields
  text: >-
    SIP header fields are similar to HTTP header fields in both syntax and
    semantics.

- id: rfc2119-1-must
  rfc: 2119
  section: "1"
  title: MUST
  text: >-
    This word, or the terms "REQUIRED" or "SHALL", mean that the definition is
    an absolute requirement of the specification.

- id: rfc2119-3-should
  rfc: 2119
  section: "3"
  title: SHOULD
  text: >-
    This word, or the adjective "RECOMMENDED", mean that there may exist valid
    reasons in particular circumstances to ignore a particular item, but the
    full implications must be understood and carefully weighed before
    choosing a different course.

- id: rfc2119-5-may
  rfc: 2119
  section: "5"
  title: MAY
  text: >-
    This word, or the adjective "OPTIONAL", mean that an item is truly
    optional.

- id: rfc8174-1-uppercase
  rfc: 8174
  section: "1"
  title: Introduction
  text: >-
    This document updates RFC 2119 by clarifying that only UPPERCASE usage of
    the key words have the defined special meanings.

# --- Module 2 -------------------------------------------------------------

- id: rfc1918-3-private
  rfc: 1918
  section: "3"
  title: Private Address Space
  text: >-
    The Internet Assigned Numbers Authority (IANA) has reserved the following
    three blocks of the IP address space for private internets:

- id: rfc3261-18-udp-tcp
  rfc: 3261
  section: "18"
  title: Transport
  text: >-
    All SIP elements MUST implement UDP and TCP.

- id: rfc3261-18.1.1-1300
  rfc: 3261
  section: "18.1.1"
  title: Sending Requests
  text: >-
    If a request is within 200 bytes of the path MTU, or if it is larger than
    1300 bytes and the path MTU is unknown, the request MUST be sent using an
    RFC 2914 [43] congestion controlled transport protocol, such as TCP.

- id: rfc3261-17.1.2.2-timer-e
  rfc: 3261
  section: "17.1.2.2"
  title: Formal Description
  text: >-
    If an unreliable transport is in use, the client transaction MUST set
    timer E to fire in T1 seconds.

- id: rfc3550-11-even-port
  rfc: 3550
  section: "11"
  title: RTP over Network and Transport Protocols
  text: >-
    For UDP and similar protocols, RTP SHOULD use an even destination port
    number and the corresponding RTCP stream SHOULD use the next higher (odd)
    destination port number.

- id: rfc3581-4-rport
  rfc: 3581
  section: "4"
  title: Server Behavior
  text: >-
    If this Via header field value contains an "rport" parameter with no
    value, it MUST set the value of the parameter to the source port of the
    request.

- id: rfc4787-4.3-mapping-timer
  rfc: 4787
  section: "4.3"
  title: Mapping Refresh
  text: >-
    There is great variation in the values used by different NATs.

    REQ-5:  A NAT UDP mapping timer MUST NOT expire in less than two minutes,
    unless REQ-5a applies.

# --- Module 3: SIP elements and addresses ------------------------------------
- id: rfc3261-6-uac
  rfc: 3261
  section: "6"
  title: Definitions (User Agent Client)
  text: >-
    A user agent client is a logical entity that creates a new request, and
    then uses the client transaction state machinery to send it. The role of
    UAC lasts only for the duration of that transaction.

- id: rfc3261-6-uas
  rfc: 3261
  section: "6"
  title: Definitions (User Agent Server)
  text: >-
    A user agent server is a logical entity that generates a response to a SIP
    request. The response accepts, rejects, or redirects the request.

- id: rfc3261-6-proxy
  rfc: 3261
  section: "6"
  title: Definitions (Proxy Server)
  text: >-
    A proxy server primarily plays the role of routing, which means its job is
    to ensure that a request is sent to another entity "closer" to the
    targeted user.

- id: rfc3261-16.1-stateless-stateful
  rfc: 3261
  section: "16.1"
  title: Proxy Behavior, Overview
  text: >-
    A stateless proxy discards information about a message once the message
    has been forwarded. A stateful proxy remembers information (specifically,
    transaction state) about each incoming request and any requests it sends
    as a result of processing the incoming request.

- id: rfc3261-16.1-fork-stateful
  rfc: 3261
  section: "16.1"
  title: Proxy Behavior, Overview
  text: >-
    Any request that is forwarded to more than one location MUST be handled
    statefully.

- id: rfc3261-16.6-copy
  rfc: 3261
  section: "16.6"
  title: Request Forwarding
  text: >-
    The proxy MUST NOT reorder field values with a common field name (See
    Section 7.3.1). The proxy MUST NOT add to, modify, or remove the message
    body.

- id: rfc3261-16.6-request-uri
  rfc: 3261
  section: "16.6"
  title: Request Forwarding
  text: >-
    The Request-URI in the copy's start line MUST be replaced with the URI for
    this target.

- id: rfc3261-6-registrar
  rfc: 3261
  section: "6"
  title: Definitions (Registrar)
  text: >-
    A registrar is a server that accepts REGISTER requests and places the
    information it receives in those requests into the location service for
    the domain it handles.

- id: rfc3261-6-location-service
  rfc: 3261
  section: "6"
  title: Definitions (Location Service)
  text: >-
    It contains a list of bindings of address-of-record keys to zero or more
    contact addresses.

- id: rfc3261-6-redirect
  rfc: 3261
  section: "6"
  title: Definitions (Redirect Server)
  text: >-
    A redirect server is a user agent server that generates 3xx responses to
    requests it receives, directing the client to contact an alternate set of
    URIs.

- id: rfc3261-8.1.3.4-3xx
  rfc: 3261
  section: "8.1.3.4"
  title: Processing 3xx Responses
  text: >-
    Upon receipt of a redirection response (for example, a 301 response
    status code), clients SHOULD use the URI(s) in the Contact header field to
    formulate one or more new requests based on the redirected request.

- id: rfc3261-6-b2bua
  rfc: 3261
  section: "6"
  title: Definitions (Back-to-Back User Agent)
  text: >-
    Unlike a proxy server, it maintains dialog state and must participate in
    all requests sent on the dialogs it has established.

- id: rfc7092-3.1.2-signaling-only
  rfc: 7092
  section: "3.1.2"
  title: Signaling-only B2BUA
  text: >-
    No SIP header field is guaranteed to be copied from the received request
    on the UAS side to the generated request on the UAC side.

- id: rfc5853-2-sbc-b2bua
  rfc: 5853
  section: "2"
  title: Background on SBCs
  text: >-
    SBCs often modify certain SIP headers and message bodies that proxies are
    not allowed to modify. Consequently, they are, by definition, B2BUAs
    (Back-to-Back User Agents).

- id: rfc7092-4.3-sbc-default
  rfc: 7092
  section: "4.3"
  title: Session Border Controllers
  text: >-
    By default, most SBCs are either Media-relay or Media-aware B2BUAs and
    replace the Contact URI; remove the Via and Record-Route headers; modify
    Call-ID, To, From, and various other headers; and modify SDP.

- id: rfc3261-19.1.1-general-form
  rfc: 3261
  section: "19.1.1"
  title: SIP and SIPS URI Components
  text: >-
    Its general form, in the case of a SIP URI, is:
    sip:user:password@host:port;uri-parameters?headers

- id: rfc3261-19.1.1-password
  rfc: 3261
  section: "19.1.1"
  title: SIP and SIPS URI Components
  text: >-
    While the SIP and SIPS URI syntax allows this field to be present, its use
    is NOT RECOMMENDED, because the passing of authentication information in
    clear text (such as URIs) has proven to be a security risk in almost every
    case where it has been used.

- id: rfc3261-19.1.1-user-phone
  rfc: 3261
  section: "19.1.1"
  title: SIP and SIPS URI Components
  text: >-
    If the user string contains a telephone number formatted as a
    telephone-subscriber, the user parameter value "phone" SHOULD be present.

- id: rfc3261-19.1.1-ignore-params
  rfc: 3261
  section: "19.1.1"
  title: SIP and SIPS URI Components
  text: >-
    Since the uri-parameter mechanism is extensible, SIP elements MUST
    silently ignore any uri-parameters that they do not understand.

- id: rfc3261-19.1.4-case
  rfc: 3261
  section: "19.1.4"
  title: URI Comparison
  text: >-
    Comparison of the userinfo of SIP and SIPS URIs is case-sensitive. This
    includes userinfo containing passwords or formatted as
    telephone-subscribers. Comparison of all other components of the URI is
    case-insensitive unless explicitly defined otherwise.

- id: rfc3261-26.2.2-sips-hops
  rfc: 3261
  section: "26.2.2"
  title: SIPS URI Scheme
  text: >-
    When used as the Request-URI of a request, the SIPS scheme signifies that
    each hop over which the request is forwarded, until the request reaches
    the SIP entity responsible for the domain portion of the Request-URI, must
    be secured with TLS;

- id: rfc5630-4-all-hops
  rfc: 5630
  section: "4"
  title: Overview of Operations
  text: >-
    This will ensure that TLS is used on all hops all the way up to the remote
    target.

- id: rfc3966-5.1.4-global
  rfc: 3966
  section: "5.1.4"
  title: Global Numbers
  text: >-
    Globally unique numbers are identified by the leading "+" character.

- id: rfc3966-5.1.5-phone-context
  rfc: 3966
  section: "5.1.5"
  title: Local Numbers
  text: >-
    Local numbers MUST have a 'phone-context' parameter that identifies the
    scope of their validity.

- id: rfc3261-6-aor
  rfc: 3261
  section: "6"
  title: Definitions (Address-of-Record)
  text: >-
    An address-of-record (AOR) is a SIP or SIPS URI that points to a domain
    with a location service that can map the URI to another URI where the user
    might be available.

- id: rfc3261-10.1-bindings
  rfc: 3261
  section: "10.1"
  title: Registrations, Overview
  text: >-
    Thus, when a proxy for that domain receives a request whose Request-URI
    matches the address-of-record, the proxy will forward the request to the
    contact addresses registered to that address-of-record.

- id: rfc3261-16.5-empty-480
  rfc: 3261
  section: "16.5"
  title: Determining Request Targets
  text: >-
    If the target set remains empty after applying all of the above, the
    proxy MUST return an error response, which SHOULD be the 480 (Temporarily
    Unavailable) response.

# --- Module 4: Anatomy of a SIP message ---------------------------------------
- id: rfc3261-7-parts
  rfc: 3261
  section: "7"
  title: SIP Messages
  text: >-
    Both types of messages consist of a start-line, one or more header fields,
    an empty line indicating the end of the header fields, and an optional
    message-body.

- id: rfc3261-7-crlf
  rfc: 3261
  section: "7"
  title: SIP Messages
  text: >-
    The start-line, each message-header line, and the empty line MUST be
    terminated by a carriage-return line-feed sequence (CRLF). Note that the
    empty line MUST be present even if the message-body is not.

- id: rfc3261-7.1-request-line
  rfc: 3261
  section: "7.1"
  title: Requests
  text: >-
    A Request-Line contains a method name, a Request-URI, and the protocol
    version separated by a single space (SP) character.

- id: rfc3261-7.1-ruri-brackets
  rfc: 3261
  section: "7.1"
  title: Requests
  text: >-
    The Request-URI MUST NOT contain unescaped spaces or control characters
    and MUST NOT be enclosed in "<>".

- id: rfc3261-7.2-reason-phrase
  rfc: 3261
  section: "7.2"
  title: Responses
  text: >-
    The Status-Code is intended for use by automata, whereas the Reason-Phrase
    is intended for the human user. A client is not required to examine or
    display the Reason-Phrase.

- id: rfc3261-7.3.1-order
  rfc: 3261
  section: "7.3.1"
  title: Header Field Format
  text: >-
    The relative order of header fields with different field names is not
    significant.

- id: rfc3261-7.3.1-combine
  rfc: 3261
  section: "7.3.1"
  title: Header Field Format
  text: >-
    It MUST be possible to combine the multiple header field rows into one
    "field-name: field-value" pair, without changing the semantics of the
    message, by appending each subsequent field-value to the first, each
    separated by a comma.

- id: rfc3261-7.3.1-auth-not-combined
  rfc: 3261
  section: "7.3.1"
  title: Header Field Format
  text: >-
    Multiple header field rows with these names MAY be present in a message,
    but since their grammar does not follow the general form listed in
    Section 7.3, they MUST NOT be combined into a single header field row.

- id: rfc3261-7.3.1-case
  rfc: 3261
  section: "7.3.1"
  title: Header Field Format
  text: >-
    When comparing header fields, field names are always case-insensitive.
    Unless otherwise stated in the definition of a particular header field,
    field values, parameter names, and parameter values are case-insensitive.

- id: rfc3261-7.3.3-compact
  rfc: 3261
  section: "7.3.3"
  title: Compact Form
  text: >-
    A compact form MAY be substituted for the longer form of a header field
    name at any time without changing the semantics of the message. A header
    field name MAY appear in both long and short forms within the same
    message. Implementations MUST accept both the long and short forms of
    each header name.

- id: rfc3261-7.4.1-content-type
  rfc: 3261
  section: "7.4.1"
  title: Message Body Type
  text: >-
    The Internet media type of the message body MUST be given by the
    Content-Type header field.

- id: rfc3261-7.5-stream
  rfc: 3261
  section: "7.5"
  title: Framing SIP Messages
  text: >-
    The Content-Length header field value is used to locate the end of each
    SIP message in a stream. It will always be present when SIP messages are
    sent over stream-oriented transports.

- id: rfc3261-18.3-udp
  rfc: 3261
  section: "18.3"
  title: Framing
  text: >-
    If there are additional bytes in the transport packet beyond the end of
    the body, they MUST be discarded. If the transport packet ends before the
    end of the message body, this is considered an error. If the message is a
    response, it MUST be discarded. If the message is a request, the element
    SHOULD generate a 400 (Bad Request) response.

- id: rfc3261-20.14-octets
  rfc: 3261
  section: "20.14"
  title: Content-Length
  text: >-
    The size of the message-body does not include the CRLF separating header
    fields and body. Any Content-Length greater than or equal to zero is a
    valid value. If no body is present in a message, then the Content-Length
    header field value MUST be set to zero.

- id: rfc3261-20.10-brackets
  rfc: 3261
  section: "20.10"
  title: Contact
  text: >-
    If no "<" and ">" are present, all parameters after the URI are header
    parameters, not URI parameters.

- id: rfc3261-20.10-name-addr
  rfc: 3261
  section: "20.10"
  title: Contact
  text: >-
    Even if the "display-name" is empty, the "name-addr" form MUST be used if
    the "addr-spec" contains a comma, semicolon, or question mark.

- id: rfc3261-8.1.1.4-call-id-case
  rfc: 3261
  section: "8.1.1.4"
  title: Call-ID
  text: >-
    Call-IDs are case-sensitive and are simply compared byte-by-byte.

- id: rfc3261-20.16-cseq-case
  rfc: 3261
  section: "20.16"
  title: CSeq
  text: >-
    The method part of CSeq is case-sensitive.

- id: rfc3261-7.1-version-case
  rfc: 3261
  section: "7.1"
  title: Requests
  text: >-
    The SIP-Version string is case-insensitive, but implementations MUST send
    upper-case.

# --- Module 5: SIP methods ------------------------------------------------------
- id: rfc3261-9-no-effect
  rfc: 3261
  section: "9"
  title: Canceling a Request
  text: >-
    CANCEL has no effect on a request to which a UAS has already given a
    final response.

- id: rfc3261-9-hop-by-hop
  rfc: 3261
  section: "9"
  title: Canceling a Request
  text: >-
    For that reason, CANCEL is referred to as a "hop-by-hop" request, since it
    is responded to at each stateful proxy hop.

- id: rfc3261-9.1-wait-provisional
  rfc: 3261
  section: "9.1"
  title: Canceling a Request, Client Behavior
  text: >-
    If no provisional response has been received, the CANCEL request MUST NOT
    be sent; rather, the client MUST wait for the arrival of a provisional
    response before sending the request.

- id: rfc3261-9.2-487
  rfc: 3261
  section: "9.2"
  title: Canceling a Request, Server Behavior
  text: >-
    If the original request was an INVITE, the UAS SHOULD immediately respond
    to the INVITE with a 487 (Request Terminated).

- id: rfc3261-11-options
  rfc: 3261
  section: "11"
  title: Querying for Capabilities
  text: >-
    This allows a client to discover information about the supported methods,
    content types, extensions, codecs, etc. without "ringing" the other party.

- id: rfc3261-12.1-dialog-creation
  rfc: 3261
  section: "12.1"
  title: Creation of a Dialog
  text: >-
    Within this specification, only 2xx and 101-199 responses with a To tag,
    where the request was INVITE, will establish a dialog.

- id: rfc3261-13.2.2.4-ack-2xx
  rfc: 3261
  section: "13.2.2.4"
  title: 2xx Responses
  text: >-
    The UAC core MUST generate an ACK request for each 2xx received from the
    transaction layer.

- id: rfc3261-15-bye
  rfc: 3261
  section: "15"
  title: Terminating a Session
  text: >-
    A UA MUST NOT send a BYE outside of a dialog. The caller's UA MAY send a
    BYE for either confirmed or early dialogs, and the callee's UA MAY send a
    BYE on confirmed dialogs, but MUST NOT send a BYE on early dialogs.

- id: rfc3261-8.2.2.3-420
  rfc: 3261
  section: "8.2.2.3"
  title: Require
  text: >-
    If a UAS does not understand an option-tag listed in a Require header
    field, it MUST respond by generating a response with status code 420 (Bad
    Extension). The UAS MUST add an Unsupported header field, and list in it
    those options it does not understand amongst those in the Require header
    field of the request.

- id: rfc3261-20.37-supported
  rfc: 3261
  section: "20.37"
  title: Supported
  text: >-
    The Supported header field enumerates all the extensions supported by the
    UAC or UAS.

- id: rfc3261-20.29-proxy-require
  rfc: 3261
  section: "20.29"
  title: Proxy-Require
  text: >-
    The Proxy-Require header field is used to indicate proxy-sensitive
    features that must be supported by the proxy.

- id: rfc3261-21.4.16-421
  rfc: 3261
  section: "21.4.16"
  title: 421 Extension Required
  text: >-
    A UAS SHOULD NOT use this response unless it truly cannot provide any
    useful service to the client.

- id: rfc3262-1-prack
  rfc: 3262
  section: "1"
  title: Reliability of Provisional Responses, Introduction
  text: >-
    The PRACK request plays the same role as ACK, but for provisional
    responses.

- id: rfc3311-1-update
  rfc: 3311
  section: "1"
  title: The UPDATE Method, Introduction
  text: >-
    It can be sent by a UA within a dialog (early or confirmed) to update
    session parameters without impacting the dialog state itself.

- id: rfc6086-1-info
  rfc: 6086
  section: "1"
  title: The INFO Method, Introduction
  text: >-
    The purpose of the INFO message is to carry application level information
    between endpoints, using the SIP dialog signaling path.

- id: rfc6086-2-dtmf
  rfc: 6086
  section: "2"
  title: The INFO Method, Motivation
  text: >-
    Companies have been using INFO messages in order to transport Dual-Tone
    Multi-Frequency (DTMF) tones. All mechanisms are proprietary and have not
    been standardized.

- id: rfc6665-3.1.3-dialog
  rfc: 6665
  section: "3.1.3"
  title: Additional SUBSCRIBE Header Field Values
  text: >-
    Because SUBSCRIBE requests create a dialog usage as defined in [RFC3261],
    they MAY contain an "Accept" header field.

- id: rfc3515-1-transfer
  rfc: 3515
  section: "1"
  title: The REFER Method, Overview
  text: >-
    For instance, if Alice is in a call with Bob, and decides Bob needs to
    talk to Carol, Alice can instruct her SIP user agent (UA) to send a SIP
    REFER request to Bob's UA providing Carol's SIP Contact information.

- id: rfc3515-2.4.6-implicit
  rfc: 3515
  section: "2.4.6"
  title: Multiple REFER Requests in a Dialog
  text: >-
    A REFER creates an implicit subscription sharing the dialog identifiers in
    the REFER request.

- id: rfc3428-1-message
  rfc: 3428
  section: "1"
  title: The MESSAGE Method, Introduction
  text: >-
    MESSAGE requests normally carry the instant message content in the
    request body.

- id: rfc3903-1-publish
  rfc: 3903
  section: "1"
  title: Event State Publication, Introduction
  text: >-
    This specification provides a framework for the publication of event
    state from a user agent to an entity that is responsible for compositing
    this event state and distributing it to interested parties through the
    SIP Events [1] framework.

- id: rfc7647-5-no-202
  rfc: 7647
  section: "5"
  title: The 202 Response Code Is Deprecated
  text: >-
    Specifically, an element accepting a REFER request MUST NOT reply with a
    202 response code and MUST treat any 202 responses received as identical
    to a 200 response.

# --- Module 6: Response codes ---------------------------------------------------
- id: rfc3261-7.2-class
  rfc: 3261
  section: "7.2"
  title: Responses
  text: >-
    The first digit of the Status-Code defines the class of response. The
    last two digits do not have any categorization role.

- id: rfc3261-21.1-unreliable
  rfc: 3261
  section: "21.1"
  title: Provisional 1xx
  text: >-
    Note that 1xx responses are not transmitted reliably. They never cause the
    client to send an ACK.

- id: rfc3261-21.1.1-100
  rfc: 3261
  section: "21.1.1"
  title: 100 Trying
  text: >-
    The 100 (Trying) response is different from other provisional responses,
    in that it is never forwarded upstream by a stateful proxy.

- id: rfc3261-21.1.5-183
  rfc: 3261
  section: "21.1.5"
  title: 183 Session Progress
  text: >-
    The 183 (Session Progress) response is used to convey information about
    the progress of the call that is not otherwise classified.

- id: rfc3261-8.1.3.2-x00
  rfc: 3261
  section: "8.1.3.2"
  title: Unrecognized Responses
  text: >-
    A UAC MUST treat any final response it does not recognize as being
    equivalent to the x00 response code of that class, and MUST be able to
    process the x00 response code for all classes.

- id: rfc3261-8.1.3.2-183
  rfc: 3261
  section: "8.1.3.2"
  title: Unrecognized Responses
  text: >-
    A UAC MUST treat any provisional response different than 100 that it does
    not recognize as 183 (Session Progress).

- id: rfc3261-21.4.2-401
  rfc: 3261
  section: "21.4.2"
  title: 401 Unauthorized
  text: >-
    This response is issued by UASs and registrars, while 407 (Proxy
    Authentication Required) is used by proxy servers.

- id: rfc3261-21.5.4-503
  rfc: 3261
  section: "21.5.4"
  title: 503 Service Unavailable
  text: >-
    A client (proxy or UAC) receiving a 503 (Service Unavailable) SHOULD
    attempt to forward the request to an alternate server. It SHOULD NOT
    forward any other requests to that server for the duration specified in
    the Retry-After header field, if present.

- id: rfc3261-16.7-503
  rfc: 3261
  section: "16.7"
  title: Response Processing
  text: >-
    A proxy which receives a 503 (Service Unavailable) response SHOULD NOT
    forward it upstream unless it can determine that any subsequent requests
    it might proxy will also generate a 503.

- id: rfc3261-21.6.1-600
  rfc: 3261
  section: "21.6.1"
  title: 600 Busy Everywhere
  text: >-
    This status response is returned only if the client knows that no other
    end point (such as a voice mail system) will answer the request.
    Otherwise, 486 (Busy Here) should be returned.

- id: rfc3261-20.33-retry-after
  rfc: 3261
  section: "20.33"
  title: Retry-After
  text: >-
    The Retry-After header field can be used with a 500 (Server Internal
    Error) or 503 (Service Unavailable) response to indicate how long the
    service is expected to be unavailable to the requesting client

- id: rfc3261-20.43-warning
  rfc: 3261
  section: "20.43"
  title: Warning
  text: >-
    Warning header field values are sent with responses and contain a
    three-digit warning code, host name, and warning text.

- id: rfc3326-2-reason
  rfc: 3326
  section: "2"
  title: The Reason Header Field
  text: >-
    The Reason header field MAY appear in any request within a dialog, in any
    CANCEL request and in any response whose status code explicitly allows the
    presence of this header field.
