# Exact RFC quotes. `npm run verify:rfc` checks each `text` word for word
# against the cited section at rfc-editor.org. Line breaks and spacing are
# normalised; words and punctuation must match.

- id: rfc3261-22.2-challenge-401
  rfc: 3261
  section: "22.2"
  title: User-to-User Authentication
  text: >-
    If no credentials (in the Authorization header field) are provided in the
    request, the UAS can challenge the originator to provide credentials by
    rejecting the request with a 401 (Unauthorized) status code.

- id: rfc3261-22.2-www-authenticate
  rfc: 3261
  section: "22.2"
  title: User-to-User Authentication
  text: >-
    The WWW-Authenticate response-header field MUST be included in 401
    (Unauthorized) response messages.

- id: rfc3261-22.2-cseq-increment
  rfc: 3261
  section: "22.2"
  title: User-to-User Authentication
  text: >-
    When a UAC resubmits a request with its credentials after receiving a 401
    (Unauthorized) or 407 (Proxy Authentication Required) response, it MUST
    increment the CSeq header field value as it would normally when sending an
    updated request.

- id: rfc3261-22.3-challenge-407
  rfc: 3261
  section: "22.3"
  title: Proxy-to-User Authentication
  text: >-
    The proxy MUST populate the 407 (Proxy Authentication Required) message
    with a Proxy-Authenticate header field value applicable to the proxy for
    the requested resource.

- id: rfc3261-22.3-uac-adds
  rfc: 3261
  section: "22.3"
  title: Proxy-to-User Authentication
  text: >-
    Proxies MUST NOT add values to the Proxy-Authorization header field.

- id: rfc3261-22.3-consume-realm
  rfc: 3261
  section: "22.3"
  title: Proxy-to-User Authentication
  text: >-
    When multiple proxies are used in a chain, a Proxy-Authorization header
    field value MUST NOT be consumed by any proxy whose realm does not match
    the "realm" parameter specified in that value.

- id: rfc3261-22.1-ack-credentials
  rfc: 3261
  section: "22.1"
  title: Framework
  text: >-
    UACs creating an ACK message will duplicate all of the Authorization and
    Proxy-Authorization header field values that appeared in the INVITE to
    which the ACK corresponds.  Servers MUST NOT attempt to challenge an ACK.

- id: rfc3261-22.1-cancel
  rfc: 3261
  section: "22.1"
  title: Framework
  text: >-
    Although the CANCEL method does take a response (a 2xx), servers MUST NOT
    attempt to challenge CANCEL requests since these requests cannot be
    resubmitted.

- id: rfc3261-22.4-qop
  rfc: 3261
  section: "22.4"
  title: The Digest Authentication Scheme
  text: >-
    However, servers MUST always send a "qop" parameter in WWW-Authenticate and
    Proxy-Authenticate header field values.  If a client receives a "qop"
    parameter in a challenge header field, it MUST send the "qop" parameter in
    any resulting authorization header field.

- id: rfc3261-22.4-basic
  rfc: 3261
  section: "22.4"
  title: The Digest Authentication Scheme
  text: >-
    Note, however, that SIP servers MUST NOT accept or request Basic
    authentication.

- id: rfc3261-22.4-uri-check
  rfc: 3261
  section: "22.4"
  title: The Digest Authentication Scheme
  text: >-
    Therefore, in SIP, a server MAY check that the Request-URI in the
    Authorization header field value corresponds to a user for whom the server
    is willing to accept forwarded or direct requests, but it is not
    necessarily a failure if the two fields are not equivalent.

- id: rfc3261-17.1.1.3-ack-via
  rfc: 3261
  section: "17.1.1.3"
  title: Construction of the ACK Request
  text: >-
    The ACK MUST contain a single Via header field, and this MUST be equal to
    the top Via header field of the original request.  The CSeq header field in
    the ACK MUST contain the same value for the sequence number as was present
    in the original request, but the method parameter MUST be equal to "ACK".

- id: rfc3261-17.2.1-timer-g
  rfc: 3261
  section: "17.2.1"
  title: INVITE Server Transaction
  text: >-
    If timer G fires, the response is passed to the transport layer once more
    for retransmission, and timer G is set to fire in MIN(2*T1, T2) seconds.

- id: rfc3261-17.2.1-timer-h
  rfc: 3261
  section: "17.2.1"
  title: INVITE Server Transaction
  text: >-
    If timer H fires while in the "Completed" state, it implies that the ACK
    was never received.

- id: rfc8760-2.4-topmost
  rfc: 8760
  section: "2.4"
  title: UAC Behavior
  text: >-
    When the UAC receives a response with multiple
    WWW-Authenticate/Proxy-Authenticate header fields with the same realm, it SHOULD use the
    topmost header field that it supports unless a local policy dictates
    otherwise.

- id: rfc8760-2.3-order
  rfc: 8760
  section: "2.3"
  title: UAS Behavior
  text: >-
    The UAS MUST add these header fields to the response in the order in which
    it would prefer to see them used, starting with the most preferred
    algorithm at the top.

# --- Module 0 -------------------------------------------------------------

- id: rfc3261-2-control-protocol
  rfc: 3261
  section: "2"
  title: Overview of SIP Functionality
  text: >-
    SIP is an application-layer control protocol that can establish, modify,
    and terminate multimedia sessions (conferences) such as Internet telephony
    calls.

- id: rfc3261-2-component
  rfc: 3261
  section: "2"
  title: Overview of SIP Functionality
  text: >-
    SIP is not a vertically integrated communications system.  SIP is rather a
    component that can be used with other IETF protocols to build a complete
    multimedia architecture.

- id: rfc3261-4-media-path
  rfc: 3261
  section: "4"
  title: Overview of Operation
  text: >-
    In general, the end-to-end media packets take a different path from the
    SIP signaling messages.

- id: rfc3550-1-rtp
  rfc: 3550
  section: "1"
  title: Introduction
  text: >-
    This memorandum specifies the real-time transport protocol (RTP), which
    provides end-to-end delivery services for data with real-time
    characteristics, such as interactive audio and video.

- id: rfc8866-1-format
  rfc: 8866
  section: "1"
  title: Introduction
  text: >-
    SDP is purely a format for session description -- it does not incorporate
    a transport protocol, and it is intended to use different transport
    protocols as appropriate

- id: rfc3261-4-transaction-model
  rfc: 3261
  section: "4"
  title: Overview of Operation
  text: >-
    SIP is based on an HTTP-like request/response transaction model.  Each
    transaction consists of a request that invokes a particular method, or
    function, on the server and at least one response.

# --- Module 1 -------------------------------------------------------------

- id: rfc3261-2-primitives
  rfc: 3261
  section: "2"
  title: Overview of SIP Functionality
  text: >-
    SIP does not provide services.  Rather, SIP provides primitives that can
    be used to implement different services.

- id: rfc3261-7-text-based
  rfc: 3261
  section: "7"
  title: SIP Messages
  text: >-
    SIP is a text-based protocol and uses the UTF-8 charset (RFC 2279 [7]).

- id: rfc3261-7.3-like-http
  rfc: 3261
  section: "7.3"
  title: Header Fields
  text: >-
    SIP header fields are similar to HTTP header fields in both syntax and
    semantics.

- id: rfc2119-1-must
  rfc: 2119
  section: "1"
  title: MUST
  text: >-
    This word, or the terms "REQUIRED" or "SHALL", mean that the definition is
    an absolute requirement of the specification.

- id: rfc2119-3-should
  rfc: 2119
  section: "3"
  title: SHOULD
  text: >-
    This word, or the adjective "RECOMMENDED", mean that there may exist valid
    reasons in particular circumstances to ignore a particular item, but the
    full implications must be understood and carefully weighed before
    choosing a different course.

- id: rfc2119-5-may
  rfc: 2119
  section: "5"
  title: MAY
  text: >-
    This word, or the adjective "OPTIONAL", mean that an item is truly
    optional.

- id: rfc8174-1-uppercase
  rfc: 8174
  section: "1"
  title: Introduction
  text: >-
    This document updates RFC 2119 by clarifying that only UPPERCASE usage of
    the key words have the defined special meanings.

# --- Module 2 -------------------------------------------------------------

- id: rfc1918-3-private
  rfc: 1918
  section: "3"
  title: Private Address Space
  text: >-
    The Internet Assigned Numbers Authority (IANA) has reserved the following
    three blocks of the IP address space for private internets:

- id: rfc3261-18-udp-tcp
  rfc: 3261
  section: "18"
  title: Transport
  text: >-
    All SIP elements MUST implement UDP and TCP.

- id: rfc3261-18.1.1-1300
  rfc: 3261
  section: "18.1.1"
  title: Sending Requests
  text: >-
    If a request is within 200 bytes of the path MTU, or if it is larger than
    1300 bytes and the path MTU is unknown, the request MUST be sent using an
    RFC 2914 [43] congestion controlled transport protocol, such as TCP.

- id: rfc3261-17.1.2.2-timer-e
  rfc: 3261
  section: "17.1.2.2"
  title: Formal Description
  text: >-
    If an unreliable transport is in use, the client transaction MUST set
    timer E to fire in T1 seconds.

- id: rfc3550-11-even-port
  rfc: 3550
  section: "11"
  title: RTP over Network and Transport Protocols
  text: >-
    For UDP and similar protocols, RTP SHOULD use an even destination port
    number and the corresponding RTCP stream SHOULD use the next higher (odd)
    destination port number.

- id: rfc3581-4-rport
  rfc: 3581
  section: "4"
  title: Server Behavior
  text: >-
    If this Via header field value contains an "rport" parameter with no
    value, it MUST set the value of the parameter to the source port of the
    request.

- id: rfc4787-4.3-mapping-timer
  rfc: 4787
  section: "4.3"
  title: Mapping Refresh
  text: >-
    There is great variation in the values used by different NATs.

    REQ-5:  A NAT UDP mapping timer MUST NOT expire in less than two minutes,
    unless REQ-5a applies.

# --- Module 3: SIP elements and addresses ------------------------------------
- id: rfc3261-6-uac
  rfc: 3261
  section: "6"
  title: Definitions (User Agent Client)
  text: >-
    A user agent client is a logical entity that creates a new request, and
    then uses the client transaction state machinery to send it. The role of
    UAC lasts only for the duration of that transaction.

- id: rfc3261-6-uas
  rfc: 3261
  section: "6"
  title: Definitions (User Agent Server)
  text: >-
    A user agent server is a logical entity that generates a response to a SIP
    request. The response accepts, rejects, or redirects the request.

- id: rfc3261-6-proxy
  rfc: 3261
  section: "6"
  title: Definitions (Proxy Server)
  text: >-
    A proxy server primarily plays the role of routing, which means its job is
    to ensure that a request is sent to another entity "closer" to the
    targeted user.

- id: rfc3261-16.1-stateless-stateful
  rfc: 3261
  section: "16.1"
  title: Proxy Behavior, Overview
  text: >-
    A stateless proxy discards information about a message once the message
    has been forwarded. A stateful proxy remembers information (specifically,
    transaction state) about each incoming request and any requests it sends
    as a result of processing the incoming request.

- id: rfc3261-16.1-fork-stateful
  rfc: 3261
  section: "16.1"
  title: Proxy Behavior, Overview
  text: >-
    Any request that is forwarded to more than one location MUST be handled
    statefully.

- id: rfc3261-16.6-copy
  rfc: 3261
  section: "16.6"
  title: Request Forwarding
  text: >-
    The proxy MUST NOT reorder field values with a common field name (See
    Section 7.3.1). The proxy MUST NOT add to, modify, or remove the message
    body.

- id: rfc3261-16.6-request-uri
  rfc: 3261
  section: "16.6"
  title: Request Forwarding
  text: >-
    The Request-URI in the copy's start line MUST be replaced with the URI for
    this target.

- id: rfc3261-6-registrar
  rfc: 3261
  section: "6"
  title: Definitions (Registrar)
  text: >-
    A registrar is a server that accepts REGISTER requests and places the
    information it receives in those requests into the location service for
    the domain it handles.

- id: rfc3261-6-location-service
  rfc: 3261
  section: "6"
  title: Definitions (Location Service)
  text: >-
    It contains a list of bindings of address-of-record keys to zero or more
    contact addresses.

- id: rfc3261-6-redirect
  rfc: 3261
  section: "6"
  title: Definitions (Redirect Server)
  text: >-
    A redirect server is a user agent server that generates 3xx responses to
    requests it receives, directing the client to contact an alternate set of
    URIs.

- id: rfc3261-8.1.3.4-3xx
  rfc: 3261
  section: "8.1.3.4"
  title: Processing 3xx Responses
  text: >-
    Upon receipt of a redirection response (for example, a 301 response
    status code), clients SHOULD use the URI(s) in the Contact header field to
    formulate one or more new requests based on the redirected request.

- id: rfc3261-6-b2bua
  rfc: 3261
  section: "6"
  title: Definitions (Back-to-Back User Agent)
  text: >-
    Unlike a proxy server, it maintains dialog state and must participate in
    all requests sent on the dialogs it has established.

- id: rfc7092-3.1.2-signaling-only
  rfc: 7092
  section: "3.1.2"
  title: Signaling-only B2BUA
  text: >-
    No SIP header field is guaranteed to be copied from the received request
    on the UAS side to the generated request on the UAC side.

- id: rfc5853-2-sbc-b2bua
  rfc: 5853
  section: "2"
  title: Background on SBCs
  text: >-
    SBCs often modify certain SIP headers and message bodies that proxies are
    not allowed to modify. Consequently, they are, by definition, B2BUAs
    (Back-to-Back User Agents).

- id: rfc7092-4.3-sbc-default
  rfc: 7092
  section: "4.3"
  title: Session Border Controllers
  text: >-
    By default, most SBCs are either Media-relay or Media-aware B2BUAs and
    replace the Contact URI; remove the Via and Record-Route headers; modify
    Call-ID, To, From, and various other headers; and modify SDP.

- id: rfc3261-19.1.1-general-form
  rfc: 3261
  section: "19.1.1"
  title: SIP and SIPS URI Components
  text: >-
    Its general form, in the case of a SIP URI, is:
    sip:user:password@host:port;uri-parameters?headers

- id: rfc3261-19.1.1-password
  rfc: 3261
  section: "19.1.1"
  title: SIP and SIPS URI Components
  text: >-
    While the SIP and SIPS URI syntax allows this field to be present, its use
    is NOT RECOMMENDED, because the passing of authentication information in
    clear text (such as URIs) has proven to be a security risk in almost every
    case where it has been used.

- id: rfc3261-19.1.1-user-phone
  rfc: 3261
  section: "19.1.1"
  title: SIP and SIPS URI Components
  text: >-
    If the user string contains a telephone number formatted as a
    telephone-subscriber, the user parameter value "phone" SHOULD be present.

- id: rfc3261-19.1.1-ignore-params
  rfc: 3261
  section: "19.1.1"
  title: SIP and SIPS URI Components
  text: >-
    Since the uri-parameter mechanism is extensible, SIP elements MUST
    silently ignore any uri-parameters that they do not understand.

- id: rfc3261-19.1.4-case
  rfc: 3261
  section: "19.1.4"
  title: URI Comparison
  text: >-
    Comparison of the userinfo of SIP and SIPS URIs is case-sensitive. This
    includes userinfo containing passwords or formatted as
    telephone-subscribers. Comparison of all other components of the URI is
    case-insensitive unless explicitly defined otherwise.

- id: rfc3261-26.2.2-sips-hops
  rfc: 3261
  section: "26.2.2"
  title: SIPS URI Scheme
  text: >-
    When used as the Request-URI of a request, the SIPS scheme signifies that
    each hop over which the request is forwarded, until the request reaches
    the SIP entity responsible for the domain portion of the Request-URI, must
    be secured with TLS;

- id: rfc5630-4-all-hops
  rfc: 5630
  section: "4"
  title: Overview of Operations
  text: >-
    This will ensure that TLS is used on all hops all the way up to the remote
    target.

- id: rfc3966-5.1.4-global
  rfc: 3966
  section: "5.1.4"
  title: Global Numbers
  text: >-
    Globally unique numbers are identified by the leading "+" character.

- id: rfc3966-5.1.5-phone-context
  rfc: 3966
  section: "5.1.5"
  title: Local Numbers
  text: >-
    Local numbers MUST have a 'phone-context' parameter that identifies the
    scope of their validity.

- id: rfc3261-6-aor
  rfc: 3261
  section: "6"
  title: Definitions (Address-of-Record)
  text: >-
    An address-of-record (AOR) is a SIP or SIPS URI that points to a domain
    with a location service that can map the URI to another URI where the user
    might be available.

- id: rfc3261-10.1-bindings
  rfc: 3261
  section: "10.1"
  title: Registrations, Overview
  text: >-
    Thus, when a proxy for that domain receives a request whose Request-URI
    matches the address-of-record, the proxy will forward the request to the
    contact addresses registered to that address-of-record.

- id: rfc3261-16.5-empty-480
  rfc: 3261
  section: "16.5"
  title: Determining Request Targets
  text: >-
    If the target set remains empty after applying all of the above, the
    proxy MUST return an error response, which SHOULD be the 480 (Temporarily
    Unavailable) response.

# --- Module 4: Anatomy of a SIP message ---------------------------------------
- id: rfc3261-7-parts
  rfc: 3261
  section: "7"
  title: SIP Messages
  text: >-
    Both types of messages consist of a start-line, one or more header fields,
    an empty line indicating the end of the header fields, and an optional
    message-body.

- id: rfc3261-7-crlf
  rfc: 3261
  section: "7"
  title: SIP Messages
  text: >-
    The start-line, each message-header line, and the empty line MUST be
    terminated by a carriage-return line-feed sequence (CRLF). Note that the
    empty line MUST be present even if the message-body is not.

- id: rfc3261-7.1-request-line
  rfc: 3261
  section: "7.1"
  title: Requests
  text: >-
    A Request-Line contains a method name, a Request-URI, and the protocol
    version separated by a single space (SP) character.

- id: rfc3261-7.1-ruri-brackets
  rfc: 3261
  section: "7.1"
  title: Requests
  text: >-
    The Request-URI MUST NOT contain unescaped spaces or control characters
    and MUST NOT be enclosed in "<>".

- id: rfc3261-7.2-reason-phrase
  rfc: 3261
  section: "7.2"
  title: Responses
  text: >-
    The Status-Code is intended for use by automata, whereas the Reason-Phrase
    is intended for the human user. A client is not required to examine or
    display the Reason-Phrase.

- id: rfc3261-7.3.1-order
  rfc: 3261
  section: "7.3.1"
  title: Header Field Format
  text: >-
    The relative order of header fields with different field names is not
    significant.

- id: rfc3261-7.3.1-combine
  rfc: 3261
  section: "7.3.1"
  title: Header Field Format
  text: >-
    It MUST be possible to combine the multiple header field rows into one
    "field-name: field-value" pair, without changing the semantics of the
    message, by appending each subsequent field-value to the first, each
    separated by a comma.

- id: rfc3261-7.3.1-auth-not-combined
  rfc: 3261
  section: "7.3.1"
  title: Header Field Format
  text: >-
    Multiple header field rows with these names MAY be present in a message,
    but since their grammar does not follow the general form listed in
    Section 7.3, they MUST NOT be combined into a single header field row.

- id: rfc3261-7.3.1-case
  rfc: 3261
  section: "7.3.1"
  title: Header Field Format
  text: >-
    When comparing header fields, field names are always case-insensitive.
    Unless otherwise stated in the definition of a particular header field,
    field values, parameter names, and parameter values are case-insensitive.

- id: rfc3261-7.3.3-compact
  rfc: 3261
  section: "7.3.3"
  title: Compact Form
  text: >-
    A compact form MAY be substituted for the longer form of a header field
    name at any time without changing the semantics of the message. A header
    field name MAY appear in both long and short forms within the same
    message. Implementations MUST accept both the long and short forms of
    each header name.

- id: rfc3261-7.4.1-content-type
  rfc: 3261
  section: "7.4.1"
  title: Message Body Type
  text: >-
    The Internet media type of the message body MUST be given by the
    Content-Type header field.

- id: rfc3261-7.5-stream
  rfc: 3261
  section: "7.5"
  title: Framing SIP Messages
  text: >-
    The Content-Length header field value is used to locate the end of each
    SIP message in a stream. It will always be present when SIP messages are
    sent over stream-oriented transports.

- id: rfc3261-18.3-udp
  rfc: 3261
  section: "18.3"
  title: Framing
  text: >-
    If there are additional bytes in the transport packet beyond the end of
    the body, they MUST be discarded. If the transport packet ends before the
    end of the message body, this is considered an error. If the message is a
    response, it MUST be discarded. If the message is a request, the element
    SHOULD generate a 400 (Bad Request) response.

- id: rfc3261-20.14-octets
  rfc: 3261
  section: "20.14"
  title: Content-Length
  text: >-
    The size of the message-body does not include the CRLF separating header
    fields and body. Any Content-Length greater than or equal to zero is a
    valid value. If no body is present in a message, then the Content-Length
    header field value MUST be set to zero.

- id: rfc3261-20.10-brackets
  rfc: 3261
  section: "20.10"
  title: Contact
  text: >-
    If no "<" and ">" are present, all parameters after the URI are header
    parameters, not URI parameters.

- id: rfc3261-20.10-name-addr
  rfc: 3261
  section: "20.10"
  title: Contact
  text: >-
    Even if the "display-name" is empty, the "name-addr" form MUST be used if
    the "addr-spec" contains a comma, semicolon, or question mark.

- id: rfc3261-8.1.1.4-call-id-case
  rfc: 3261
  section: "8.1.1.4"
  title: Call-ID
  text: >-
    Call-IDs are case-sensitive and are simply compared byte-by-byte.

- id: rfc3261-20.16-cseq-case
  rfc: 3261
  section: "20.16"
  title: CSeq
  text: >-
    The method part of CSeq is case-sensitive.

- id: rfc3261-7.1-version-case
  rfc: 3261
  section: "7.1"
  title: Requests
  text: >-
    The SIP-Version string is case-insensitive, but implementations MUST send
    upper-case.

# --- Module 5: SIP methods ------------------------------------------------------
- id: rfc3261-9-no-effect
  rfc: 3261
  section: "9"
  title: Canceling a Request
  text: >-
    CANCEL has no effect on a request to which a UAS has already given a
    final response.

- id: rfc3261-9-hop-by-hop
  rfc: 3261
  section: "9"
  title: Canceling a Request
  text: >-
    For that reason, CANCEL is referred to as a "hop-by-hop" request, since it
    is responded to at each stateful proxy hop.

- id: rfc3261-9.1-wait-provisional
  rfc: 3261
  section: "9.1"
  title: Canceling a Request, Client Behavior
  text: >-
    If no provisional response has been received, the CANCEL request MUST NOT
    be sent; rather, the client MUST wait for the arrival of a provisional
    response before sending the request.

- id: rfc3261-9.2-487
  rfc: 3261
  section: "9.2"
  title: Canceling a Request, Server Behavior
  text: >-
    If the original request was an INVITE, the UAS SHOULD immediately respond
    to the INVITE with a 487 (Request Terminated).

- id: rfc3261-11-options
  rfc: 3261
  section: "11"
  title: Querying for Capabilities
  text: >-
    This allows a client to discover information about the supported methods,
    content types, extensions, codecs, etc. without "ringing" the other party.

- id: rfc3261-12.1-dialog-creation
  rfc: 3261
  section: "12.1"
  title: Creation of a Dialog
  text: >-
    Within this specification, only 2xx and 101-199 responses with a To tag,
    where the request was INVITE, will establish a dialog.

- id: rfc3261-13.2.2.4-ack-2xx
  rfc: 3261
  section: "13.2.2.4"
  title: 2xx Responses
  text: >-
    The UAC core MUST generate an ACK request for each 2xx received from the
    transaction layer.

- id: rfc3261-15-bye
  rfc: 3261
  section: "15"
  title: Terminating a Session
  text: >-
    A UA MUST NOT send a BYE outside of a dialog. The caller's UA MAY send a
    BYE for either confirmed or early dialogs, and the callee's UA MAY send a
    BYE on confirmed dialogs, but MUST NOT send a BYE on early dialogs.

- id: rfc3261-8.2.2.3-420
  rfc: 3261
  section: "8.2.2.3"
  title: Require
  text: >-
    If a UAS does not understand an option-tag listed in a Require header
    field, it MUST respond by generating a response with status code 420 (Bad
    Extension). The UAS MUST add an Unsupported header field, and list in it
    those options it does not understand amongst those in the Require header
    field of the request.

- id: rfc3261-20.37-supported
  rfc: 3261
  section: "20.37"
  title: Supported
  text: >-
    The Supported header field enumerates all the extensions supported by the
    UAC or UAS.

- id: rfc3261-20.29-proxy-require
  rfc: 3261
  section: "20.29"
  title: Proxy-Require
  text: >-
    The Proxy-Require header field is used to indicate proxy-sensitive
    features that must be supported by the proxy.

- id: rfc3261-21.4.16-421
  rfc: 3261
  section: "21.4.16"
  title: 421 Extension Required
  text: >-
    A UAS SHOULD NOT use this response unless it truly cannot provide any
    useful service to the client.

- id: rfc3262-1-prack
  rfc: 3262
  section: "1"
  title: Reliability of Provisional Responses, Introduction
  text: >-
    The PRACK request plays the same role as ACK, but for provisional
    responses.

- id: rfc3311-1-update
  rfc: 3311
  section: "1"
  title: The UPDATE Method, Introduction
  text: >-
    It can be sent by a UA within a dialog (early or confirmed) to update
    session parameters without impacting the dialog state itself.

- id: rfc6086-1-info
  rfc: 6086
  section: "1"
  title: The INFO Method, Introduction
  text: >-
    The purpose of the INFO message is to carry application level information
    between endpoints, using the SIP dialog signaling path.

- id: rfc6086-2-dtmf
  rfc: 6086
  section: "2"
  title: The INFO Method, Motivation
  text: >-
    Companies have been using INFO messages in order to transport Dual-Tone
    Multi-Frequency (DTMF) tones. All mechanisms are proprietary and have not
    been standardized.

- id: rfc6665-3.1.3-dialog
  rfc: 6665
  section: "3.1.3"
  title: Additional SUBSCRIBE Header Field Values
  text: >-
    Because SUBSCRIBE requests create a dialog usage as defined in [RFC3261],
    they MAY contain an "Accept" header field.

- id: rfc3515-1-transfer
  rfc: 3515
  section: "1"
  title: The REFER Method, Overview
  text: >-
    For instance, if Alice is in a call with Bob, and decides Bob needs to
    talk to Carol, Alice can instruct her SIP user agent (UA) to send a SIP
    REFER request to Bob's UA providing Carol's SIP Contact information.

- id: rfc3515-2.4.6-implicit
  rfc: 3515
  section: "2.4.6"
  title: Multiple REFER Requests in a Dialog
  text: >-
    A REFER creates an implicit subscription sharing the dialog identifiers in
    the REFER request.

- id: rfc3428-1-message
  rfc: 3428
  section: "1"
  title: The MESSAGE Method, Introduction
  text: >-
    MESSAGE requests normally carry the instant message content in the
    request body.

- id: rfc3903-1-publish
  rfc: 3903
  section: "1"
  title: Event State Publication, Introduction
  text: >-
    This specification provides a framework for the publication of event
    state from a user agent to an entity that is responsible for compositing
    this event state and distributing it to interested parties through the
    SIP Events [1] framework.

- id: rfc7647-5-no-202
  rfc: 7647
  section: "5"
  title: The 202 Response Code Is Deprecated
  text: >-
    Specifically, an element accepting a REFER request MUST NOT reply with a
    202 response code and MUST treat any 202 responses received as identical
    to a 200 response.

# --- Module 6: Response codes ---------------------------------------------------
- id: rfc3261-7.2-class
  rfc: 3261
  section: "7.2"
  title: Responses
  text: >-
    The first digit of the Status-Code defines the class of response. The
    last two digits do not have any categorization role.

- id: rfc3261-21.1-unreliable
  rfc: 3261
  section: "21.1"
  title: Provisional 1xx
  text: >-
    Note that 1xx responses are not transmitted reliably. They never cause the
    client to send an ACK.

- id: rfc3261-21.1.1-100
  rfc: 3261
  section: "21.1.1"
  title: 100 Trying
  text: >-
    The 100 (Trying) response is different from other provisional responses,
    in that it is never forwarded upstream by a stateful proxy.

- id: rfc3261-21.1.5-183
  rfc: 3261
  section: "21.1.5"
  title: 183 Session Progress
  text: >-
    The 183 (Session Progress) response is used to convey information about
    the progress of the call that is not otherwise classified.

- id: rfc3261-8.1.3.2-x00
  rfc: 3261
  section: "8.1.3.2"
  title: Unrecognized Responses
  text: >-
    A UAC MUST treat any final response it does not recognize as being
    equivalent to the x00 response code of that class, and MUST be able to
    process the x00 response code for all classes.

- id: rfc3261-8.1.3.2-183
  rfc: 3261
  section: "8.1.3.2"
  title: Unrecognized Responses
  text: >-
    A UAC MUST treat any provisional response different than 100 that it does
    not recognize as 183 (Session Progress).

- id: rfc3261-21.4.2-401
  rfc: 3261
  section: "21.4.2"
  title: 401 Unauthorized
  text: >-
    This response is issued by UASs and registrars, while 407 (Proxy
    Authentication Required) is used by proxy servers.

- id: rfc3261-21.5.4-503
  rfc: 3261
  section: "21.5.4"
  title: 503 Service Unavailable
  text: >-
    A client (proxy or UAC) receiving a 503 (Service Unavailable) SHOULD
    attempt to forward the request to an alternate server. It SHOULD NOT
    forward any other requests to that server for the duration specified in
    the Retry-After header field, if present.

- id: rfc3261-16.7-503
  rfc: 3261
  section: "16.7"
  title: Response Processing
  text: >-
    A proxy which receives a 503 (Service Unavailable) response SHOULD NOT
    forward it upstream unless it can determine that any subsequent requests
    it might proxy will also generate a 503.

- id: rfc3261-21.6.1-600
  rfc: 3261
  section: "21.6.1"
  title: 600 Busy Everywhere
  text: >-
    This status response is returned only if the client knows that no other
    end point (such as a voice mail system) will answer the request.
    Otherwise, 486 (Busy Here) should be returned.

- id: rfc3261-20.33-retry-after
  rfc: 3261
  section: "20.33"
  title: Retry-After
  text: >-
    The Retry-After header field can be used with a 500 (Server Internal
    Error) or 503 (Service Unavailable) response to indicate how long the
    service is expected to be unavailable to the requesting client

- id: rfc3261-20.43-warning
  rfc: 3261
  section: "20.43"
  title: Warning
  text: >-
    Warning header field values are sent with responses and contain a
    three-digit warning code, host name, and warning text.

- id: rfc3326-2-reason
  rfc: 3326
  section: "2"
  title: The Reason Header Field
  text: >-
    The Reason header field MAY appear in any request within a dialog, in any
    CANCEL request and in any response whose status code explicitly allows the
    presence of this header field.

# --- Module 7: Headers and parameters -------------------------------------------
- id: rfc3261-8.1.1-mandatory
  rfc: 3261
  section: "8.1.1"
  title: Generating the Request
  text: >-
    A valid SIP request formulated by a UAC MUST, at a minimum, contain the
    following header fields: To, From, CSeq, Call-ID, Max-Forwards, and Via;
    all of these header fields are mandatory in all SIP requests.

- id: rfc3261-19.3-tags
  rfc: 3261
  section: "19.3"
  title: Tags
  text: >-
    It serves as a general mechanism to identify a dialog, which is the
    combination of the Call-ID along with two tags, one from each participant
    in the dialog.

- id: rfc3261-19.3-forking
  rfc: 3261
  section: "19.3"
  title: Tags
  text: >-
    This also explains the need for the two-sided dialog identifier; without a
    contribution from the recipients, the originator could not disambiguate
    the multiple dialogs established from a single request.

- id: rfc3261-8.1.1.6-max-forwards
  rfc: 3261
  section: "8.1.1.6"
  title: Max-Forwards
  text: >-
    It consists of an integer that is decremented by one at each hop. If the
    Max-Forwards value reaches 0 before the request reaches its destination,
    it will be rejected with a 483(Too Many Hops) error response.

- id: rfc3261-18.2.1-received
  rfc: 3261
  section: "18.2.1"
  title: Receiving Requests
  text: >-
    If the host portion of the "sent-by" parameter contains a domain name, or
    if it contains an IP address that differs from the packet source address,
    the server MUST add a "received" parameter to that Via header field value.

- id: rfc3325-4-pai
  rfc: 3325
  section: "4"
  title: Asserted Identity, Overview
  text: >-
    A proxy server which handles a message can, after authenticating the
    originating user in some way (for example: Digest authentication), insert
    such a P-Asserted-Identity header field into the message and forward it to
    other trusted proxies.

- id: rfc3325-5-untrusted
  rfc: 3325
  section: "5"
  title: Proxy Behavior
  text: >-
    If the proxy received the message from an element that it does not trust
    and there is a P-Asserted-Identity header present which contains a SIP or
    SIPS URI, the proxy MUST replace that SIP or SIPS URI with a single SIP or
    SIPS URI or remove this header field.

- id: rfc3325-9.3-id
  rfc: 3325
  section: "9.3"
  title: The "id" Privacy Type
  text: >-
    The presence of this privacy type in a Privacy header field indicates that
    the user would like the Network Asserted Identity to be kept private with
    respect to SIP entities outside the Trust Domain with which the user
    authenticated.

- id: rfc3323-4.1-reveal
  rfc: 3323
  section: "4.1"
  title: Constructing Private Messages
  text: >-
    The following SIP headers, when generated by a user agent, can directly or
    indirectly reveal identity information about the originator of a message:
    From, Contact, Reply-To, Via, Call-Info, User-Agent, Organization, Server,
    Subject, Call-ID, In-Reply-To and Warning.

- id: rfc7044-1-history
  rfc: 7044
  section: "1"
  title: History-Info, Introduction
  text: >-
    This request history information allows the receiving application to
    obtain information about how and why the SIP request arrived at the
    application/user.

- id: rfc5806-3-diversion
  rfc: 5806
  section: "3"
  title: Diversion Indication, Overview
  text: >-
    Question 1: From whom was the request diverted? Question 2: Why was the
    request diverted?

- id: rfc4028-1-keepalive
  rfc: 4028
  section: "1"
  title: Session Timer, Introduction
  text: >-
    If a session refresh request is not received before the interval passes,
    the session is considered terminated. Both UAs are supposed to send a BYE,
    and call stateful proxies can remove any state for the call.

- id: rfc4028-4-1800
  rfc: 4028
  section: "4"
  title: Session-Expires Header Field Definition
  text: >-
    However, 1800 seconds (30 minutes) is RECOMMENDED as the value for the
    Session-Expires header field.

- id: rfc4028-7.2-half
  rfc: 4028
  section: "7.2"
  title: Processing a 2xx Response
  text: >-
    It is RECOMMENDED that this refresh be sent once half the session interval
    has elapsed.

- id: rfc5626-2.1-reg-id
  rfc: 5626
  section: "2.1"
  title: SIP Outbound, Definitions
  text: >-
    When a UA registers multiple times, each for a different flow, each
    concurrent registration gets a unique reg-id value.

# --- Module 8: Transactions -------------------------------------------------

- id: rfc3261-17-transaction
  rfc: 3261
  section: "17"
  title: Transactions
  text: >-
    Specifically, a SIP transaction consists of a single request and any
    responses to that request, which include zero or more provisional
    responses and one or more final responses.

- id: rfc3261-17-ack-2xx
  rfc: 3261
  section: "17"
  title: Transactions
  text: >-
    In the case of a transaction where the request was an INVITE (known as an
    INVITE transaction), the transaction also includes the ACK only if the
    final response was not a 2xx response.  If the response was a 2xx, the ACK
    is not considered part of the transaction.

- id: rfc3261-17-stateless
  rfc: 3261
  section: "17"
  title: Transactions
  text: >-
    A stateless proxy does not contain a client or server transaction.

- id: rfc3261-8.1.1.7-branch-unique
  rfc: 3261
  section: "8.1.1.7"
  title: Via
  text: >-
    The branch parameter value MUST be unique across space and time for all
    requests sent by the UA.  The exceptions to this rule are CANCEL and ACK
    for non-2xx responses.

- id: rfc3261-8.1.1.7-cookie
  rfc: 3261
  section: "8.1.1.7"
  title: Via
  text: >-
    The branch ID inserted by an element compliant with this specification
    MUST always begin with the characters "z9hG4bK".

- id: rfc3261-17.2.3-cookie
  rfc: 3261
  section: "17.2.3"
  title: Matching Requests to Server Transactions
  text: >-
    If it is present and begins with the magic cookie "z9hG4bK", the request
    was generated by a client transaction compliant to this specification.

- id: rfc3261-17.2.3-ack-method
  rfc: 3261
  section: "17.2.3"
  title: Matching Requests to Server Transactions
  text: >-
    the method of the request matches the one that created the transaction,
    except for ACK, where the method of the request that created the
    transaction is INVITE.

- id: rfc3261-17.1.3-cseq
  rfc: 3261
  section: "17.1.3"
  title: Matching Responses to Client Transactions
  text: >-
    The method is needed since a CANCEL request constitutes a different
    transaction, but shares the same value of the branch parameter.

- id: rfc3261-17.1.1.1-t1
  rfc: 3261
  section: "17.1.1.1"
  title: Overview of INVITE Transaction
  text: >-
    T1 is an estimate of the round-trip time (RTT), and it defaults to 500 ms.

- id: rfc3261-17.1.1.1-reliable
  rfc: 3261
  section: "17.1.1.1"
  title: Overview of INVITE Transaction
  text: >-
    The request is not retransmitted over reliable transports.

- id: rfc3261-17.1.1.2-timer-a
  rfc: 3261
  section: "17.1.1.2"
  title: Formal Description
  text: >-
    When timer A fires, the client transaction MUST retransmit the request by
    passing it to the transport layer, and MUST reset the timer with a value
    of 2*T1.

- id: rfc3261-17.1.1.2-timer-b
  rfc: 3261
  section: "17.1.1.2"
  title: Formal Description
  text: >-
    The value of 64*T1 is equal to the amount of time required to send seven
    requests in the case of an unreliable transport.

- id: rfc3261-17.1.1.2-timer-d
  rfc: 3261
  section: "17.1.1.2"
  title: Formal Description
  text: >-
    The client transaction SHOULD start timer D when it enters the "Completed"
    state, with a value of at least 32 seconds for unreliable transports, and
    a value of zero seconds for reliable transports.

- id: rfc3261-17.1.2.2-intervals
  rfc: 3261
  section: "17.1.2.2"
  title: Formal Description
  text: >-
    For the default values of T1 and T2, this results in intervals of 500 ms,
    1 s, 2 s, 4 s, 4 s, 4 s, etc.

- id: rfc3261-17.2.1-100
  rfc: 3261
  section: "17.2.1"
  title: INVITE Server Transaction
  text: >-
    This provisional response is needed to quench request retransmissions
    rapidly in order to avoid network congestion.

- id: rfc3261-13.2.2.4-ack-core
  rfc: 3261
  section: "13.2.2.4"
  title: 2xx Responses
  text: >-
    The UAC core MUST generate an ACK request for each 2xx received from the
    transaction layer.

- id: rfc3261-13.3.1.4-2xx-retransmit
  rfc: 3261
  section: "13.3.1.4"
  title: The INVITE is Accepted
  text: >-
    The 2xx response is passed to the transport with an interval that starts
    at T1 seconds and doubles for each retransmission until it reaches T2
    seconds (T1 and T2 are defined in Section 17).

- id: rfc3261-13.3.1.4-bye
  rfc: 3261
  section: "13.3.1.4"
  title: The INVITE is Accepted
  text: >-
    If the server retransmits the 2xx response for 64*T1 seconds without
    receiving an ACK, the dialog is confirmed, but the session SHOULD be
    terminated.

- id: rfc3261-9.1-cancel-via
  rfc: 3261
  section: "9.1"
  title: Client Behavior
  text: >-
    A CANCEL constructed by a client MUST have only a single Via header field
    value matching the top Via value in the request being cancelled.

- id: rfc3261-9.1-cancel-own
  rfc: 3261
  section: "9.1"
  title: Client Behavior
  text: >-
    However, the method part of the CSeq header field MUST have a value of
    CANCEL.  This allows it to be identified and processed as a transaction in
    its own right (See Section 17).

- id: rfc6026-3-problem
  rfc: 6026
  section: "3"
  title: Reason for Change
  text: >-
    Once any element with a server transaction (say, a proxy in the path of
    the INVITE) deletes that transaction state, any retransmission of the
    INVITE will be treated as a new request, potentially forwarded to
    different locations than the original.

- id: rfc6026-7.1-accepted
  rfc: 6026
  section: "7.1"
  title: Server Transaction Impacts
  text: >-
    To allow a SIP element to recognize retransmissions of an INVITE as
    retransmissions instead of new requests, a new state, "Accepted", is added
    to the INVITE server transaction state machine.

- id: rfc6026-7.3-stray
  rfc: 6026
  section: "7.3"
  title: Proxy Considerations
  text: >-
    The proxy MUST NOT forward the response if there is no matching
    transaction state machine.

- id: rfc4320-4.1-100
  rfc: 4320
  section: "4.1"
  title: Action 1
  text: >-
    An SIP element MUST NOT send any provisional response with a Status-Code
    other than 100 to a non-INVITE request.

- id: rfc4320-4.2-408
  rfc: 4320
  section: "4.2"
  title: Action 2
  text: >-
    A transaction-stateful SIP element MUST NOT send a response with
    Status-Code of 408 to a non-INVITE request.

# --- Module 9: Dialogs ------------------------------------------------------

- id: rfc3261-12-dialog
  rfc: 3261
  section: "12"
  title: Dialogs
  text: >-
    A dialog represents a peer-to-peer SIP relationship between two user
    agents that persists for some time.

- id: rfc3261-12-dialog-id
  rfc: 3261
  section: "12"
  title: Dialogs
  text: >-
    A dialog is identified at each UA with a dialog ID, which consists of a
    Call-ID value, a local tag and a remote tag.  The dialog ID at each UA
    involved in the dialog is not the same.  Specifically, the local tag at
    one UA is identical to the remote tag at the peer UA.

- id: rfc3261-12-state
  rfc: 3261
  section: "12"
  title: Dialogs
  text: >-
    This state consists of the dialog ID, a local sequence number (used to
    order requests from the UA to its peer), a remote sequence number (used
    to order requests from its peer to the UA), a local URI, a remote URI,
    remote target, a boolean flag called "secure", and a route set, which is
    an ordered list of URIs.

- id: rfc3261-12-early
  rfc: 3261
  section: "12"
  title: Dialogs
  text: >-
    A dialog can also be in the "early" state, which occurs when it is
    created with a provisional response, and then transition to the
    "confirmed" state when a 2xx final response arrives.  For other
    responses, or if no response arrives at all on that dialog, the early
    dialog terminates.

- id: rfc3261-12.1.1-route-set
  rfc: 3261
  section: "12.1.1"
  title: UAS behavior
  text: >-
    The route set MUST be set to the list of URIs in the Record-Route header
    field from the request, taken in order and preserving all URI parameters.

- id: rfc3261-12.1.2-route-set
  rfc: 3261
  section: "12.1.2"
  title: UAC Behavior
  text: >-
    The route set MUST be set to the list of URIs in the Record-Route header
    field from the response, taken in reverse order and preserving all URI
    parameters.

- id: rfc3261-12.2-target-refresh
  rfc: 3261
  section: "12.2"
  title: Requests within a Dialog
  text: >-
    Specifically, requests that are not target refresh requests do not modify
    the dialog's remote target URI, and requests that are target refresh
    requests do.

- id: rfc3261-12.2.1.1-cseq
  rfc: 3261
  section: "12.2.1.1"
  title: Generating the Request
  text: >-
    Requests within a dialog MUST contain strictly monotonically increasing
    and contiguous CSeq sequence numbers (increasing-by-one) in each
    direction (excepting ACK and CANCEL of course, whose numbers equal the
    requests being acknowledged or cancelled).

- id: rfc3261-12.2.1.1-target
  rfc: 3261
  section: "12.2.1.1"
  title: Generating the Request
  text: >-
    If the route set is not empty, and the first URI in the route set
    contains the lr parameter (see Section 19.1.1), the UAC MUST place the
    remote target URI into the Request-URI and MUST include a Route header
    field containing the route set values in order, including all
    parameters.

- id: rfc3261-12.2.2-refresh
  rfc: 3261
  section: "12.2.2"
  title: UAS Behavior
  text: >-
    When a UAS receives a target refresh request, it MUST replace the
    dialog's remote target URI with the URI from the Contact header field in
    that request, if present.

- id: rfc3261-12.2.2-481
  rfc: 3261
  section: "12.2.2"
  title: UAS Behavior
  text: >-
    If the UAS wishes to reject the request because it does not wish to
    recreate the dialog, it MUST respond to the request with a 481
    (Call/Transaction Does Not Exist) status code and pass that to the server
    transaction.

- id: rfc3261-12.2.1.2-terminate
  rfc: 3261
  section: "12.2.1.2"
  title: Processing the Responses
  text: >-
    If the response for a request within a dialog is a 481 (Call/Transaction
    Does Not Exist) or a 408 (Request Timeout), the UAC SHOULD terminate the
    dialog.

- id: rfc3261-13.2.2.4-forking
  rfc: 3261
  section: "13.2.2.4"
  title: 2xx Responses
  text: >-
    Multiple 2xx responses may arrive at the UAC for a single INVITE request
    due to a forking proxy.  Each response is distinguished by the tag
    parameter in the To header field, and each represents a distinct dialog,
    with a distinct dialog identifier.

- id: rfc3261-13.2.2.4-early-end
  rfc: 3261
  section: "13.2.2.4"
  title: 2xx Responses
  text: >-
    The UAC core considers the INVITE transaction completed 64*T1 seconds
    after the reception of the first 2xx response.  At this point all the
    early dialogs that have not transitioned to established dialogs are
    terminated.

- id: rfc3261-13.2.2.4-bye-extra
  rfc: 3261
  section: "13.2.2.4"
  title: 2xx Responses
  text: >-
    If, after acknowledging any 2xx response to an INVITE, the UAC does not
    want to continue with that dialog, then the UAC MUST terminate the dialog
    by sending a BYE request as described in Section 15.

- id: rfc3261-14.1-no-overlap
  rfc: 3261
  section: "14.1"
  title: UAC Behavior
  text: >-
    Note that a UAC MUST NOT initiate a new INVITE transaction within a
    dialog while another INVITE transaction is in progress in either
    direction.

- id: rfc3261-14.1-no-fork
  rfc: 3261
  section: "14.1"
  title: UAC Behavior
  text: >-
    Unlike an INVITE, which can fork, a re-INVITE will never fork, and
    therefore, only ever generate a single final response.

- id: rfc3261-14.1-491-timer
  rfc: 3261
  section: "14.1"
  title: UAC Behavior
  text: >-
    If the UAC is the owner of the Call-ID of the dialog ID (meaning it
    generated the value), T has a randomly chosen value between 2.1 and 4
    seconds in units of 10 ms.

- id: rfc3261-14.2-491
  rfc: 3261
  section: "14.2"
  title: UAS Behavior
  text: >-
    A UAS that receives an INVITE on a dialog while an INVITE it had sent on
    that dialog is in progress MUST return a 491 (Request Pending) response
    to the received INVITE.

- id: rfc4028-3-refresher
  rfc: 4028
  section: "3"
  title: Overview of Operation
  text: >-
    The Session-Expires header field also contains a 'refresher' parameter,
    which indicates who is doing the refreshing -- the UA that is currently
    the UAC, or the UA that is currently the UAS.

- id: rfc4028-3-session
  rfc: 4028
  section: "3"
  title: Overview of Operation
  text: >-
    Note that the session timer refreshes the session, not the dialog used to
    establish the session.

- id: rfc4028-10-bye
  rfc: 4028
  section: "10"
  title: Performing Refreshes
  text: >-
    Similarly, if the side not performing refreshes does not receive a
    session refresh request before the session expiration, it SHOULD send a
    BYE to terminate the session, slightly before the session expiration.
    The minimum of 32 seconds and one third of the session interval is
    RECOMMENDED.

# --- Module 10: Routing -------------------------------------------------------
- id: rfc3261-8.1.1.7-via
  rfc: 3261
  section: "8.1.1.7"
  title: Via
  text: >-
    The Via header field indicates the transport used for the transaction
    and identifies the location where the response is to be sent.

- id: rfc3261-16.6-via
  rfc: 3261
  section: "16.6"
  title: Request Forwarding
  text: >-
    The proxy MUST insert a Via header field value into the copy before the
    existing Via header field values.

- id: rfc3261-16.7-via-remove
  rfc: 3261
  section: "16.7"
  title: Response Processing
  text: >-
    The proxy removes the topmost Via header field value from the response.

    If no Via header field values remain in the response, the response was
    meant for this element and MUST NOT be forwarded.

- id: rfc3261-16.12-next-hop
  rfc: 3261
  section: "16.12"
  title: Summary of Proxy Route Processing
  text: >-
    The proxy will forward the request to the resource indicated by the URI
    in the topmost Route header field value or in the Request-URI if no Route
    header field is present.

- id: rfc3261-16.12-target
  rfc: 3261
  section: "16.12"
  title: Summary of Proxy Route Processing
  text: >-
    If no strict-routing elements are encountered on the path of the request,
    the Request-URI will always indicate the target of the request.

- id: rfc3261-18.2.2-reliable
  rfc: 3261
  section: "18.2.2"
  title: Sending Responses
  text: >-
    If the "sent-protocol" is a reliable transport protocol such as TCP or
    SCTP, or TLS over those, the response MUST be sent using the existing
    connection to the source of the original request that created the
    transaction, if that connection is still open.

- id: rfc3261-18.2.2-received
  rfc: 3261
  section: "18.2.2"
  title: Sending Responses
  text: >-
    Otherwise (for unreliable unicast transports), if the top Via has a
    "received" parameter, the response MUST be sent to the address in the
    "received" parameter, using the port indicated in the "sent-by" value, or
    using port 5060 if none is specified explicitly.

- id: rfc3581-4-response
  rfc: 3581
  section: "4"
  title: Server Behavior
  text: >-
    If the "sent-protocol" component indicates an unreliable unicast transport
    protocol, such as UDP, and there is no "maddr" parameter, but there is both
    a "received" parameter and an "rport" parameter, the response MUST be sent
    to the IP address listed in the "received" parameter, and the port in the
    "rport" parameter.  The response MUST be sent from the same address and
    port that the corresponding request was received on.

- id: rfc3581-4-received-always
  rfc: 3581
  section: "4"
  title: Server Behavior
  text: >-
    In fact, the server MUST insert a "received" parameter containing the
    source IP address that the request came from, even if it is identical to
    the value of the "sent-by" component.

- id: rfc3261-16.6-record-route
  rfc: 3261
  section: "16.6"
  title: Request Forwarding
  text: >-
    If this proxy wishes to remain on the path of future requests in a dialog
    created by this request (assuming the request creates a dialog), it MUST
    insert a Record-Route header field value into the copy before any existing
    Record-Route header field values, even if a Route header field is already
    present.

- id: rfc3261-16.6-rr-independent
  rfc: 3261
  section: "16.6"
  title: Request Forwarding
  text: >-
    Each proxy in the path of a request chooses whether to add a Record-Route
    header field value independently - the presence of a Record-Route header
    field in a request does not obligate this proxy to add a value.

- id: rfc3261-16.6-rr-cost
  rfc: 3261
  section: "16.6"
  title: Request Forwarding
  text: >-
    Record-routing may be required by certain services where the proxy needs
    to observe all messages in a dialog.  However, it slows down processing and
    impairs scalability and thus proxies should only record-route if required
    for a particular service.

- id: rfc3261-16.6-lr
  rfc: 3261
  section: "16.6"
  title: Request Forwarding
  text: >-
    The URI placed in the Record-Route header field value MUST be a SIP or
    SIPS URI.  This URI MUST contain an lr parameter (see Section 19.1.1).

- id: rfc3261-16.4-route-pop
  rfc: 3261
  section: "16.4"
  title: Route Information Preprocessing
  text: >-
    If the first value in the Route header field indicates this proxy, the
    proxy MUST remove that value from the request.

- id: rfc3261-12.2.1.1-loose
  rfc: 3261
  section: "12.2.1.1"
  title: Generating the Request
  text: >-
    If the route set is not empty, and the first URI in the route set contains
    the lr parameter (see Section 19.1.1), the UAC MUST place the remote target
    URI into the Request-URI and MUST include a Route header field containing
    the route set values in order, including all parameters.

- id: rfc3261-12.2.1.1-strict
  rfc: 3261
  section: "12.2.1.1"
  title: Generating the Request
  text: >-
    If the route set is not empty, and its first URI does not contain the lr
    parameter, the UAC MUST place the first URI from the route set into the
    Request-URI, stripping any parameters that are not allowed in a
    Request-URI.  The UAC MUST add a Route header field containing the
    remainder of the route set values in order, including all parameters.  The
    UAC MUST then place the remote target URI into the Route header field as
    the last value.

- id: rfc3261-6-loose-routing
  rfc: 3261
  section: "6"
  title: Definitions (Loose Routing)
  text: >-
    A proxy is said to be loose routing if it follows the procedures defined
    in this specification for processing of the Route header field.  These
    procedures separate the destination of the request (present in the
    Request-URI) from the set of proxies that need to be visited along the way
    (present in the Route header field).

- id: rfc3261-6-strict-routing
  rfc: 3261
  section: "6"
  title: Definitions (Strict Routing)
  text: >-
    That rule caused proxies to destroy the contents of the Request-URI when a
    Route header field was present.  Strict routing behavior is not used in
    this specification, in favor of a loose routing behavior.

- id: rfc3261-19.1.1-lr
  rfc: 3261
  section: "19.1.1"
  title: SIP and SIPS URI Components
  text: >-
    The lr parameter, when present, indicates that the element responsible for
    this resource implements the routing mechanisms specified in this
    document.

- id: rfc3261-16.4-strict
  rfc: 3261
  section: "16.4"
  title: Route Information Preprocessing
  text: >-
    If the Request-URI of the request contains a value this proxy previously
    placed into a Record-Route header field (see Section 16.6 item 4), the
    proxy MUST replace the Request-URI in the request with the last value from
    the Route header field, and remove that value from the Route header field.

- id: rfc3261-8.1.1.1-outbound
  rfc: 3261
  section: "8.1.1.1"
  title: Request-URI
  text: >-
    When a provider wishes to configure a UA with an outbound proxy, it is
    RECOMMENDED that this be done by providing it with a pre-existing route set
    with a single URI, that of the outbound proxy.

- id: rfc3261-8.1.2-first-route
  rfc: 3261
  section: "8.1.2"
  title: Sending the Request
  text: >-
    In particular, a UAC configured with an outbound proxy SHOULD attempt to
    send the request to the location indicated in the first Route header field
    value instead of adopting the policy of sending all messages to the
    outbound proxy.

    This ensures that outbound proxies that do not add Record-Route header
    field values will drop out of the path of subsequent requests.

- id: rfc3261-8.1.1.1-request-uri
  rfc: 3261
  section: "8.1.1.1"
  title: Request-URI
  text: >-
    The initial Request-URI of the message SHOULD be set to the value of the
    URI in the To field.

- id: rfc3261-8.1.1.2-to
  rfc: 3261
  section: "8.1.1.2"
  title: To
  text: >-
    The To header field first and foremost specifies the desired "logical"
    recipient of the request, or the address-of-record of the user or resource
    that is the target of this request.  This may or may not be the ultimate
    recipient of the request.

- id: rfc3261-6-loop
  rfc: 3261
  section: "6"
  title: Definitions (Loop)
  text: >-
    A request that arrives at a proxy, is forwarded, and later arrives back at
    the same proxy.  When it arrives the second time, its Request-URI is
    identical to the first time, and other header fields that affect proxy
    operation are unchanged, so that the proxy would make the same processing
    decision on the request it made the first time.

- id: rfc3261-6-spiral
  rfc: 3261
  section: "6"
  title: Definitions (Spiral)
  text: >-
    A spiral is a SIP request that is routed to a proxy, forwarded onwards, and
    arrives once again at that proxy, but this time differs in a way that will
    result in a different processing decision than the original request.
    Typically, this means that the request's Request-URI differs from its
    previous arrival.  A spiral is not an error condition, unlike a loop.

- id: rfc3261-16.3-loop
  rfc: 3261
  section: "16.3"
  title: Request Validation
  text: >-
    If the request contains a Via header field with a sent-by value that
    equals a value placed into previous requests by the proxy, the request has
    been forwarded by this element before.  The request has either looped or is
    legitimately spiraling through the element.

- id: rfc3261-16.3-482
  rfc: 3261
  section: "16.3"
  title: Request Validation
  text: >-
    If a loop is detected, the element MAY return a 482 (Loop Detected)
    response.

- id: rfc3261-16.6-max-forwards
  rfc: 3261
  section: "16.6"
  title: Request Forwarding
  text: >-
    If the copy contains a Max-Forwards header field, the proxy MUST decrement
    its value by one (1).

- id: rfc3261-16.3-483
  rfc: 3261
  section: "16.3"
  title: Request Validation
  text: >-
    If the request contains a Max-Forwards header field with a field value of
    zero (0), the element MUST NOT forward the request.  If the request was for
    OPTIONS, the element MAY act as the final recipient and respond per Section
    11.  Otherwise, the element MUST return a 483 (Too many hops) response.

- id: rfc3261-16.7-rr-rewrite
  rfc: 3261
  section: "16.7"
  title: Response Processing
  text: >-
    If the selected response contains a Record-Route header field value
    originally provided by this proxy, the proxy MAY choose to rewrite the
    value before forwarding the response.  This allows the proxy to provide
    different URIs for itself to the next upstream and downstream elements.
    A proxy may choose to use this mechanism for any reason.  For instance, it
    is useful for multi-homed hosts.

- id: rfc5658-4-rewrite
  rfc: 5658
  section: "4"
  title: Record-Route Rewriting
  text: >-
    Therefore, this document recommends using the double Record-Route approach
    to avoid rewriting the Record-Route.

- id: rfc5658-5-double
  rfc: 5658
  section: "5"
  title: Double Record-Routing
  text: >-
    This technique consists of inserting before any existing Record-Route
    header, a Record-Route header with the URI reflecting to the input
    interface, including schemes and/or URI parameters, and secondly, a
    Record-Route header with the URI reflecting to the output interface.

- id: rfc5658-5-remove-two
  rfc: 5658
  section: "5"
  title: Double Record-Routing
  text: >-
    So, this means, in Section 16.4, "Route Information Preprocessing"
    [RFC3261], implementors can choose that a proxy MAY remove two Route
    headers instead of one when using the double Record-Routing.

- id: rfc3261-12.1.1-copy-rr
  rfc: 3261
  section: "12.1.1"
  title: UAS behavior
  text: >-
    When a UAS responds to a request with a response that establishes a
    dialog (such as a 2xx to INVITE), the UAS MUST copy all Record-Route
    header field values from the request into the response (including the
    URIs, URI parameters, and any Record-Route header field parameters, whether
    they are known or unknown to the UAS) and MUST maintain the order of those
    values.

- id: rfc3261-12.2-route-set-fixed
  rfc: 3261
  section: "12.2"
  title: Requests within a Dialog
  text: >-
    Requests within a dialog MAY contain Record-Route and Contact header
    fields.  However, these requests do not cause the dialog's route set to be
    modified, although they may modify the remote target URI.

- id: rfc3261-12.2.1.1-empty
  rfc: 3261
  section: "12.2.1.1"
  title: Generating the Request
  text: >-
    If the route set is empty, the UAC MUST place the remote target URI into
    the Request-URI.  The UAC MUST NOT add a Route header field to the
    request.

# --- Module 11: Finding SIP servers with DNS ---------------------------------
- id: rfc3263-4-not-rewritten
  rfc: 3263
  section: "4"
  title: Client Usage
  text: >-
    The procedures defined here in no way affect this URI (i.e., the URI is
    not rewritten with the result of the DNS lookup), they only result in an
    IP address, port and transport protocol where the request can be sent.

- id: rfc3263-4-same-host
  rfc: 3263
  section: "4"
  title: Client Usage
  text: >-
    The procedures here MUST be done exactly once per transaction, where
    transaction is as defined in [1].  That is, once a SIP server has
    successfully been contacted (success is defined below), all
    retransmissions of the SIP request and the ACK for non-2xx SIP responses
    to INVITE MUST be sent to the same host.  Furthermore, a CANCEL for a
    particular SIP request MUST be sent to the same SIP server that the SIP
    request was delivered to.

- id: rfc3263-4-ack-2xx
  rfc: 3263
  section: "4"
  title: Client Usage
  text: >-
    Because the ACK request for 2xx responses to INVITE constitutes a
    different transaction, there is no requirement that it be delivered to the
    same server that received the original request (indeed, if that server did
    not record-route, it will not get the ACK).

- id: rfc3263-4.1-transport-param
  rfc: 3263
  section: "4.1"
  title: Selecting a Transport Protocol
  text: >-
    If the URI specifies a transport protocol in the transport parameter,
    that transport protocol SHOULD be used.

- id: rfc3263-4.1-numeric
  rfc: 3263
  section: "4.1"
  title: Selecting a Transport Protocol
  text: >-
    Otherwise, if no transport protocol is specified, but the TARGET is a
    numeric IP address, the client SHOULD use UDP for a SIP URI, and TCP for a
    SIPS URI.  Similarly, if no transport protocol is specified, and the
    TARGET is not numeric, but an explicit port is provided, the client SHOULD
    use UDP for a SIP URI, and TCP for a SIPS URI.

- id: rfc3263-4.1-naptr
  rfc: 3263
  section: "4.1"
  title: Selecting a Transport Protocol
  text: >-
    Otherwise, if no transport protocol or port is specified, and the target
    is not a numeric IP address, the client SHOULD perform a NAPTR query for
    the domain in the URI.

- id: rfc3263-4.1-sips-discard
  rfc: 3263
  section: "4.1"
  title: Selecting a Transport Protocol
  text: >-
    First, a client resolving a SIPS URI MUST discard any services that do
    not contain "SIPS" as the protocol in the service field.  The converse is
    not true, however.  A client resolving a SIP URI SHOULD retain records
    with "SIPS" as the protocol, if the client supports TLS.

- id: rfc3263-4.1-three-records
  rfc: 3263
  section: "4.1"
  title: Selecting a Transport Protocol
  text: >-
    If a SIP proxy, redirect server, or registrar is to be contacted through
    the lookup of NAPTR records, there MUST be at least three records - one
    with a "SIP+D2T" service field, one with a "SIP+D2U" service field, and
    one with a "SIPS+D2T" service field.

- id: rfc3263-4.1-no-naptr
  rfc: 3263
  section: "4.1"
  title: Selecting a Transport Protocol
  text: >-
    If no NAPTR records are found, the client constructs SRV queries for
    those transport protocols it supports, and does a query for each.

- id: rfc3263-4.1-no-srv
  rfc: 3263
  section: "4.1"
  title: Selecting a Transport Protocol
  text: >-
    If no SRV records are found, the client SHOULD use TCP for a SIPS URI,
    and UDP for a SIP URI.

- id: rfc3263-4.2-port
  rfc: 3263
  section: "4.2"
  title: Determining Port and IP Address
  text: >-
    If the TARGET was not a numeric IP address, but a port is present in the
    URI, the client performs an A or AAAA record lookup of the domain name.

- id: rfc3263-4.2-port-change
  rfc: 3263
  section: "4.2"
  title: Determining Port and IP Address
  text: >-
    This is a change from RFC 2543.  Previously, if the port was explicit,
    but with a value of 5060, SRV records were used.  Now, A or AAAA records
    will be used.

- id: rfc3263-4.2-no-srv
  rfc: 3263
  section: "4.2"
  title: Determining Port and IP Address
  text: >-
    If no SRV records were found, the client performs an A or AAAA record
    lookup of the domain name.  The result will be a list of IP addresses,
    each of which can be contacted using the transport protocol determined
    previously, at the default port for that transport.

- id: rfc3263-4.3-failure
  rfc: 3263
  section: "4.3"
  title: Details of RFC 2782 Process
  text: >-
    For SIP requests, failure occurs if the transaction layer reports a 503
    error response or a transport failure of some sort (generally, due to
    fatal ICMP errors in UDP or connection failures in TCP).  Failure also
    occurs if the transaction layer times out without ever having received
    any response, provisional or final (i.e., timer B or timer F in RFC 3261
    [1] fires).

- id: rfc3263-4.3-new-branch
  rfc: 3263
  section: "4.3"
  title: Details of RFC 2782 Process
  text: >-
    If a failure occurs, the client SHOULD create a new request, which is
    identical to the previous, but has a different value of the Via branch ID
    than the previous (and therefore constitutes a new SIP transaction).
    That request is sent to the next element in the list as specified by RFC
    2782.

- id: rfc2782-priority
  rfc: 2782
  section: "The format of the SRV RR"
  title: The format of the SRV RR
  text: >-
    A client MUST attempt to contact the target host with the lowest-numbered
    priority it can reach; target hosts with the same priority SHOULD be tried
    in an order defined by the weight field.

- id: rfc2782-weight
  rfc: 2782
  section: "The format of the SRV RR"
  title: The format of the SRV RR
  text: >-
    The weight field specifies a relative weight for entries with the same
    priority. Larger weights SHOULD be given a proportionately higher
    probability of being selected.

- id: rfc2782-weight-zero
  rfc: 2782
  section: "The format of the SRV RR"
  title: The format of the SRV RR
  text: >-
    Domain administrators SHOULD use Weight 0 when there isn't any server
    selection to do, to make the RR easier to read for humans (less noisy).
    In the presence of records containing weights greater than 0, records with
    weight 0 should have a very small chance of being selected.

- id: rfc2782-target
  rfc: 2782
  section: "The format of the SRV RR"
  title: The format of the SRV RR
  text: >-
    There MUST be one or more address records for this name, the name MUST
    NOT be an alias (in the sense of RFC 1034 or RFC 2181).

- id: rfc2782-target-dot
  rfc: 2782
  section: "The format of the SRV RR"
  title: The format of the SRV RR
  text: >-
    A Target of "." means that the service is decidedly not available at
    this domain.

- id: rfc2782-static
  rfc: 2782
  section: 'The "Weight" field'
  title: The "Weight" field
  text: >-
    Weight is only intended for static, not dynamic, server selection.

# --- Module 12: Registration ------------------------------------------------

- id: rfc3261-10.1-registration
  rfc: 3261
  section: "10.1"
  title: Registrations, Overview
  text: >-
    Registration creates bindings in a location service for a particular
    domain that associates an address-of-record URI with one or more contact
    addresses.

- id: rfc3261-10.2-no-dialog
  rfc: 3261
  section: "10.2"
  title: Constructing the REGISTER Request
  text: >-
    A REGISTER request does not establish a dialog.

- id: rfc3261-10.2-record-route
  rfc: 3261
  section: "10.2"
  title: Constructing the REGISTER Request
  text: >-
    The Record-Route header field has no meaning in REGISTER requests or
    responses, and MUST be ignored if present.

- id: rfc3261-10.2-request-uri
  rfc: 3261
  section: "10.2"
  title: Constructing the REGISTER Request
  text: >-
    The Request-URI names the domain of the location service for which the
    registration is meant (for example, "sip:chicago.com"). The "userinfo"
    and "@" components of the SIP URI MUST NOT be present.

- id: rfc3261-10.2-to
  rfc: 3261
  section: "10.2"
  title: Constructing the REGISTER Request
  text: >-
    The To header field contains the address of record whose registration is
    to be created, queried, or modified.

- id: rfc3261-10.2-from
  rfc: 3261
  section: "10.2"
  title: Constructing the REGISTER Request
  text: >-
    The value is the same as the To header field unless the request is a
    third-party registration.

- id: rfc3261-10.2-call-id
  rfc: 3261
  section: "10.2"
  title: Constructing the REGISTER Request
  text: >-
    All registrations from a UAC SHOULD use the same Call-ID header field
    value for registrations sent to a particular registrar.

- id: rfc3261-10.2-cseq
  rfc: 3261
  section: "10.2"
  title: Constructing the REGISTER Request
  text: >-
    A UA MUST increment the CSeq value by one for each REGISTER request with
    the same Call-ID.

- id: rfc3261-10.2-expires-param
  rfc: 3261
  section: "10.2"
  title: Constructing the REGISTER Request
  text: >-
    The "expires" parameter indicates how long the UA would like the binding
    to be valid. The value is a number indicating seconds. If this parameter
    is not provided, the value of the Expires header field is used instead.

- id: rfc3261-10.2.1-complete-list
  rfc: 3261
  section: "10.2.1"
  title: Adding Bindings
  text: >-
    The 2xx response to the REGISTER request will contain, in a Contact header
    field, a complete list of bindings that have been registered for this
    address-of-record at this registrar.

- id: rfc3261-10.2.1.1-server-chooses
  rfc: 3261
  section: "10.2.1.1"
  title: Setting the Expiration Interval of Contact Addresses
  text: >-
    If neither mechanism for expressing a suggested expiration time is present
    in a REGISTER, the client is indicating its desire for the server to
    choose.

- id: rfc3261-10.2.1.2-q
  rfc: 3261
  section: "10.2.1.2"
  title: Preferences among Contact Addresses
  text: >-
    This list can be prioritized with the "q" parameter in the Contact header
    field. The "q" parameter indicates a relative preference for the
    particular Contact header field value compared to other bindings for this
    address-of-record.

- id: rfc3261-10.2.2-soft
  rfc: 3261
  section: "10.2.2"
  title: Removing Bindings
  text: >-
    Registrations are soft state and expire unless refreshed, but can also be
    explicitly removed.

- id: rfc3261-10.2.2-zero
  rfc: 3261
  section: "10.2.2"
  title: Removing Bindings
  text: >-
    A UA requests the immediate removal of a binding by specifying an
    expiration interval of "0" for that contact address in a REGISTER
    request.

- id: rfc3261-10.2.2-star
  rfc: 3261
  section: "10.2.2"
  title: Removing Bindings
  text: >-
    The REGISTER-specific Contact header field value of "*" applies to all
    registrations, but it MUST NOT be used unless the Expires header field is
    present with a value of "0".

- id: rfc3261-10.2.3-fetch
  rfc: 3261
  section: "10.2.3"
  title: Fetching Bindings
  text: >-
    A success response to any REGISTER request contains the complete list of
    existing bindings, regardless of whether the request contained a Contact
    header field. If no Contact header field is present in a REGISTER
    request, the list of bindings is left unchanged.

- id: rfc3261-10.2.4-refresh
  rfc: 3261
  section: "10.2.4"
  title: Refreshing Bindings
  text: >-
    The UA then issues a REGISTER request for each of its bindings before the
    expiration interval has elapsed.

- id: rfc3261-10.2.4-compare
  rfc: 3261
  section: "10.2.4"
  title: Refreshing Bindings
  text: >-
    The UA compares each contact address to see if it created the contact
    address, using comparison rules in Section 19.1.4. If so, it updates the
    expiration time interval according to the expires parameter or, if
    absent, the Expires field value.

- id: rfc3261-10.2.4-boot-cycle
  rfc: 3261
  section: "10.2.4"
  title: Refreshing Bindings
  text: >-
    A UA SHOULD use the same Call-ID for all registrations during a single
    boot cycle.

- id: rfc3261-10.2.8-retry
  rfc: 3261
  section: "10.2.8"
  title: Error Responses
  text: >-
    If a UA receives a 423 (Interval Too Brief) response, it MAY retry the
    registration after making the expiration interval of all contact addresses
    in the REGISTER request equal to or greater than the expiration interval
    within the Min-Expires header field of the 423 (Interval Too Brief)
    response.

- id: rfc3261-10.3-aor
  rfc: 3261
  section: "10.3"
  title: Processing REGISTER Requests
  text: >-
    If the address-of-record is not valid for the domain in the Request-URI,
    the registrar MUST send a 404 (Not Found) response and skip the remaining
    steps.

- id: rfc3261-10.3-star-400
  rfc: 3261
  section: "10.3"
  title: Processing REGISTER Requests
  text: >-
    If the request has additional Contact fields or an expiration time other
    than zero, the request is invalid, and the server MUST return a 400
    (Invalid Request) and skip the remaining steps.

- id: rfc3261-10.3-order
  rfc: 3261
  section: "10.3"
  title: Processing REGISTER Requests
  text: >-
    If the value is higher than that of the existing binding, it MUST update
    or remove the binding as above. If not, the update MUST be aborted and
    the request fails.

- id: rfc3261-10.3-shorter
  rfc: 3261
  section: "10.3"
  title: Processing REGISTER Requests
  text: >-
    The registrar MAY choose an expiration less than the requested expiration
    interval.

- id: rfc3261-10.3-423
  rfc: 3261
  section: "10.3"
  title: Processing REGISTER Requests
  text: >-
    If and only if the requested expiration interval is greater than zero AND
    smaller than one hour AND less than a registrar-configured minimum, the
    registrar MAY reject the registration with a response of 423 (Interval
    Too Brief). This response MUST contain a Min-Expires header field that
    states the minimum expiration interval the registrar is willing to honor.

- id: rfc3261-10.3-brief
  rfc: 3261
  section: "10.3"
  title: Processing REGISTER Requests
  text: >-
    Therefore, registrars should accept brief registrations; a request should
    only be rejected if the interval is so short that the refreshes would
    degrade registrar performance.

- id: rfc3261-10.3-200
  rfc: 3261
  section: "10.3"
  title: Processing REGISTER Requests
  text: >-
    The response MUST contain Contact header field values enumerating all
    current bindings. Each Contact value MUST feature an "expires" parameter
    indicating its expiration interval chosen by the registrar.

- id: rfc3261-16.6-qvalue
  rfc: 3261
  section: "16.6"
  title: Request Forwarding
  text: >-
    Targets are processed from highest qvalue to lowest. Targets with equal
    qvalues may be processed in parallel.

- id: rfc4787-4.3-outbound-refresh
  rfc: 4787
  section: "4.3"
  title: Mapping Refresh
  text: >-
    REQ-6: The NAT mapping Refresh Direction MUST have a "NAT Outbound refresh
    behavior" of "True".

- id: rfc4787-4.3-five-minutes
  rfc: 4787
  section: "4.3"
  title: Mapping Refresh
  text: >-
    A default value of five minutes or more for the NAT UDP mapping timer is
    RECOMMENDED.

- id: rfc3327-4-future-dialogs
  rfc: 3327
  section: "4"
  title: Path Header Field Definition and Syntax
  text: >-
    Furthermore, the vector established by Record-Route applies only to
    requests within the dialog that established that Record-Route, whereas
    the vector established by Path applies to future dialogs.

- id: rfc3327-5.1-supported
  rfc: 3327
  section: "5.1"
  title: Procedures at the UA
  text: >-
    The UA SHOULD include the option tag "path" as a header field value in all
    Supported header fields, and SHOULD include a Supported header field in
    all requests.

- id: rfc3327-5.2-insert
  rfc: 3327
  section: "5.2"
  title: Procedures at Intermediate Proxies
  text: >-
    When a proxy processing a REGISTER request wishes to be on the path for
    future requests toward the UA originating that REGISTER request, the proxy
    inserts a URI for that proxy as the topmost value in the Path header field
    (or inserts a new topmost Path header) before proxying that request.

- id: rfc3327-5.3-store
  rfc: 3327
  section: "5.3"
  title: Procedures at the Registrar
  text: >-
    The registrar then stores this path vector in association with that
    contact and the address-of-record indicated in the REGISTER request (the
    "binding" as defined in [1]).

- id: rfc3327-5.4-route
  rfc: 3327
  section: "5.4"
  title: Procedures at the Home Proxy
  text: >-
    With the addition of Path, the home proxy also copies the stored path
    vector associated with the specific contact in the registrar database into
    the Route header field of the outgoing request as a preloaded route.

- id: rfc3608-3-service-route
  rfc: 3608
  section: "3"
  title: Discussion of Mechanism
  text: >-
    A registrar may use a Service-Route header field to inform a UA of a
    service route that, if used by the UA, will provide services from a proxy
    or set of proxies associated with that registrar.

- id: rfc3608-3-originating
  rfc: 3608
  section: "3"
  title: Discussion of Mechanism
  text: >-
    The routing established by the Service-Route mechanism applies only to
    requests originating in the user agent.

- id: rfc3608-6.1-preloaded
  rfc: 3608
  section: "6.1"
  title: Procedures at the UA
  text: >-
    If so, it uses the content of the Service-Route header field as a
    preloaded Route header field in outgoing initial requests [3].

- id: rfc5626-1-flow
  rfc: 5626
  section: "1"
  title: Introduction
  text: >-
    The key idea of this specification is that when a UA sends a REGISTER
    request or a dialog-forming request, the proxy can later use this same
    network "flow" -- whether this is a bidirectional stream of UDP datagrams,
    a TCP connection, or an analogous concept in another transport protocol --
    to forward any incoming requests that need to go to this UA in the context
    of the registration or dialog.

- id: rfc5626-3.1-instance
  rfc: 5626
  section: "3.1"
  title: Summary of Mechanism
  text: >-
    Each UA has a unique instance-id that stays the same for this UA even if
    the UA reboots or is power cycled.

- id: rfc5626-3.2-replace
  rfc: 5626
  section: "3.2"
  title: Single Registrar and UA
  text: >-
    If the instance-id and reg-id are the same as a previous registration for
    the same AOR, the registrar replaces the old Contact URI and flow
    information.

- id: rfc5626-3.5.1-crlf
  rfc: 5626
  section: "3.5.1"
  title: CRLF Keep-Alive Technique
  text: >-
    The client periodically sends a double-CRLF (the "ping") then waits to
    receive a single CRLF (the "pong").

- id: rfc5626-4.4.1-interval
  rfc: 5626
  section: "4.4.1"
  title: Keep-Alive with CRLF
  text: >-
    The fixed upper bound or the default configurable upper bound SHOULD be
    120 seconds (95 seconds for the lower bound) where battery power is not a
    concern and 840 seconds (672 seconds for the lower bound) where battery
    power is a concern.

- id: rfc5626-4.4.2-interval
  rfc: 5626
  section: "4.4.2"
  title: Keep-Alive with STUN
  text: >-
    When a Flow-Timer header field is not included in a successful
    registration response, the time between each keep-alive request SHOULD be
    a random number between 24 and 29 seconds.

- id: rfc5626-4.4.2-nat-30
  rfc: 5626
  section: "4.4.2"
  title: Keep-Alive with STUN
  text: >-
    Note on selection of time values: the upper bound of 29 seconds was
    selected, as many NATs have UDP timeouts as low as 30 seconds.

- id: rfc5626-6-one-flow
  rfc: 5626
  section: "6"
  title: Registrar Procedures
  text: >-
    Therefore, if the Contact header field contains more than one header field
    value with a non-zero expiration and any of these header field values
    contain a "reg-id" Contact header field parameter, the entire registration
    SHOULD be rejected with a 400 (Bad Request) response.

- id: rfc5627-1-gruu
  rfc: 5627
  section: "1"
  title: Introduction
  text: >-
    This specification describes a mechanism for providing a unique user-agent
    identifier which is still globally routable. This identifier is called a
    Globally Routable User Agent (UA) URI (GRUU).

- id: rfc5627-3.2-two-gruus
  rfc: 5627
  section: "3.2"
  title: Obtaining a GRUU
  text: >-
    The registrar detects this header field parameter and provides two GRUUs
    in the REGISTER response. One of these is a temporary GRUU, and the other
    is the public GRUU.

- id: rfc5627-3.1.1-public
  rfc: 5627
  section: "3.1.1"
  title: GRUUs That Expose the Underlying AOR
  text: >-
    It is constructed by taking the AOR, and adding the "gr" URI parameter
    with a value chosen by the registrar in the domain.

- id: rfc5627-3.3-contact
  rfc: 5627
  section: "3.3"
  title: Using a GRUU
  text: >-
    First, it uses them as the contents of the Contact header field in
    non-REGISTER requests and responses that it emits (for example, an INVITE
    request and 200 OK response).

# --- Module 14: SIP security ------------------------------------------------

- id: rfc3261-26.1-threats
  rfc: 3261
  section: "26.1"
  title: Attacks and Threat Models
  text: >-
    Attackers may wish to steal services, eavesdrop on communications, or
    disrupt sessions.

- id: rfc3261-26.1.1-hijack
  rfc: 3261
  section: "26.1.1"
  title: Registration Hijacking
  text: >-
    An attacker that successfully impersonates a party authorized to change
    contacts associated with an address-of-record could, for example,
    de-register all existing contacts for a URI and then register their own
    device as the appropriate contact address, thereby directing all requests
    for the affected user to the attacker's device.

- id: rfc3261-26.1.1-gateway
  rfc: 3261
  section: "26.1.1"
  title: Registration Hijacking
  text: >-
    Any SIP UAS that represents a valuable service (a gateway that interworks
    SIP requests with traditional telephone calls, for example) might want to
    control access to its resources by authenticating requests that it
    receives.

- id: rfc3261-26.1.3-sdp
  rfc: 3261
  section: "26.1.3"
  title: Tampering with Message Bodies
  text: >-
    Attackers might attempt to modify SDP bodies, for example, in order to
    point RTP media streams to a wiretapping device in order to eavesdrop on
    subsequent voice communications.

- id: rfc3261-26.1.5-internet
  rfc: 3261
  section: "26.1.5"
  title: Denial of Service and Amplification
  text: >-
    In many architectures, SIP proxy servers face the public Internet in order
    to accept requests from worldwide IP endpoints.

- id: rfc3261-26.1.5-forged-via
  rfc: 3261
  section: "26.1.5"
  title: Denial of Service and Amplification
  text: >-
    Attackers can create bogus requests that contain a falsified source IP
    address and a corresponding Via header field that identify a targeted host
    as the originator of the request and then send this request to a large
    number of SIP network elements, thereby using hapless SIP UAs or proxies to
    generate denial-of-service traffic aimed at the target.

- id: rfc3261-26.2-hop-by-hop
  rfc: 3261
  section: "26.2"
  title: Security Mechanisms
  text: >-
    Proxy servers must therefore be trusted, to some degree, by SIP UAs. To
    this purpose, low-layer security mechanisms for SIP are recommended, which
    encrypt the entire SIP requests or responses on the wire on a hop-by-hop
    basis, and that allow endpoints to verify the identity of proxy servers to
    whom they send requests.

- id: rfc3261-26.2.1-tls
  rfc: 3261
  section: "26.2.1"
  title: Transport and Network Layer Security
  text: >-
    Transport or network layer security encrypts signaling traffic,
    guaranteeing message confidentiality and integrity.

- id: rfc3261-26.2.2-mutual
  rfc: 3261
  section: "26.2.2"
  title: SIPS URI Scheme
  text: >-
    Certificates received in the authentication process SHOULD be validated
    with root certificates held by the client; failure to validate a
    certificate SHOULD result in the failure of the request.

- id: rfc3261-26.3.1-must-tls
  rfc: 3261
  section: "26.3.1"
  title: Requirements for Implementers of SIP
  text: >-
    Proxy servers, redirect servers, and registrars MUST implement TLS, and
    MUST support both mutual and one-way authentication.

- id: rfc3261-26.3.2.1-forge
  rfc: 3261
  section: "26.3.2.1"
  title: Registration
  text: >-
    Since the registrar requires the user agent to authenticate itself, it
    would be difficult for an attacker to forge REGISTER requests for the
    user's address-of-record.

- id: rfc3261-26.3.2.1-intercept
  rfc: 3261
  section: "26.3.2.1"
  title: Registration
  text: >-
    Also note that since the REGISTER is sent over a confidential TLS
    connection, attackers will not be able to intercept the REGISTER to record
    credentials for any possible replay attack.

- id: rfc3261-26.3.2.2-relay
  rfc: 3261
  section: "26.3.2.2"
  title: Interdomain Requests
  text: >-
    Such security policies could be instituted to prevent the SIP equivalent
    of SMTP 'open relays' that are frequently exploited to generate spam.

- id: rfc3261-26.3.2.4-bastion
  rfc: 3261
  section: "26.3.2.4"
  title: DoS Protection
  text: >-
    These bastion hosts can also take the brunt of denial-of-service attacks,
    ensuring that SIP hosts within the administrative domain are not
    encumbered with superfluous messaging.

- id: rfc3261-26.3.2.4-single
  rfc: 3261
  section: "26.3.2.4"
  title: DoS Protection
  text: >-
    UAs and proxy servers SHOULD challenge questionable requests with only a
    single 401 (Unauthorized) or 407 (Proxy Authentication Required), forgoing
    the normal response retransmission algorithm, and thus behaving
    statelessly towards unauthenticated requests.

- id: rfc3261-26.4.3-hop
  rfc: 3261
  section: "26.4.3"
  title: TLS
  text: >-
    TLS only allows SIP entities to authenticate servers to which they are
    adjacent; TLS offers strictly hop-by-hop security.

- id: rfc3261-26.4.4-not-e2e
  rfc: 3261
  section: "26.4.4"
  title: SIPS URIs
  text: >-
    Thus SIPS cannot guarantee that TLS usage will be truly end-to-end.

- id: rfc3325-1-trust-domain
  rfc: 3325
  section: "1"
  title: Applicability Statement
  text: >-
    Nodes in such a Trust Domain are explicitly trusted by its users and
    end-systems to publicly assert the identity of each party, and to be
    responsible for withholding that identity outside of the Trust Domain when
    privacy is requested.

- id: rfc3325-1-forgery
  rfc: 3325
  section: "1"
  title: Applicability Statement
  text: >-
    Furthermore, since the asserted identities are not cryptographically
    certified, they are subject to forgery, replay, and falsification in any
    architecture that does not meet the requirements of [5].

- id: rfc3325-8-uas
  rfc: 3325
  section: "8"
  title: User Agent Server Behavior
  text: >-
    However, if a User Agent Server receives a message from a previous element
    that it does not trust, it MUST NOT use the P-Asserted-Identity header
    field in any way.

- id: rfc3325-12-tls
  rfc: 3325
  section: "12"
  title: Security Considerations
  text: >-
    This information is secured by transitive trust, which is only as reliable
    as the weakest link in the chain of trust.

- id: rfc5630-3.1.2-servers
  rfc: 5630
  section: "3.1.2"
  title: Mutual Authentication
  text: >-
    For these reasons, mutual authentication is mostly used in server-to-server
    communications (e.g., between SIP proxies, or between proxies and gateways
    or media servers), and in environments where using certificates on both
    sides is possible (e.g., high-security devices used within an enterprise).

- id: rfc5630-3.1.3-best-effort
  rfc: 5630
  section: "3.1.3"
  title: Using TLS with SIP Instead of SIPS
  text: >-
    If one wants to use "best-effort TLS" for SIP, one just needs to use a SIP
    URI, and send the request over TLS.

- id: rfc5922-4-no-inference
  rfc: 5922
  section: "4"
  title: SIP Domain to Host Resolution
  text: >-
    For example, a valid certificate for "example.com" does not imply that the
    owner of that certificate has any relationship at all to
    "subname.example.com".

- id: rfc5922-6-provider
  rfc: 5922
  section: "6"
  title: Certificate Usage by a SIP Service Provider
  text: >-
    When assigning certificates to authoritative servers, a SIP service
    provider MUST ensure that the SIP domain used to reach the server appears
    as an identity in the subjectAltName field, or for compatibility with
    existing certificates, the Subject field of the certificate.

- id: rfc5922-7.1-validity
  rfc: 5922
  section: "7.1"
  title: Finding SIP Identities in a Certificate
  text: >-
    Implementations (both clients and server) MUST determine the validity of
    a certificate by following the procedures described in RFC 5280 [6].

- id: rfc5922-7.1-uri
  rfc: 5922
  section: "7.1"
  title: Finding SIP Identities in a Certificate
  text: >-
    If the scheme of the URI is not "sip", then the implementation MUST NOT
    accept the value as a SIP domain identity.

- id: rfc5922-7.1-userpart
  rfc: 5922
  section: "7.1"
  title: Finding SIP Identities in a Certificate
  text: >-
    If the scheme of the URI value is "sip", and the URI value that contains a
    userpart (there is an '@'), the implementation MUST NOT accept the value as
    a SIP domain identity (a value with a userpart identifies an individual
    user, not a domain).

- id: rfc5922-7.1-dns
  rfc: 5922
  section: "7.1"
  title: Finding SIP Identities in a Certificate
  text: >-
    An implementation MUST accept a domain name system identifier as a SIP
    domain identity if and only if no other identity is found that matches the
    "sip" URI type described above.

- id: rfc5922-7.1-cn
  rfc: 5922
  section: "7.1"
  title: Finding SIP Identities in a Certificate
  text: >-
    If and only if the subjectAltName does not appear in the certificate, the
    implementation MAY examine the CN field of the certificate.

- id: rfc5922-7.2-whole
  rfc: 5922
  section: "7.2"
  title: Comparing SIP Identities
  text: >-
    Implementations MUST NOT match suffixes. For example, "foo.example.com"
    does not match "example.com".

- id: rfc5922-7.2-wildcard
  rfc: 5922
  section: "7.2"
  title: Comparing SIP Identities
  text: >-
    Through the rule above, this document prohibits such wildcards in
    certificates for SIP domains.

- id: rfc5922-7.3-client
  rfc: 5922
  section: "7.3"
  title: Client Behavior
  text: >-
    Then, the client MUST compare the original domain portion of the SIP AUS
    used as input to the RFC 3263 [8] server location procedures to the SIP
    domain identities obtained from the certificate.

- id: rfc5922-7.3-close
  rfc: 5922
  section: "7.3"
  title: Client Behavior
  text: >-
    If the server is not authenticated, the client MUST close the connection
    immediately.

- id: rfc5922-7.4-peers
  rfc: 5922
  section: "7.4"
  title: Server Behavior
  text: >-
    For example, if the server is an inbound proxy that has peering
    relationships with the outbound proxies of other specific domains, the
    server might allow only connections authenticated as coming from those
    domains.

# --- Module 15: SDP and offer/answer ----------------------------------------

- id: rfc8866-5-order
  rfc: 8866
  section: "5"
  title: SDP Specification
  text: >-
    Some lines in each description are required and some are optional, but
    when present, they must appear in exactly the order given here.

- id: rfc8866-5-type
  rfc: 8866
  section: "5"
  title: SDP Specification
  text: >-
    Whitespace separators are not used on either side of the "=" sign,
    however, the value can contain a leading whitespace as part of its
    syntax, i.e., that whitespace is part of the value.

- id: rfc8866-5-unknown
  rfc: 8866
  section: "5"
  title: SDP Specification
  text: >-
    The set of type letters is deliberately small and not intended to be
    extensible -- an SDP parser MUST completely ignore or reject any session
    description that contains a type letter that it does not understand.

- id: rfc8866-5-sections
  rfc: 8866
  section: "5"
  title: SDP Specification
  text: >-
    An SDP description consists of a session-level section followed by zero
    or more media descriptions.

- id: rfc8866-5.1-version
  rfc: 8866
  section: "5.1"
  title: Protocol Version ("v=")
  text: >-
    This memo defines version 0. There is no minor version number.

- id: rfc8866-5.2-origin
  rfc: 8866
  section: "5.2"
  title: Origin ("o=")
  text: >-
    In general, the "o=" line serves as a globally unique identifier for
    this version of the session description, and the subfields excepting
    the version, taken together identify the session irrespective of any
    modifications.

- id: rfc8866-5.3-s
  rfc: 8866
  section: "5.3"
  title: Session Name ("s=")
  text: >-
    There MUST be one and only one "s=" line per session description. The
    "s=" line MUST NOT be empty.

- id: rfc8866-5.7-c
  rfc: 8866
  section: "5.7"
  title: Connection Information ("c=")
  text: >-
    A session description MUST contain either at least one "c=" line in
    each media description or a single "c=" line at the session level.

- id: rfc8866-5.14-m
  rfc: 8866
  section: "5.14"
  title: Media Descriptions ("m=")
  text: >-
    When a list of payload type numbers is given, this implies that all of
    these payload formats MAY be used in the session, and these payload
    formats are listed in order of preference, with the first format listed
    being preferred.

- id: rfc8866-6.4-ptime
  rfc: 8866
  section: "6.4"
  title: ptime (Packet Time)
  text: >-
    This gives the length of time in milliseconds represented by the media
    in a packet.

- id: rfc8866-6.5-maxptime
  rfc: 8866
  section: "6.5"
  title: maxptime (Maximum Packet Time)
  text: >-
    This gives the maximum amount of media that can be encapsulated in each
    packet, expressed as time in milliseconds.

- id: rfc8866-6.6-rtpmap
  rfc: 8866
  section: "6.6"
  title: rtpmap
  text: >-
    This attribute maps from an RTP payload type number (as used in an "m="
    line) to an encoding name denoting the payload format to be used.

- id: rfc8866-6.6-static
  rfc: 8866
  section: "6.6"
  title: rtpmap
  text: >-
    Although an RTP profile can make static assignments of payload type
    numbers to payload formats, it is more common for that assignment to be
    done dynamically using "a=rtpmap:" attributes.

- id: rfc8866-6.7-one
  rfc: 8866
  section: "6.7"
  title: Media Direction Attributes
  text: >-
    At most one occurrence of "a=recvonly", "a=sendrecv", "a=sendonly", or
    "a=inactive" MAY appear at session level, and at most one MAY appear in
    each media description.

- id: rfc8866-6.7-default
  rfc: 8866
  section: "6.7"
  title: Media Direction Attributes
  text: >-
    If none of the media direction attributes is present at either session
    level or media level, "a=sendrecv" SHOULD be assumed as the default.

- id: rfc8866-6.15-fmtp
  rfc: 8866
  section: "6.15"
  title: fmtp (Format Parameters)
  text: >-
    This attribute allows parameters that are specific to a particular
    format to be conveyed in a way that SDP does not have to understand
    them.

- id: rfc8866-6.15-format
  rfc: 8866
  section: "6.15"
  title: fmtp (Format Parameters)
  text: >-
    The format must be one of the formats specified for the media.

- id: rfc3551-3-dynamic
  rfc: 3551
  section: "3"
  title: Registering Additional Encodings
  text: >-
    This profile reserves payload type numbers in the range 96-127
    exclusively for dynamic assignment.

- id: rfc3551-3-mapping
  rfc: 3551
  section: "3"
  title: Registering Additional Encodings
  text: >-
    Dynamic payload types SHOULD NOT be used without a well-defined
    mechanism to indicate the mapping.

- id: rfc3551-3-static
  rfc: 3551
  section: "3"
  title: Registering Additional Encodings
  text: >-
    Redefining payload types below 96 may cause incorrect operation if an
    attempt is made to join a session without obtaining session description
    information that defines the dynamic payload types.

- id: rfc3551-4.5.2-g722
  rfc: 3551
  section: "4.5.2"
  title: G722
  text: >-
    Even though the actual sampling rate for G.722 audio is 16,000 Hz, the
    RTP clock rate for the G722 payload format is 8,000 Hz because that
    value was erroneously assigned in RFC 1890 and must remain unchanged for
    backward compatibility.

- id: rfc3264-4-pending
  rfc: 3264
  section: "4"
  title: Protocol Operation
  text: >-
    However, it MUST NOT generate a new offer if it has received an offer
    which it has not yet answered or rejected.

- id: rfc3264-4-atomic
  rfc: 3264
  section: "4"
  title: Protocol Operation
  text: >-
    The offer/answer exchange is atomic; if the answer is rejected, the
    session reverts to the state prior to the offer (which may be absence of
    a session).

- id: rfc3264-5-t
  rfc: 3264
  section: "5"
  title: Generating the Initial Offer
  text: >-
    Generally, streams for unicast sessions are created and destroyed
    through external signaling means, such as SIP. In that case, the "t="
    line SHOULD have a value of "0 0".

- id: rfc3264-5-zero
  rfc: 3264
  section: "5"
  title: Generating the Initial Offer
  text: >-
    Zero media streams implies that the offerer wishes to communicate, but
    that the streams for the session will be added at a later time through a
    modified offer.

- id: rfc3264-5.1-sendonly
  rfc: 3264
  section: "5.1"
  title: Unicast Streams
  text: >-
    If the offerer wishes to only send media on a stream to its peer, it
    MUST mark the stream as sendonly with the "a=sendonly" attribute.

- id: rfc3264-5.1-address
  rfc: 3264
  section: "5.1"
  title: Unicast Streams
  text: >-
    For recvonly and sendrecv streams, the port number and address in the
    offer indicate where the offerer would like to receive the media stream.

- id: rfc3264-5.1-preference
  rfc: 3264
  section: "5.1"
  title: Unicast Streams
  text: >-
    In all cases, the formats in the "m=" line MUST be listed in order of
    preference, with the first format listed being preferred.

- id: rfc3264-5.1-pt-send
  rfc: 3264
  section: "5.1"
  title: Unicast Streams
  text: >-
    However, for sendonly and sendrecv streams, the answer might indicate
    different payload type numbers for the same codecs, in which case, the
    offerer MUST send with the payload type numbers from the answer.

- id: rfc3264-5.1-ptime
  rfc: 3264
  section: "5.1"
  title: Unicast Streams
  text: >-
    If the ptime attribute is present for a stream, it indicates the desired
    packetization interval that the offerer would like to receive. The ptime
    attribute MUST be greater than zero.

- id: rfc3264-5.1-bandwidth
  rfc: 3264
  section: "5.1"
  title: Unicast Streams
  text: >-
    If the bandwidth attribute is present for a stream, it indicates the
    desired bandwidth that the offerer would like to receive.

- id: rfc3264-6-origin
  rfc: 3264
  section: "6"
  title: Generating the Answer
  text: >-
    If the answer is different from the offer in any way (different IP
    addresses, ports, etc.), the origin line MUST be different in the
    answer, since the answer is generated by a different entity.

- id: rfc3264-6-mlines
  rfc: 3264
  section: "6"
  title: Generating the Answer
  text: >-
    The answer MUST contain exactly the same number of "m=" lines as the
    offer. This allows for streams to be matched up based on their order.

- id: rfc3264-6-reject
  rfc: 3264
  section: "6"
  title: Generating the Answer
  text: >-
    To reject an offered stream, the port number in the corresponding stream
    in the answer MUST be set to zero.

- id: rfc3264-6.1-direction
  rfc: 3264
  section: "6.1"
  title: Unicast Streams
  text: >-
    If a stream is offered as sendonly, the corresponding stream MUST be
    marked as recvonly or inactive in the answer. If a media stream is
    listed as recvonly in the offer, the answer MUST be marked as sendonly
    or inactive in the answer.

- id: rfc3264-6.1-common
  rfc: 3264
  section: "6.1"
  title: Unicast Streams
  text: >-
    For streams marked as sendrecv in the answer, the "m=" line MUST contain
    at least one codec the answerer is willing to both send and receive,
    from amongst those listed in the offer.

- id: rfc3264-6.1-no-common
  rfc: 3264
  section: "6.1"
  title: Unicast Streams
  text: >-
    If the answerer has no media formats in common for a particular offered
    stream, the answerer MUST reject that media stream by setting the port
    to zero.

- id: rfc3264-6.1-pt-same
  rfc: 3264
  section: "6.1"
  title: Unicast Streams
  text: >-
    In the case of RTP, if a particular codec was referenced with a specific
    payload type number in the offer, that same payload type number SHOULD
    be used for that codec in the answer.

- id: rfc3264-6.1-rtpmap
  rfc: 3264
  section: "6.1"
  title: Unicast Streams
  text: >-
    Even if the same payload type number is used, the answer MUST contain
    rtpmap attributes to define the payload type mappings for dynamic
    payload types, and SHOULD contain mappings for static payload types.

- id: rfc3264-6.1-order
  rfc: 3264
  section: "6.1"
  title: Unicast Streams
  text: >-
    Although the answerer MAY list the formats in their desired order of
    preference, it is RECOMMENDED that unless there is a specific reason,
    the answerer list formats in the same relative order they were present
    in the offer.

- id: rfc3264-6.1-answerer-send
  rfc: 3264
  section: "6.1"
  title: Unicast Streams
  text: >-
    The answerer MUST send using a media format in the offer that is also
    listed in the answer, and SHOULD send using the most preferred media
    format in the offer that is also listed in the answer. In the case of
    RTP, it MUST use the payload type numbers from the offer, even if they
    differ from those in the answer.

- id: rfc3264-7-first
  rfc: 3264
  section: "7"
  title: Offerer Processing of the Answer
  text: >-
    It MUST send using a media format listed in the answer, and it SHOULD
    use the first media format listed in the answer when it does send.

- id: rfc3264-8-version
  rfc: 3264
  section: "8"
  title: Modifying the Session
  text: >-
    When issuing an offer that modifies the session, the "o=" line of the
    new SDP MUST be identical to that in the previous SDP, except that the
    version in the origin field MUST increment by one from the previous SDP.

- id: rfc3264-8-same
  rfc: 3264
  section: "8"
  title: Modifying the Session
  text: >-
    If the version in the origin line does not increment, the SDP MUST be
    identical to the SDP with that version number. The answerer MUST be
    prepared to receive an offer that contains SDP with a version that has
    not changed; this is effectively a no-op.

- id: rfc3264-8-mlines
  rfc: 3264
  section: "8"
  title: Modifying the Session
  text: >-
    Deleted media streams from a previous SDP MUST NOT be removed in a new
    SDP; however, attributes for these streams need not be present.

- id: rfc3264-8.3.2-pt-fixed
  rfc: 3264
  section: "8.3.2"
  title: Changing the Set of Media Formats
  text: >-
    However, in the case of RTP, the mapping from a particular dynamic
    payload type number to a particular codec within that media stream MUST
    NOT change for the duration of a session.

- id: rfc3264-8.4-hold
  rfc: 3264
  section: "8.4"
  title: Putting a Unicast Media Stream on Hold
  text: >-
    If the stream to be placed on hold was previously a sendrecv media
    stream, it is placed on hold by marking it as sendonly. If the stream to
    be placed on hold was previously a recvonly media stream, it is placed
    on hold by marking it inactive.

- id: rfc3264-8.4-zero
  rfc: 3264
  section: "8.4"
  title: Putting a Unicast Media Stream on Hold
  text: >-
    Its usage for putting a call on hold is no longer recommended, since it
    doesn't allow for RTCP to be used with held streams, doesn't work with
    IPv6, and breaks with connection oriented media.

- id: rfc3261-13.2.1-patterns
  rfc: 3261
  section: "13.2.1"
  title: Creating the Initial INVITE
  text: >-
    Concretely, the above rules specify two exchanges for UAs compliant to
    this specification alone - the offer is in the INVITE, and the answer in
    the 2xx (and possibly in a 1xx as well, with the same value), or the
    offer is in the 2xx, and the answer is in the ACK.

- id: rfc3261-13.2.1-first-answer
  rfc: 3261
  section: "13.2.1"
  title: Creating the Initial INVITE
  text: >-
    The UAC MUST treat the first session description it receives as the
    answer, and MUST ignore any session descriptions in subsequent responses
    to the initial INVITE.

- id: rfc3261-13.2.2.4-ack-answer
  rfc: 3261
  section: "13.2.2.4"
  title: 2xx Responses
  text: >-
    If the 2xx contains an offer (based on the rules above), the ACK MUST
    carry an answer in its body. If the offer in the 2xx response is not
    acceptable, the UAC core MUST generate a valid answer in the ACK and
    then send a BYE immediately.

- id: rfc3261-13.2.2.4-bye
  rfc: 3261
  section: "13.2.2.4"
  title: 2xx Responses
  text: >-
    If, after acknowledging any 2xx response to an INVITE, the UAC does not
    want to continue with that dialog, then the UAC MUST terminate the
    dialog by sending a BYE request as described in Section 15.

- id: rfc3262-5-answer-1xx
  rfc: 3262
  section: "5"
  title: The Offer/Answer Model and PRACK
  text: >-
    If the INVITE contained an offer, the UAS MAY generate an answer in a
    reliable provisional response (assuming these are supported by the
    UAC).

- id: rfc3262-5-prack-answer
  rfc: 3262
  section: "5"
  title: The Offer/Answer Model and PRACK
  text: >-
    If the UAC receives a reliable provisional response with an offer (this
    would occur if the UAC sent an INVITE without an offer, in which case
    the first reliable provisional response will contain the offer), it MUST
    generate an answer in the PRACK.

- id: rfc3262-5-session
  rfc: 3262
  section: "5"
  title: The Offer/Answer Model and PRACK
  text: >-
    Once an answer has been sent or received, the UA SHOULD establish the
    session based on the parameters of the offer and answer, even if the
    original INVITE itself has not been responded to.

- id: rfc3311-3-update
  rfc: 3311
  section: "3"
  title: Overview of Operation
  text: >-
    Once a dialog is established, either early or confirmed, the caller can
    generate an UPDATE method that contains an SDP offer [3] for the
    purposes of updating the session. The response to the UPDATE method
    contains the answer.

- id: rfc6337-2.2-one
  rfc: 6337
  section: "2.2"
  title: Offer/Answer Exchange Pairs in SIP Messages
  text: >-
    There may be ONLY ONE offer/answer negotiation in progress for a single
    dialog at any point in time.

- id: rfc6337-5.3-inactive
  rfc: 6337
  section: "5.3"
  title: Hold and Resume of Media
  text: >-
    A UA may, if desired, initiate hold by offering "a=inactive" attribute if
    it does not intend to transmit any media while in hold status.

- id: rfc6337-5.3-stuck
  rfc: 6337
  section: "5.3"
  title: Hold and Resume of Media
  text: >-
    If it had not previously initiated "hold", then it should offer
    "a=sendrecv" attribute, even if it had previously been forced to answer
    something else. Without this behavior it is possible to get "stuck on
    hold" in some cases, especially when a 3pcc is involved.

- id: rfc4733-1.2-why
  rfc: 4733
  section: "1.2"
  title: Overview
  text: >-
    Separate RTP payload formats for telephony tone signals are desirable
    since low-rate voice codecs cannot be guaranteed to reproduce these tone
    signals accurately enough for automatic recognition.

- id: rfc4733-2.5.1.1-negotiate
  rfc: 4733
  section: "2.5.1.1"
  title: Negotiation of Payloads
  text: >-
    Negotiation of payloads between sender and receiver is achieved by
    out-of-band means, using SDP, for example.

- id: rfc4733-2.5.1.1-events
  rfc: 4733
  section: "2.5.1.1"
  title: Negotiation of Payloads
  text: >-
    For backward compatibility, if no "events" parameter is received, the
    sender SHOULD assume support for the DTMF events 0-15 but for no other
    events.

- id: rfc3605-2.1-rtcp
  rfc: 3605
  section: "2.1"
  title: The RTCP Attribute
  text: >-
    The RTCP attribute MAY be used as a media level attribute; it MUST NOT
    be used as a session level attribute.

- id: rfc5761-5.1.1-offer
  rfc: 5761
  section: "5.1.1"
  title: SDP Signalling
  text: >-
    The initial SDP offer MUST include this attribute at the media level to
    request multiplexing of RTP and RTCP on a single port.

- id: rfc5761-5.1.1-answer
  rfc: 5761
  section: "5.1.1"
  title: SDP Signalling
  text: >-
    If the answer does not contain an "a=rtcp-mux" attribute, the offerer
    MUST NOT multiplex RTP and RTCP packets on a single port.

- id: rfc9143-5-bundle
  rfc: 9143
  section: "5"
  title: SDP Grouping Framework BUNDLE Extension
  text: >-
    Within a BUNDLE group, each "m=" section uses a BUNDLE transport for
    sending and receiving bundled media. Each endpoint uses a single
    address:port combination for sending and receiving the bundled media.

- id: rfc6314-3-private
  rfc: 6314
  section: "3"
  title: Problem Statement
  text: >-
    The problem arises when a client advertises its address to receive
    media and it exists in a private network that is not accessible from
    outside the NAT.

# --- Module 16: RTP ------------------------------------------------------

- id: rfc3550-5.1-fields
  rfc: 3550
  section: "5.1"
  title: RTP Fixed Header Fields
  text: >-
    The first twelve octets are present in every RTP packet, while the list of
    CSRC identifiers is present only when inserted by a mixer.

- id: rfc3550-5.1-csrc
  rfc: 3550
  section: "5.1"
  title: RTP Fixed Header Fields
  text: >-
    CSRC identifiers are inserted by mixers (see Section 7.1), using the SSRC
    identifiers of contributing sources.

- id: rfc3550-5.1-pt
  rfc: 3550
  section: "5.1"
  title: RTP Fixed Header Fields
  text: >-
    This field identifies the format of the RTP payload and determines its
    interpretation by the application.

- id: rfc3550-5.1-pt-ignore
  rfc: 3550
  section: "5.1"
  title: RTP Fixed Header Fields
  text: >-
    A receiver MUST ignore packets with payload types that it does not
    understand.

- id: rfc3550-5.1-seq
  rfc: 3550
  section: "5.1"
  title: RTP Fixed Header Fields
  text: >-
    The sequence number increments by one for each RTP data packet sent, and
    may be used by the receiver to detect packet loss and to restore packet
    sequence.

- id: rfc3550-5.1-ts
  rfc: 3550
  section: "5.1"
  title: RTP Fixed Header Fields
  text: >-
    The timestamp reflects the sampling instant of the first octet in the RTP
    data packet.

- id: rfc3550-5.1-ts-160
  rfc: 3550
  section: "5.1"
  title: RTP Fixed Header Fields
  text: >-
    If an audio application reads blocks covering 160 sampling periods from
    the input device, the timestamp would be increased by 160 for each such
    block, regardless of whether the block is transmitted in a packet or
    dropped as silent.

- id: rfc3550-5.1-random
  rfc: 3550
  section: "5.1"
  title: RTP Fixed Header Fields
  text: >-
    The initial value of the timestamp SHOULD be random, as for the sequence
    number.

- id: rfc3550-5.1-ssrc
  rfc: 3550
  section: "5.1"
  title: RTP Fixed Header Fields
  text: >-
    The SSRC field identifies the synchronization source. This identifier
    SHOULD be chosen randomly, with the intent that no two synchronization
    sources within the same RTP session will have the same SSRC identifier.

- id: rfc3550-5.1-ssrc-move
  rfc: 3550
  section: "5.1"
  title: RTP Fixed Header Fields
  text: >-
    If a source changes its source transport address, it must also choose a
    new SSRC identifier to avoid being interpreted as a looped source (see
    Section 8.2).

- id: rfc3550-5.3.1-ext
  rfc: 3550
  section: "5.3.1"
  title: RTP Header Extension
  text: >-
    This mechanism is designed so that the header extension may be ignored by
    other interoperating implementations that have not been extended.

- id: rfc3550-6.4.1-jitter
  rfc: 3550
  section: "6.4.1"
  title: "SR: Sender Report RTCP Packet"
  text: >-
    The interarrival jitter J is defined to be the mean deviation (smoothed
    absolute value) of the difference D in packet spacing at the receiver
    compared to the sender for a pair of packets.

- id: rfc3551-4.1-marker
  rfc: 3551
  section: "4.1"
  title: Encoding-Independent Rules
  text: >-
    For applications which send either no packets or occasional comfort-noise
    packets during silence, the first packet of a talkspurt, that is, the
    first packet after a silence period during which packets have not been
    transmitted contiguously, SHOULD be distinguished by setting the marker
    bit in the RTP data header to one.

- id: rfc3551-4.1-silence
  rfc: 3551
  section: "4.1"
  title: Encoding-Independent Rules
  text: >-
    Receivers MUST assume that senders may suppress silence unless this is
    restricted by signaling specified elsewhere.

- id: rfc3551-4.2-ptime
  rfc: 3551
  section: "4.2"
  title: Operating Recommendations
  text: >-
    For packetized audio, the default packetization interval SHOULD have a
    duration of 20 ms or one frame, whichever is longer, unless otherwise
    noted in Table 1 (column "ms/packet").

- id: rfc3551-4.2-tradeoff
  rfc: 3551
  section: "4.2"
  title: Operating Recommendations
  text: >-
    The packetization interval determines the minimum end-to-end delay; longer
    packets introduce less header overhead but higher delay and make packet
    loss more noticeable.

- id: rfc3389-5-cn
  rfc: 3389
  section: "5"
  title: Guidelines for Use
  text: >-
    At the beginning of an inactive voice segment (silence period), a CN
    packet is transmitted in the same RTP stream and indicated by the CN
    payload type.

- id: rfc3389-2-sid
  rfc: 3389
  section: "2"
  title: Introduction
  text: >-
    The comfort noise payload, which is also known as a Silence Insertion
    Descriptor (SID) frame, consists of a single octet description of the
    noise level and MAY contain spectral information in subsequent octets.

- id: rfc4733-2.1-same-stream
  rfc: 4733
  section: "2.1"
  title: Introduction
  text: >-
    Named telephone events are carried as part of the audio stream and MUST
    use the same sequence number and timestamp base as the regular audio
    channel to simplify the generation of audio waveforms at a gateway.

- id: rfc4733-2.3.1-event
  rfc: 4733
  section: "2.3.1"
  title: Event Field
  text: >-
    The event field is a number between 0 and 255 identifying a specific
    telephony event.

- id: rfc4733-2.3.3-r
  rfc: 4733
  section: "2.3.3"
  title: R Bit
  text: >-
    This field is reserved for future use. The sender MUST set it to zero, and
    the receiver MUST ignore it.

- id: rfc4733-2.3.4-volume
  rfc: 4733
  section: "2.3.4"
  title: Volume Field
  text: >-
    For DTMF digits and other events representable as tones, this field
    describes the power level of the tone, expressed in dBm0 after dropping
    the sign.

- id: rfc4733-2.3.5-duration
  rfc: 4733
  section: "2.3.5"
  title: Duration Field
  text: >-
    The duration field indicates the duration of the event or segment being
    reported, in timestamp units, expressed as an unsigned integer in network
    byte order.

- id: rfc4733-2.5.1.2-marks
  rfc: 4733
  section: "2.5.1.2"
  title: Transmission of Event Packets
  text: >-
    The first packet for an event MUST have the M bit set. The final packet
    for an event MUST have the E bit set, but setting of the "E" bit MAY be
    deferred until the final packet is retransmitted (see Section 2.5.1.4).

- id: rfc4733-2.5.1.2-same-ts
  rfc: 4733
  section: "2.5.1.2"
  title: Transmission of Event Packets
  text: >-
    The update packets MUST have the same RTP timestamp value as the initial
    packet for the event, but the duration MUST be increased to reflect the
    total cumulative duration since the beginning of the event.

- id: rfc4733-2.5.1.4-three
  rfc: 4733
  section: "2.5.1.4"
  title: Retransmission of Final Packet
  text: >-
    The final packet for each event and for each segment SHOULD be sent a
    total of three times at the interval used by the source for updates.

- id: rfc4733-2.5.2.2-render
  rfc: 4733
  section: "2.5.2.2"
  title: Playout of Tone Events
  text: >-
    It is RECOMMENDED that gateways render only the telephone-event payload
    once it is received, since the audio may contain spurious tones introduced
    by the audio compression algorithm.

- id: rfc4961-3-symmetric
  rfc: 4961
  section: "3"
  title: Definition of Symmetric RTP and Symmetric RTCP
  text: >-
    A device supports symmetric RTP if it selects, communicates, and uses IP
    addresses and port numbers such that, when receiving a bidirectional RTP
    media stream on UDP port "A" and IP address "a", it also transmits RTP
    media for that stream from the same source UDP port "A" and IP address
    "a".

- id: rfc4961-4-recommended
  rfc: 4961
  section: "4"
  title: Recommended Usage
  text: >-
    For these reasons, it is RECOMMENDED that symmetric RTP and symmetric RTCP
    always be used for bidirectional RTP media streams.

# --- Module 17: RTCP -----------------------------------------------------

- id: rfc3550-6-functions
  rfc: 3550
  section: "6"
  title: RTP Control Protocol -- RTCP
  text: >-
    The primary function is to provide feedback on the quality of the data
    distribution.

- id: rfc3550-6-cname
  rfc: 3550
  section: "6"
  title: RTP Control Protocol -- RTCP
  text: >-
    RTCP carries a persistent transport-level identifier for an RTP source
    called the canonical name or CNAME, Section 6.5.1.

- id: rfc3550-6.1-compound
  rfc: 3550
  section: "6.1"
  title: RTCP Packet Format
  text: >-
    Thus, all RTCP packets MUST be sent in a compound packet of at least two
    individual packets, with the following format:

- id: rfc3550-6.1-first
  rfc: 3550
  section: "6.1"
  title: RTCP Packet Format
  text: >-
    The first RTCP packet in the compound packet MUST always be a report
    packet to facilitate header validation as described in Appendix A.2.

- id: rfc3550-6.2-five
  rfc: 3550
  section: "6.2"
  title: RTCP Transmission Interval
  text: >-
    It is RECOMMENDED that the fraction of the session bandwidth added for
    RTCP be fixed at 5%.

- id: rfc3550-6.2-interval
  rfc: 3550
  section: "6.2"
  title: RTCP Transmission Interval
  text: >-
    The RECOMMENDED value for a fixed minimum interval is 5 seconds.

- id: rfc3550-6.4-sr-rr
  rfc: 3550
  section: "6.4"
  title: Sender and Receiver Reports
  text: >-
    The SR is issued if a site has sent any data packets during the interval
    since issuing the last report or the previous one, otherwise the RR is
    issued.

- id: rfc3550-6.4.1-ntp
  rfc: 3550
  section: "6.4.1"
  title: "SR: Sender Report RTCP Packet"
  text: >-
    Indicates the wallclock time (see Section 4) when this report was sent so
    that it may be used in combination with timestamps returned in reception
    reports from other receivers to measure round-trip propagation to those
    receivers.

- id: rfc3550-6.4.1-rtpts
  rfc: 3550
  section: "6.4.1"
  title: "SR: Sender Report RTCP Packet"
  text: >-
    Corresponds to the same time as the NTP timestamp (above), but in the same
    units and with the same random offset as the RTP timestamps in data
    packets.

- id: rfc3550-6.4.1-counts
  rfc: 3550
  section: "6.4.1"
  title: "SR: Sender Report RTCP Packet"
  text: >-
    The total number of RTP data packets transmitted by the sender since
    starting transmission up until the time this SR packet was generated.

- id: rfc3550-6.4.1-fraction
  rfc: 3550
  section: "6.4.1"
  title: "SR: Sender Report RTCP Packet"
  text: >-
    The fraction of RTP data packets from source SSRC_n lost since the
    previous SR or RR packet was sent, expressed as a fixed point number with
    the binary point at the left edge of the field.

- id: rfc3550-6.4.1-cumulative
  rfc: 3550
  section: "6.4.1"
  title: "SR: Sender Report RTCP Packet"
  text: >-
    Thus, packets that arrive late are not counted as lost, and the loss may
    be negative if there are duplicates.

- id: rfc3550-6.4.1-lsr
  rfc: 3550
  section: "6.4.1"
  title: "SR: Sender Report RTCP Packet"
  text: >-
    The middle 32 bits out of 64 in the NTP timestamp (as explained in Section
    4) received as part of the most recent RTCP sender report (SR) packet from
    source SSRC_n.

- id: rfc3550-6.4.1-rtt
  rfc: 3550
  section: "6.4.1"
  title: "SR: Sender Report RTCP Packet"
  text: >-
    It calculates the total round-trip time A-LSR using the last SR timestamp
    (LSR) field, and then subtracting this field to leave the round-trip
    propagation delay as (A - LSR - DLSR).

- id: rfc3550-6.5.1-cname
  rfc: 3550
  section: "6.5.1"
  title: "CNAME: Canonical End-Point Identifier SDES Item"
  text: >-
    Because the randomly allocated SSRC identifier may change if a conflict is
    discovered or if a program is restarted, the CNAME item MUST be included
    to provide the binding from the SSRC identifier to an identifier for the
    source (sender or receiver) that remains constant.

- id: rfc3550-6.6-bye
  rfc: 3550
  section: "6.6"
  title: "BYE: Goodbye RTCP Packet"
  text: >-
    The BYE packet indicates that one or more sources are no longer active.

- id: rfc4585-6.2.1-nack
  rfc: 4585
  section: "6.2.1"
  title: Generic NACK
  text: >-
    The Generic NACK is used to indicate the loss of one or more RTP packets.

- id: rfc4585-6.3.1.1-pli
  rfc: 4585
  section: "6.3.1.1"
  title: Semantics
  text: >-
    With the Picture Loss Indication message, a decoder informs the encoder
    about the loss of an undefined amount of coded video data belonging to one
    or more pictures.

- id: rfc5104-3.5.1-fir
  rfc: 5104
  section: "3.5.1"
  title: Full Intra Request Command
  text: >-
    A Full Intra Request (FIR) Command, when received by the designated media
    sender, requires that the media sender sends a Decoder Refresh Point (see
    section 2.2) at the earliest opportunity.

- id: rfc3611-4.7-voip
  rfc: 3611
  section: "4.7"
  title: VoIP Metrics Report Block
  text: >-
    The VoIP Metrics Report Block provides metrics for monitoring voice over
    IP (VoIP) calls.

- id: rfc3611-4.7-discard
  rfc: 3611
  section: "4.7"
  title: VoIP Metrics Report Block
  text: >-
    It also reports on the combined effect of losses and discards, as both
    have equal effect on call quality.

- id: rfc3611-4.7.5-r
  rfc: 3611
  section: "4.7.5"
  title: Call Quality or Transmission Quality Metrics
  text: >-
    It is expressed as an integer in the range 0 to 100, with a value of 94
    corresponding to "toll quality" and values of 50 or less regarded as
    unusable.

# --- Module 18: SRTP and media security ------------------------------------

- id: rfc3711-3-profile
  rfc: 3711
  section: "3"
  title: SRTP Framework
  text: >-
    We define SRTP as a profile of RTP.

- id: rfc3711-3-srtcp
  rfc: 3711
  section: "3"
  title: SRTP Framework
  text: >-
    Secure RTCP (SRTCP) provides the same security services to RTCP as SRTP
    does to RTP.

- id: rfc3711-3.1-encrypted
  rfc: 3711
  section: "3.1"
  title: Secure RTP
  text: >-
    The "Encrypted Portion" of an SRTP packet consists of the encryption of
    the RTP payload (including RTP padding when present) of the equivalent RTP
    packet.

- id: rfc3711-4.1.1-iv
  rfc: 3711
  section: "4.1.1"
  title: AES in Counter Mode
  text: >-
    IV = (k_s * 2^16) XOR (SSRC * 2^64) XOR (i * 2^16)

- id: rfc3711-4.2-tag
  rfc: 3711
  section: "4.2"
  title: Message Authentication and Integrity
  text: >-
    If the two tags are equal, then the message/tag pair is valid; otherwise,
    it is invalid and the error audit message "AUTHENTICATION FAILURE" MUST be
    returned.

- id: rfc3711-4.3.1-labels
  rfc: 3711
  section: "4.3.1"
  title: Key Derivation Algorithm
  text: >-
    The master key and master salt MUST be random, but the master salt MAY be
    public.

- id: rfc4568-3-protect
  rfc: 4568
  section: "3"
  title: Applicability
  text: >-
    Implementations MUST employ security mechanisms that provide
    confidentiality and integrity for the keying material.

- id: rfc4568-4-media
  rfc: 4568
  section: "4"
  title: 'SDP "Crypto" Attribute and Parameters'
  text: >-
    The "crypto" attribute MUST only appear at the SDP media level (not at the
    session level).

- id: rfc4568-6-savp
  rfc: 4568
  section: "6"
  title: SRTP Security Descriptions
  text: >-
    SRTP security descriptions MUST only be used with the SRTP transport
    (e.g., "RTP/SAVP" or "RTP/SAVPF").

- id: rfc4568-6.1-inline
  rfc: 4568
  section: "6.1"
  title: SRTP Key Parameter
  text: >-
    The "inline" type of key contains the keying material (master key and
    salt) and all policy related to that master key, including how long it can
    be used (lifetime) and whether it uses a master key identifier (MKI) to
    associate an incoming SRTP packet with a particular master key.

- id: rfc4568-7.1.2-one
  rfc: 4568
  section: "7.1.2"
  title: Generating the Initial Answer - Unicast Streams
  text: >-
    For each unicast media line that uses the secure RTP transport and
    contains one or more "a=crypto" lines in the offer, the answerer MUST
    either accept one (and only one) of the crypto lines for that media
    stream, or it MUST reject the media stream.

- id: rfc4568-7.1.2-own-key
  rfc: 4568
  section: "7.1.2"
  title: Generating the Initial Answer - Unicast Streams
  text: >-
    When the answerer accepts an SRTP unicast media stream with a crypto line,
    the answerer MUST include one or more master keys appropriate for the
    selected crypto algorithm; the master key(s) included in the answer MUST
    be different from those in the offer.

- id: rfc4568-7.1.4-rekey
  rfc: 4568
  section: "7.1.4"
  title: Modifying the Session
  text: >-
    When modifying the session, all negotiated aspects of the SRTP media
    stream can be modified. For example, a new crypto suite can be used or a
    new master key can be established.

- id: rfc4568-8.3-tls
  rfc: 4568
  section: "8.3"
  title: Signaling Authentication and Signaling Encryption
  text: >-
    Failure to encrypt the SDP message containing an inline SRTP master key
    renders the SRTP authentication or encryption service useless in
    practically all circumstances.

- id: rfc4568-8.3-intermediaries
  rfc: 4568
  section: "8.3"
  title: Signaling Authentication and Signaling Encryption
  text: >-
    Network or transport security protocols that terminate at each
    intermediate system, therefore, SHOULD NOT be used for protecting SDP
    security descriptions.

- id: rfc5763-5-fingerprint
  rfc: 5763
  section: "5"
  title: Establishing a Secure Channel
  text: >-
    The certificate presented during the DTLS handshake MUST match the
    fingerprint exchanged via the signaling path in the SDP.

- id: rfc5763-5-active
  rfc: 5763
  section: "5"
  title: Establishing a Secure Channel
  text: >-
    setup:active allows the answer and the DTLS handshake to occur in
    parallel. Thus, setup:active is RECOMMENDED.

- id: rfc5763-5-media-path
  rfc: 5763
  section: "5"
  title: Establishing a Secure Channel
  text: >-
    Note that the entire authentication and key exchange for securing the
    media traffic is handled in the media path through DTLS. The signaling
    path is only used to verify the peers' certificate fingerprints.

- id: rfc5764-3-overview
  rfc: 5764
  section: "3"
  title: Overview of DTLS-SRTP Operation
  text: >-
    The keying material from that handshake is fed into the SRTP stack.

- id: rfc5764-8-proto
  rfc: 5764
  section: "8"
  title: Session Description for RTP/SAVP over DTLS
  text: >-
    When a RTP/SAVP or RTP/SAVPF stream is transported over DTLS with UDP, the
    token SHALL be UDP/TLS/RTP/SAVP or UDP/TLS/RTP/SAVPF respectively.

- id: rfc8842-5.2-actpass
  rfc: 8842
  section: "5.2"
  title: Generating the Initial SDP Offer
  text: >-
    When an offerer sends the initial offer, the offerer MUST insert an SDP
    "setup" attribute [RFC4145] with an "actpass" attribute value, as well as
    one or more SDP "fingerprint" attributes according to the procedures in
    [RFC8122].

- id: rfc4145-4.1-roles
  rfc: 4145
  section: "4.1"
  title: The Setup Attribute in the Offer/Answer Model
  text: >-
    The offerer states which role or roles it is willing to perform; and the
    answerer, taking the offerer's willingness into consideration, chooses
    which roles both endpoints will actually perform during connection
    establishment.

- id: rfc6189-1-sas
  rfc: 6189
  section: "1"
  title: Introduction
  text: >-
    It uses ephemeral Diffie-Hellman (DH) with hash commitment and allows the
    detection of man-in-the-middle (MiTM) attacks by displaying a short
    authentication string (SAS) for the users to read and verbally compare
    over the phone.

- id: rfc6189-1-no-sip
  rfc: 6189
  section: "1"
  title: Introduction
  text: >-
    It also does not rely on SIP signaling for the key management, and in
    fact, it does not rely on any servers at all.

# --- Module 19: Transports ------------------------------------------------

- id: rfc3261-18-mandatory
  rfc: 3261
  section: "18"
  title: Transport
  text: >-
    All SIP elements MUST implement UDP and TCP. SIP elements MAY implement
    other protocols.

- id: rfc3261-18-keep-open
  rfc: 3261
  section: "18"
  title: Transport
  text: >-
    It is RECOMMENDED that connections be kept open for some implementation-defined
    duration after the last message was sent or received over that
    connection.

- id: rfc3261-18.1.1-via-change
  rfc: 3261
  section: "18.1.1"
  title: Sending Requests
  text: >-
    If this causes a change in the transport protocol from the one indicated
    in the top Via, the value in the top Via MUST be changed. This prevents
    fragmentation of messages over UDP and provides congestion control for
    larger messages.

- id: rfc3261-18.1.1-reuse
  rfc: 3261
  section: "18.1.1"
  title: Sending Requests
  text: >-
    If a request is destined to an IP address, port, and transport to which an
    existing connection is open, it is RECOMMENDED that this connection be
    used to send the request, but another connection MAY be opened and used.

- id: rfc3261-18.1.1-ports
  rfc: 3261
  section: "18.1.1"
  title: Sending Requests
  text: >-
    If the port is absent, the default value depends on the transport. It is
    5060 for UDP, TCP and SCTP, 5061 for TLS.

- id: rfc3261-18.2.1-listen-tcp
  rfc: 3261
  section: "18.2.1"
  title: Receiving Requests
  text: >-
    For any port and interface that a server listens on for UDP, it MUST
    listen on that same port and interface for TCP.

- id: rfc3261-18.3-stream
  rfc: 3261
  section: "18.3"
  title: Framing
  text: >-
    The Content-Length header field MUST be used with stream oriented
    transports.

- id: rfc5923-1-two
  rfc: 5923
  section: "1"
  title: Introduction
  text: >-
    This frequently causes a pair of SIP entities to use one connection for
    requests sent in each direction, as shown below.

- id: rfc5923-3-tls
  rfc: 5923
  section: "3"
  title: Applicability Statement
  text: >-
    This memo documents that it is good practice to only reuse those
    connections where the identity of the sender can be verified by the
    receiver.

- id: rfc5923-3-nat
  rfc: 5923
  section: "3"
  title: Applicability Statement
  text: >-
    SIP entities that can only open a connection in a specific direction --
    perhaps because of Network Address Translation (NAT) and firewalls --
    reuse their connections using the mechanism described in the outbound
    document [RFC5626].

- id: rfc5923-8.1-alias
  rfc: 5923
  section: "8.1"
  title: Client Behavior
  text: >-
    The "alias" header field parameter is included in a Via header field value
    to indicate that the client wants to create a transport layer alias.

- id: rfc5922-7.8-sni
  rfc: 5922
  section: "7.8"
  title: Virtual SIP Servers and Certificate Content
  text: >-
    Alternatively, if the TLS client hello "server_name" extension as defined
    in RFC 4366 [4] is supported, the client SHOULD use that extension to
    request a certificate corresponding to the specific domain (from the SIP
    AUS) with which the client is seeking to establish a connection.

- id: rfc7118-4.1-handshake
  rfc: 7118
  section: "4.1"
  title: Handshake
  text: >-
    The client MUST include the value "sip" in the Sec-WebSocket-Protocol
    header in its handshake request.

- id: rfc7118-5-one-message
  rfc: 7118
  section: "5"
  title: SIP WebSocket Transport
  text: >-
    Each SIP message MUST be carried within a single WebSocket message, and a
    WebSocket message MUST NOT contain more than one SIP message.

- id: rfc7118-5.1-via
  rfc: 7118
  section: "5.1"
  title: Via Transport Parameter
  text: >-
    This document defines the value "WS" to be used for requests over plain
    WebSocket connections and "WSS" for requests over secure WebSocket
    connections (in which the WebSocket connection is established using TLS
    [RFC5246] with TCP transport).

- id: rfc7118-6-keepalive
  rfc: 7118
  section: "6"
  title: Connection Keep-Alive
  text: >-
    SIP WebSocket Clients and Servers may keep their WebSocket connections
    open by sending periodic WebSocket "Ping" frames as described in
    [RFC6455], Section 5.5.2.

- id: rfc5626-3.5-ping-pong
  rfc: 5626
  section: "3.5"
  title: Keep-Alive Technique
  text: >-
    Each of these mechanisms uses a client-to-server "ping" keep-alive and a
    corresponding server-to-client "pong" message.

- id: rfc5626-3.5.2-stun
  rfc: 5626
  section: "3.5.2"
  title: STUN Keep-Alive Technique
  text: >-
    To detect this, STUN requests are sent over the same flow that is being
    used for the SIP traffic.

- id: rfc5626-7-same-flow
  rfc: 5626
  section: "7"
  title: 'Authoritative Proxy Procedures: Forwarding Requests'
  text: >-
    If the proxy is co-located with the registrar and stored information about
    the flow to the UA that created the binding, then the proxy MUST send the
    request over the same 'logical flow' saved with the binding, since that
    flow is known to deliver data to the specific target UA instance's network
    flow that was saved with the binding.

- id: rfc6223-1-keep
  rfc: 6223
  section: "1"
  title: Introduction
  text: >-
    This specification defines a new Session Initiation Protocol (SIP)
    [RFC3261] Via header field parameter, "keep", which allows adjacent SIP
    entities to explicitly negotiate usage of the NAT keep-alive mechanisms
    defined in SIP Outbound.

- id: rfc5630-3.1.4-tls
  rfc: 5630
  section: "3.1.4"
  title: Usage of the transport=tls URI Parameter and the TLS Via Parameter
  text: >-
    The transport=tls parameter has never been defined in an RFC, but only in
    some of the Internet drafts between [RFC2543] and [RFC3261].

- id: rfc3581-3-rport-flag
  rfc: 3581
  section: "3"
  title: Client Behavior
  text: >-
    A client, compliant to this specification (clients include UACs and
    proxies), MAY include an "rport" parameter in the top Via header field value
    of requests it generates. This parameter MUST have no value; it serves as a
    flag to indicate to the server that this extension is supported and
    requested for the transaction.

- id: rfc3581-3-invite-20s
  rfc: 3581
  section: "3"
  title: Client Behavior
  text: >-
    INVITE transactions can take an arbitrarily long amount of time to complete.
    As a result, the binding may expire before a final response is received. To
    keep the binding fresh, the client SHOULD retransmit its INVITE every 20
    seconds or so.

- id: rfc6314-4.1.2-same-socket
  rfc: 6314
  section: "4.1.2"
  title: Client-Initiated Connections
  text: >-
    Even if the SIP Outbound mechanism is not used, clients generating SIP
    requests SHOULD use the same IP address and port (i.e., socket) for both
    transmission and receipt of SIP messages.

- id: rfc4787-3-cone
  rfc: 4787
  section: "3"
  title: Terminology
  text: >-
    STUN [RFC3489] used the terms "Full Cone", "Restricted Cone", "Port
    Restricted Cone", and "Symmetric" to refer to different variations of NATs
    applicable to UDP only. Unfortunately, this terminology has been the source
    of much confusion, as it has proven inadequate at describing real-life NAT
    behavior.

- id: rfc4787-4.1-eim
  rfc: 4787
  section: "4.1"
  title: Address and Port Mapping
  text: >-
    Endpoint-Independent Mapping: The NAT reuses the port mapping for subsequent
    packets sent from the same internal IP address and port (X:x) to any
    external IP address and port.

- id: rfc4787-4.1-apdm
  rfc: 4787
  section: "4.1"
  title: Address and Port Mapping
  text: >-
    Address and Port-Dependent Mapping: The NAT reuses the port mapping for
    subsequent packets sent from the same internal IP address and port (X:x) to
    the same external IP address and port while the mapping is still active.

- id: rfc4787-4.1-req1
  rfc: 4787
  section: "4.1"
  title: Address and Port Mapping
  text: >-
    REQ-1: A NAT MUST have an "Endpoint-Independent Mapping" behavior.

- id: rfc4787-5-apdf
  rfc: 4787
  section: "5"
  title: Filtering Behavior
  text: >-
    In other words, for receiving packets from a specific external endpoint, it
    is necessary for the internal endpoint to send packets first to that
    external endpoint's IP address and port.

- id: rfc4787-7-alg-off
  rfc: 4787
  section: "7"
  title: Application Level Gateways
  text: >-
    REQ-10: To eliminate interference with UNSAF NAT traversal mechanisms and
    allow integrity protection of UDP communications, NAT ALGs for UDP-based
    protocols SHOULD be turned off.

- id: rfc6314-3-alg
  rfc: 6314
  section: "3"
  title: Problem Statement
  text: >-
    ALGs have limitations (as per RFC 4787 [RFC4787] Section 7, RFC 3424
    [RFC3424], and [RFC5245] Section 18.6), and experience shows they can have
    an adverse impact on the functionality of SIP. This includes problems such
    as requiring the media and signaling to traverse the same device and not
    working with encrypted signaling and/or payload.

- id: rfc8489-14.2-alg
  rfc: 8489
  section: "14.2"
  title: XOR-MAPPED-ADDRESS
  text: >-
    However, deployment experience found that some NATs rewrite the 32-bit
    binary payloads containing the NAT's public IP address, such as STUN's
    MAPPED-ADDRESS attribute, in the well-meaning but misguided attempt to
    provide a generic Application Layer Gateway (ALG) function.

- id: rfc7362-3-rewrite
  rfc: 7362
  section: "3"
  title: Impact on Signaling
  text: >-
    Signaling intermediaries would hence modify such information so that peer
    UAs are given the (public) addressing information of a media relay
    controlled by the intermediary.

- id: rfc7362-4-latch
  rfc: 7362
  section: "4"
  title: Media Behavior and Latching
  text: >-
    The media relay receives the media packets on the allocated ports and uses
    their respective source address:ports as a destination for all media bound
    in the opposite direction. In other words, it "latches" or locks on these
    source address:port tuples.

- id: rfc6314-4.2.1-symmetric
  rfc: 6314
  section: "4.2.1"
  title: Symmetric RTP/RTCP
  text: >-
    When operating behind a NAT and using the 'latching' technique described in
    [MIDDLEBOXES], SIP User Agents MUST implement Symmetric RTP/RTCP.

- id: rfc8489-1-stun
  rfc: 8489
  section: "1"
  title: Introduction
  text: >-
    It provides a means for an endpoint to determine the IP address and port
    allocated by a NAT that corresponds to its private IP address and port. It
    also provides a way for an endpoint to keep a NAT binding alive.

- id: rfc6314-4.2.3.1-stun
  rfc: 6314
  section: "4.2.3.1"
  title: STUN
  text: >-
    Using terminology defined in "NAT Behavioral Requirements for Unicast UDP"
    [RFC4787], STUN does work with Endpoint-Independent Mapping but does not
    work with either Address-Dependent Mapping or Address and Port-Dependent
    Mapping type NATs.

- id: rfc8656-1-relay
  rfc: 8656
  section: "1"
  title: Introduction
  text: >-
    When a direct communication path cannot be found, it is necessary to use the
    services of an intermediate host that acts as a relay for the packets.

- id: rfc6314-4.2.3.2-last-resort
  rfc: 6314
  section: "4.2.3.2"
  title: TURN
  text: >-
    A TURN service will almost always provide media traffic to a SIP entity, but
    it is RECOMMENDED that this method would only be used as a last resort and
    not as a general mechanism for NAT traversal.

- id: rfc8445-2-signaling
  rfc: 8445
  section: "2"
  title: Overview of ICE
  text: >-
    Note that ICE is not intended for NAT traversal for the signaling protocol,
    which is assumed to be provided via another mechanism.

- id: rfc8445-2-candidates
  rfc: 8445
  section: "2"
  title: Overview of ICE
  text: >-
    The purpose of ICE is to discover which pairs of addresses will work. The
    way that ICE does this is to systematically try all possible pairs (in a
    carefully sorted order) until it finds one or more that work.

- id: rfc8445-2.2-checks
  rfc: 8445
  section: "2.2"
  title: Connectivity Checks
  text: >-
    It is important to note that STUN requests are sent to and from the exact
    same IP addresses and ports that will be used for data (e.g., RTP, RTCP, or
    other protocols).

- id: rfc8445-2.2-prflx
  rfc: 8445
  section: "2.2"
  title: Connectivity Checks
  text: >-
    If this transport address is different from that of other candidates the
    agent already learned, it represents a new candidate (peer-reflexive
    candidate), which then gets tested by ICE just the same as any other
    candidate.

- id: rfc8445-5.1.2.1-priority
  rfc: 8445
  section: "5.1.2.1"
  title: Recommended Formula
  text: >-
    priority = (2^24)*(type preference) + (2^8)*(local preference) + (2^0)*(256
    - component ID)

- id: rfc8445-5.1.2.2-prefs
  rfc: 8445
  section: "5.1.2.2"
  title: Guidelines for Choosing Type and Local Preferences
  text: >-
    The RECOMMENDED values for type preferences are 126 for host candidates, 110
    for peer-reflexive candidates, 100 for server-reflexive candidates, and 0
    for relayed candidates.

# Module 21: basic call flows

- id: rfc3665-1.3-not-copied
  rfc: 3665
  section: "1.3"
  title: SIP Protocol Assumptions
  text: >-
    IMPORTANT: The exact flows here must not be copied as is by an implementer
    due to specific incorrect characteristics that were introduced into the
    document for convenience and are listed below.

- id: rfc3665-3.2-record-route
  rfc: 3665
  section: "3.2"
  title: Session Establishment Through Two Proxies
  text: >-
    Proxy 1 inserts a Record-Route header into the INVITE message to ensure that
    it is present in all subsequent message exchanges.

- id: rfc3665-3.9-hop-by-hop
  rfc: 3665
  section: "3.9"
  title: Unsuccessful Busy
  text: >-
    Note that the non-2xx response is acknowledged on a hop-by-hop basis instead
    of end-to-end.

- id: rfc3665-3.8-crossed
  rfc: 3665
  section: "3.8"
  title: Unsuccessful No Answer
  text: >-
    If a 200 OK to the INVITE had crossed with the CANCEL, Alice would have sent
    an ACK then a BYE to Bob in order to properly terminate the call.

- id: rfc3665-3.10-no-response
  rfc: 3665
  section: "3.10"
  title: Unsuccessful No Response from User Agent
  text: >-
    In this example, there is no response from Bob to Alice's INVITE messages
    being re-transmitted by Proxy 2. After the sixth re-transmission, Proxy 2
    gives up and sends a 480 No Response to Alice.

- id: rfc3261-21.4.24-486
  rfc: 3261
  section: "21.4.24"
  title: 486 Busy Here
  text: >-
    The callee's end system was contacted successfully, but the callee is
    currently not willing or able to take additional calls at this end system.

- id: rfc3261-21.4.18-480
  rfc: 3261
  section: "21.4.18"
  title: 480 Temporarily Unavailable
  text: >-
    The callee's end system was contacted successfully but the callee is
    currently unavailable (for example, is not logged in, logged in but in a
    state that precludes communication with the callee, or has activated the
    "do not disturb" feature).

- id: rfc3261-21.6.2-603
  rfc: 3261
  section: "21.6.2"
  title: 603 Decline
  text: >-
    The callee's machine was successfully contacted but the user explicitly does
    not wish to or cannot participate.

- id: rfc3261-21.4.5-404
  rfc: 3261
  section: "21.4.5"
  title: 404 Not Found
  text: >-
    The server has definitive information that the user does not exist at the
    domain specified in the Request-URI.

- id: rfc3261-21.4.9-408
  rfc: 3261
  section: "21.4.9"
  title: 408 Request Timeout
  text: >-
    The server could not produce a response within a suitable amount of time,
    for example, if it could not determine the location of the user in time.

- id: rfc3261-21.3.3-302
  rfc: 3261
  section: "21.3.3"
  title: 302 Moved Temporarily
  text: >-
    The requesting client SHOULD retry the request at the new address(es) given
    by the Contact header field (Section 20.10). The Request-URI of the new
    request uses the value of the Contact header field in the response.

- id: rfc3261-16.6-parallel-sequential
  rfc: 3261
  section: "16.6"
  title: Request Forwarding
  text: >-
    A stateful proxy MAY process the set in any order. It MAY process multiple
    targets serially, allowing each client transaction to complete before
    starting the next. It MAY start client transactions with every target in
    parallel.

- id: rfc3261-16.7-cancel-branches
  rfc: 3261
  section: "16.7"
  title: Response Processing
  text: >-
    If the forwarded response was a final response, the proxy MUST generate a
    CANCEL request for all pending client transactions associated with this
    response context.

- id: rfc3261-16.7-6xx
  rfc: 3261
  section: "16.7"
  title: Response Processing
  text: >-
    If a 6xx response is received, it is not immediately forwarded, but the
    stateful proxy SHOULD cancel all client pending transactions as described
    in Section 10, and it MUST NOT create any new branches in this context.

- id: rfc3261-16.8-timer-c
  rfc: 3261
  section: "16.8"
  title: Processing Timer C
  text: >-
    If the client transaction has received a provisional response, the proxy
    MUST generate a CANCEL request matching that transaction. If the client
    transaction has not received a provisional response, the proxy MUST behave
    as if the transaction received a 408 (Request Timeout) response.

- id: rfc3261-13.3.1.1-progress
  rfc: 3261
  section: "13.3.1.1"
  title: Progress
  text: >-
    This is accomplished with a provisional response between 101 and 199. These
    provisional responses establish early dialogs and therefore follow the
    procedures of Section 12.1.1 in addition to those of Section 8.2.6.

- id: rfc3960-3.2-play-early-media
  rfc: 3960
  section: "3.2"
  title: Ringing Tone Generation
  text: >-
    Such a UAC is supposed to generate ringing tones locally for its user as
    long as no early media is received from the UAS. If the UAS generates early
    media (e.g., an announcement or a special ringing tone), the UAC is supposed
    to play it rather than generate the ringing tone locally.

- id: rfc3960-3.2-check-media
  rfc: 3960
  section: "3.2"
  title: Ringing Tone Generation
  text: >-
    Therefore, by only looking at the SIP signalling, a UAC cannot be sure
    whether or not there will be early media for a particular session. The UAC
    needs to check if media packets are arriving at a given moment.

# Module 22: mid-call features

- id: rfc3261-14.1-unchanged
  rfc: 3261
  section: "14.1"
  title: UAC Behavior
  text: >-
    If a UA receives a non-2xx final response to a re-INVITE, the session
    parameters MUST remain unchanged, as if no re-INVITE had been issued.

- id: rfc3264-8.3.1-address
  rfc: 3264
  section: "8.3.1"
  title: Modifying Address, Port or Transport
  text: >-
    To change the IP address where media is sent to, the same procedure is
    followed for changing the port number. The only difference is that the
    connection line is updated, not the port number.

- id: rfc3264-8.3.2-new-codec
  rfc: 3264
  section: "8.3.2"
  title: Changing the Set of Media Formats
  text: >-
    The list of media formats used in the session MAY be changed. To do this,
    the offerer creates a new media description, with the list of media formats
    in the "m=" line different from the corresponding media stream in the
    previous SDP.

- id: rfc3311-5.1-update
  rfc: 3311
  section: "5.1"
  title: Sending an UPDATE
  text: >-
    Although UPDATE can be used on confirmed dialogs, it is RECOMMENDED that a
    re-INVITE be used instead. This is because an UPDATE needs to be answered
    immediately, ruling out the possibility of user approval.

- id: rfc4028-7.2-half
  rfc: 4028
  section: "7.2"
  title: Processing a 2xx Response
  text: >-
    If the UA seeks to continue with the session beyond the session expiration,
    it MUST generate a refresh before the session expiration. It is RECOMMENDED
    that this refresh be sent once half the session interval has elapsed.

- id: rfc3515-1-overview
  rfc: 3515
  section: "1"
  title: Overview
  text: >-
    For instance, if Alice is in a call with Bob, and decides Bob needs to talk
    to Carol, Alice can instruct her SIP user agent (UA) to send a SIP REFER
    request to Bob's UA providing Carol's SIP Contact information. Assuming Bob
    has given it permission, Bob's UA will attempt to call Carol using that
    contact. Bob's UA will then report whether it succeeded in reaching the
    contact to Alice's UA.

- id: rfc3515-2.4.2-202
  rfc: 3515
  section: "2.4.2"
  title: Processing a REFER request
  text: >-
    If a REFER request is accepted (that is, a 2xx class response is returned),
    the recipient MUST create a subscription and send notifications of the
    status of the refer as described in Section 2.4.4.

- id: rfc3515-2.4.4-notify
  rfc: 3515
  section: "2.4.4"
  title: Using SIP Events to Report the Results of the Reference
  text: >-
    The NOTIFY mechanism defined in [2] MUST be used to inform the agent sending
    the REFER of the status of the reference.

- id: rfc3515-2.4.5-sipfrag
  rfc: 3515
  section: "2.4.5"
  title: The Body of the NOTIFY
  text: >-
    The body of a NOTIFY MUST begin with a SIP Response Status-Line as defined
    in [1]. The response class in this status line indicates the status of the
    referred action.

- id: rfc5589-5-bye
  rfc: 5589
  section: "5"
  title: Using REFER to Achieve Call Transfer
  text: >-
    Note that a successful REFER transaction does not terminate the session
    between the Transferor and the Transferee. If those parties wish to
    terminate their session, they must do so with a subsequent BYE request.

- id: rfc5589-5-in-dialog
  rfc: 5589
  section: "5"
  title: Using REFER to Achieve Call Transfer
  text: >-
    If the nature of the Contact URI is not known or if support for the
    target-dialog extension is not known, the REFER SHOULD be sent inside the
    existing dialog.

- id: rfc3892-1-referred-by
  rfc: 3892
  section: "1"
  title: Overview
  text: >-
    If that URI is a SIP URI, the referee will send a SIP request, often an
    INVITE, to that URI (the refer target). Nothing provided in [2]
    distinguishes this referenced request from any other request the referee
    might have sent to the refer target.

- id: rfc3891-3-match
  rfc: 3891
  section: "3"
  title: "User Agent Server Behavior: Receiving a Replaces Header"
  text: >-
    The User Agent Server (UAS) matches the to-tag and from-tag parameters as
    if they were tags present in an incoming request. In other words, the
    to-tag parameter is compared to the local tag, and the from-tag parameter
    is compared to the remote tag.

- id: rfc3891-3-bye
  rfc: 3891
  section: "3"
  title: "User Agent Server Behavior: Receiving a Replaces Header"
  text: >-
    Otherwise, it accepts the new INVITE by sending a 200-class response, and
    shuts down the replaced dialog by sending a BYE.

- id: rfc3891-3-early
  rfc: 3891
  section: "3"
  title: "User Agent Server Behavior: Receiving a Replaces Header"
  text: >-
    If the Replaces header field matches an early dialog that was initiated by
    the UA, it accepts the new INVITE by sending a 200-class response, and
    shuts down the replaced dialog by sending a CANCEL.

- id: rfc6665-4.2.2-481
  rfc: 6665
  section: "4.2.2"
  title: Sending State Information to Subscribers
  text: >-
    If the NOTIFY transaction fails due to the receipt of a 404, 405, 410, 416,
    480-485, 489, 501, or 604 response to the NOTIFY request, the notifier MUST
    remove the corresponding subscription.

- id: rfc5359-2.7-retarget
  rfc: 5359
  section: "2.7"
  title: Call Forwarding Unconditional
  text: >-
    Alice calls Bob. The proxy server rewrites the Request URI, and forwards
    the INVITE to a Gateway.

- id: rfc3262-3-require
  rfc: 3262
  section: "3"
  title: UAS Behavior
  text: >-
    A UAS MAY send any non-100 provisional response to INVITE reliably, so long
    as the initial INVITE request (the request whose provisional response is
    being sent reliably) contained a Supported header field with the option tag
    100rel.

- id: rfc3262-3-rseq
  rfc: 3262
  section: "3"
  title: UAS Behavior
  text: >-
    In addition, it MUST contain a Require header field containing the option
    tag 100rel, and MUST include an RSeq header field.

- id: rfc3262-3-retransmit
  rfc: 3262
  section: "3"
  title: UAS Behavior
  text: >-
    The reliable provisional response is passed to the transaction layer
    periodically with an interval that starts at T1 seconds and doubles for each
    retransmission (T1 is defined in Section 17 of RFC 3261).

- id: rfc3262-3-481
  rfc: 3262
  section: "3"
  title: UAS Behavior
  text: >-
    If a PRACK request is received by the UA core that does not match any
    unacknowledged reliable provisional response, the UAS MUST respond to the
    PRACK with a 481 response.

- id: rfc3262-3-5xx
  rfc: 3262
  section: "3"
  title: UAS Behavior
  text: >-
    If a reliable provisional response is retransmitted for 64*T1 seconds
    without reception of a corresponding PRACK, the UAS SHOULD reject the
    original request with a 5xx response.

- id: rfc3262-7.2-rack
  rfc: 3262
  section: "7.2"
  title: RAck
  text: >-
    The first number is the value from the RSeq header in the provisional
    response that is being acknowledged. The next number, and the method, are
    copied from the CSeq in the response that is being acknowledged.

- id: rfc3312-1-ghost
  rfc: 3312
  section: "1"
  title: Introduction
  text: >-
    In order to minimize "ghost rings", it is necessary to reserve network
    resources for the session before the callee is alerted.

- id: rfc3312-1-precondition
  rfc: 3312
  section: "1"
  title: Introduction
  text: >-
    A precondition is a set of constraints about the session which are
    introduced in the offer. The recipient of the offer generates an answer,
    but does not alert the user or otherwise proceed with session
    establishment. That only occurs when the preconditions are met.

- id: rfc3311-1-early
  rfc: 3311
  section: "1"
  title: Introduction
  text: >-
    It can be sent by a UA within a dialog (early or confirmed) to update
    session parameters without impacting the dialog state itself.

- id: rfc3725-4.4-no-media
  rfc: 3725
  section: "4.4"
  title: Flow IV
  text: >-
    The initial INVITE (1) contains SDP with no media at all, meaning that there
    are no m lines. This is valid, and implies that the media makeup of the
    session will be established later through a re-INVITE [4].

- id: rfc3725-4.4-origin
  rfc: 3725
  section: "4.4"
  title: Flow IV
  text: >-
    The only change that is needed is to modify the origin lines, so that the
    origin line in offer2' is valid based on the value in offer1 (validity
    requires that the version increments by one, and that the other parameters
    remain unchanged).

- id: rfc3725-5-recommend
  rfc: 3725
  section: "5"
  title: Recommendations
  text: >-
    For calls to unknown entities, or to entities known to represent people, it
    is RECOMMENDED that Flow IV (Figure 4) be used for third party call control.

- id: rfc3725-4.1-timeout
  rfc: 3725
  section: "4.1"
  title: Flow I
  text: >-
    However, it has a serious timeout problem. User B may not answer the call
    immediately. The result is that the controller cannot send the ACK to A
    right away.

- id: rfc4353-4.1-focus
  rfc: 4353
  section: "4.1"
  title: Focus
  text: >-
    As its name implies, the focus is the center of the conference. All
    participants in the conference are connected to it by a SIP dialog.

- id: rfc4579-4.2-isfocus
  rfc: 4579
  section: "4.2"
  title: Session Establishment
  text: >-
    In session establishment, a focus MUST include the 'isfocus' feature
    parameter in the Contact header field unless the focus wishes to hide the
    fact that it is a focus.

- id: rfc5359-2.16-pickup
  rfc: 5359
  section: "2.16"
  title: Call Pickup
  text: >-
    This parameter prevents Alice from accepting the INVITE if Bob has already
    accepted the INVITE.

- id: rfc5359-2.15-park
  rfc: 5359
  section: "2.15"
  title: Call Park
  text: >-
    Carol wishes to retrieve the call, so she sends an INVITE containing the
    dialog identifiers to Alice, which replaces the session with the Park
    Server.

- id: rfc3264-5.1-inactive
  rfc: 3264
  section: "5.1"
  title: Unicast Streams
  text: >-
    If the offerer wishes to communicate, but wishes to neither send nor
    receive media at this time, it MUST mark the stream with an "a=inactive"
    attribute.
