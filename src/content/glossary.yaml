# Controlled vocabulary for the whole course (COURSE_STRUCTURE §5.1).
# Every lane label and every non-method diagram label must start with one of
# these terms or aliases. Use one term for one concept everywhere.

# --- The cast -------------------------------------------------------------
- term: Alice
  definition: The caller in every example. A user at atlanta.example.
- term: Bob
  definition: The callee in every example. A user at biloxi.example.
- term: Proxy A
  definition: The outbound proxy and authentication point for atlanta.example.
- term: Proxy B
  definition: The inbound proxy for biloxi.example. It finds Bob through its location service.
- term: Registrar
  definition: The server that accepts REGISTER requests for a domain and stores the bindings in its location service. In most examples it serves atlanta.example; in Module 12, biloxi.example.
- term: Carol
  definition: A third user. Bob is transferred to Carol in transfer examples; she is another support agent in Module 9.
- term: Proxy B1
  definition: One of the two proxies of biloxi.example in Module 11, sip1.biloxi.example (203.0.113.11).
- term: Proxy B2
  definition: One of the two proxies of biloxi.example in Module 11, sip2.biloxi.example (203.0.113.12).
- term: Desk phone
  definition: One of Bob's three registered devices in the forking examples.
- term: Mobile
  definition: One of Bob's three registered devices in the forking examples, a SIP app on his mobile phone.
- term: Softphone
  definition: One of Bob's three registered devices in the forking examples, a SIP app on his computer.
- term: Presence server
  definition: The server that collects presence state with PUBLISH and sends it to watchers with NOTIFY.
- term: SBC
  definition: Session Border Controller. A B2BUA at the edge of a network that protects and normalises SIP.
- term: NAT router
  aliases: [NAT A, NAT B]
  definition: The home router that translates private addresses to a public address. Where Alice and Bob each have one, they are NAT A and NAT B.
- term: Firewall
  definition: In Module 20, the office firewall in front of a PBX. It forwards some ports to the PBX and blocks the rest.
- term: Carrier gateway
  definition: The gateway between SIP and the public telephone network.

# --- Basics ----------------------------------------------------------------
- term: SIP
  aliases: [Session Initiation Protocol]
  definition: The protocol that finds users and sets up, changes, and ends calls and other sessions.
- term: signaling
  definition: The messages that set up, change, and end a call. In SIP calls, signaling is SIP.
- term: media
  definition: The audio or video itself. In SIP calls, media travels as RTP, on a different path from signaling.
- term: session
  definition: An exchange of media between participants, such as a phone call.
- term: user agent
  aliases: [UA]
  definition: An endpoint that sends and receives SIP, such as a phone, a softphone, or a gateway.
- term: codec
  definition: The method that turns sound into data and back, such as G.711 or Opus.

- term: VoIP
  aliases: [voice over IP]
  definition: Voice calls carried as packets over an IP network. SIP is one way to set them up.
- term: PSTN
  aliases: [public switched telephone network]
  definition: The traditional telephone network, built on circuits between telephone exchanges.
- term: circuit switching
  definition: A network that reserves a fixed path and capacity for each call, for the whole call.
- term: packet switching
  definition: A network that cuts data into packets. Packets from many sources share the same links.
- term: SS7
  aliases: [Signalling System No. 7]
  definition: The signaling network of the PSTN. Telephone exchanges use it to set up calls.
- term: ISUP
  definition: The SS7 protocol that sets up and ends calls between telephone exchanges.
- term: gateway
  definition: An element that connects two different networks, for example SIP and the PSTN.
- term: PBX
  aliases: [private branch exchange]
  definition: The phone system of an organisation. Modern PBXs use SIP.
- term: SIP trunk
  definition: A SIP connection between an organisation's PBX and a carrier, in place of physical phone lines.
- term: RFC
  aliases: [Request for Comments]
  definition: A numbered document from the IETF and other groups. The SIP standards are RFCs.
- term: IETF
  aliases: [Internet Engineering Task Force]
  definition: The organisation that develops Internet standards, including SIP, SDP, and RTP.
- term: ITU-T
  definition: The standards body of the International Telecommunication Union. It defined H.323, ISUP, and G.711.

# --- Elements and roles ----------------------------------------------------
- term: UAC
  aliases: [user agent client]
  definition: The user agent role that sends a request.
- term: UAS
  aliases: [user agent server]
  definition: The user agent role that receives a request and sends the responses.
- term: proxy
  definition: An element that forwards requests and responses. It does not start or end calls.
- term: B2BUA
  aliases: [back-to-back user agent]
  definition: An element that ends one call leg as a UAS and starts a new leg as a UAC.
- term: option tag
  definition: The name of a SIP extension, such as 100rel or timer, used in Supported, Require, and Unsupported.
- term: early dialog
  definition: A dialog created by a 1xx response with a To tag, before the call is answered.
- term: in-dialog request
  definition: A request sent inside an existing dialog. It carries both tags and follows the dialog's route set.
- term: early media
  definition: Audio sent before the call is answered, such as a ringback tone or an announcement from the far network.
- term: Q.850
  definition: The ITU-T list of cause values that telephone networks use to say why a call ended, such as 16 (normal clearing) or 17 (user busy).
- term: location service
  definition: The database of bindings from AORs to Contact addresses.
- term: stateless proxy
  definition: A proxy that forgets each message as soon as it forwards it. It keeps no transaction state.
- term: stateful proxy
  aliases: [transaction-stateful proxy]
  definition: A proxy that keeps the state of each transaction until the transaction ends. It can fork and retransmit.
- term: dialog-stateful proxy
  aliases: [call-stateful proxy]
  definition: A stateful proxy that also remembers each dialog until the call ends.
- term: outbound proxy
  definition: The proxy that a user agent sends all its requests to first, whatever the destination.
- term: Redirect server
  definition: A UAS that answers a request with a 3xx response and a list of Contact addresses to try.
- term: forking
  definition: A proxy sends one request to several Contact addresses, in parallel or one after another.
- term: topology hiding
  definition: An SBC removes or replaces the addresses of the inner network in each message it forwards.
- term: media relay
  definition: An element that receives RTP on one side and sends it out on the other. SBCs often do this.

# --- Addresses -------------------------------------------------------------
- term: AOR
  aliases: [address of record]
  definition: The public SIP address of a user, such as sip:alice@atlanta.example.
- term: Contact
  definition: The address where a user agent can be reached directly at this time.
- term: binding
  definition: One entry in the location service that maps an AOR to a Contact.
- term: URI
  aliases: [uniform resource identifier]
  definition: A text address for a resource, such as sip:alice@atlanta.example or tel:+12025550123.
- term: SIP URI
  definition: A URI with the sip scheme. It names a user or a server, such as sip:alice@atlanta.example.
- term: SIPS URI
  definition: A URI with the sips scheme. It requires TLS on every hop up to the target domain.
- term: tel URI
  definition: A URI that holds a telephone number, such as tel:+12025550123.
- term: Request-URI
  definition: The URI in the request line. It names the target of the request, and each proxy can replace it.
- term: display name
  definition: The optional human-readable name before a URI, such as "Alice" in Alice <sip:alice@atlanta.example>.

# --- Message structure ------------------------------------------------------
- term: branch
  definition: The Via parameter that identifies a transaction. It starts with z9hG4bK.
- term: tag
  definition: A random value in From or To that identifies one side of a dialog.
- term: transaction
  definition: One request and all its responses. An ACK for a non-2xx response is part of the INVITE transaction.
- term: dialog
  definition: A peer-to-peer SIP relationship identified by Call-ID, local tag, and remote tag.
- term: dialog ID
  definition: Call-ID, local tag, and remote tag. Each side sees the same tags, swapped.
- term: confirmed dialog
  definition: A dialog created or confirmed by a 2xx response. It lasts until BYE.
- term: remote target
  definition: The URI where a UA sends its next request in a dialog. It comes from the peer's Contact.
- term: target refresh
  definition: A request that can change the remote target, such as re-INVITE or UPDATE.
- term: glare
  definition: Two re-INVITEs in the same dialog that cross. Both get 491 Request Pending.
- term: session timer
  definition: A keepalive for a call (RFC 4028). One side refreshes the session before Session-Expires runs out.
- term: refresher
  definition: The side that sends the session refreshes, named in the refresher parameter of Session-Expires.
- term: route set
  definition: The list of proxies that in-dialog requests must visit, built from Record-Route.
- term: Via
  definition: A header that records the path of a request. Each hop adds one on top; the response follows them back and each hop removes its own.
- term: received
  definition: A Via parameter that the next hop adds. It holds the source IP address of the request.
- term: rport
  definition: A Via parameter (RFC 3581). The sender adds it empty; the next hop fills in the source port, and sends the response there.
- term: Record-Route
  definition: A header that a proxy adds to the request that creates a dialog, to stay in the path of later requests in that dialog.
- term: Route
  definition: A header that lists the proxies a request must visit, in order. Each proxy removes its own entry.
- term: pre-loaded Route
  aliases: [pre-existing route set]
  definition: A Route header that a UA puts in a request outside a dialog. It usually names the outbound proxy.
- term: loose routing
  aliases: [loose router, lr]
  definition: The routing of RFC 3261. The Request-URI keeps the target; Route lists the proxies to visit. The lr parameter marks a loose router.
- term: strict routing
  aliases: [strict router]
  definition: The old routing of RFC 2543. Each element puts the next Route value into the Request-URI, so the target moves to the end of Route.
- term: Max-Forwards
  definition: A counter in each request, 70 at the start. Each proxy decrements it; at 0 the request stops with 483 Too Many Hops.
- term: loop
  definition: A request that comes back to a proxy with nothing changed. The proxy can answer 482 Loop Detected.
- term: spiral
  definition: A request that comes back to a proxy with a different Request-URI, for example after call forwarding. It is not an error.
- term: multi-homed proxy
  definition: A proxy with interfaces in two or more networks, such as a private LAN and the Internet.
- term: double Record-Route
  definition: A multi-homed proxy adds two Record-Route values, one for each interface it uses (RFC 5658).

# --- Authentication --------------------------------------------------------
- term: challenge
  definition: A 401 or 407 response that asks the UAC for credentials.
- term: credentials
  definition: The Authorization or Proxy-Authorization header that answers a challenge.
- term: realm
  definition: The name of the protection domain. It tells the UAC which username and password to use.
- term: nonce
  definition: A one-time value from the server. It stops an attacker from reusing an old response.
- term: cnonce
  definition: A one-time value from the client, used when qop is present.
- term: nonce count
  aliases: [nc]
  definition: The number of requests sent with the same nonce, as 8 hexadecimal digits.
- term: qop
  aliases: [quality of protection]
  definition: The protection level. "auth" protects the request method and URI.
- term: HA1
  definition: The hash of username, realm, and password.
- term: HA2
  definition: The hash of the request method and the digest URI.
- term: digest response
  aliases: [response]
  definition: The final hash that proves the UAC knows the password.

# --- Transactions and timers ---------------------------------------------
- term: client transaction
  definition: The side of a transaction that sends the request and receives the responses.
- term: server transaction
  definition: The side of a transaction that receives the request and sends the responses.
- term: transaction user
  aliases: [TU]
  definition: The layer above a transaction that uses it, such as the UA core or a stateful proxy core.
- term: UA core
  definition: The part of a user agent above the transaction layer. It sends the ACK for a 2xx and retransmits a 2xx to INVITE.
- term: magic cookie
  definition: The text z9hG4bK at the start of a branch. It says that the branch is unique (RFC 3261).
- term: retransmission
  definition: The same message sent again because no answer came. It has the same branch and CSeq.
- term: stray response
  definition: A response that matches no client transaction. A proxy drops it (RFC 6026).
- term: T1
  definition: The round-trip time estimate. The default is 500 ms.
- term: T2
  definition: The longest interval between retransmissions of a non-INVITE request or an INVITE response. The default is 4 s.
- term: T4
  definition: The longest time a message stays in the network. The default is 5 s.
- term: Timer A
  definition: Resends an INVITE over UDP. It starts at T1 and doubles each time.
- term: Timer B
  definition: Ends an INVITE client transaction that has no response after 64×T1 (32 seconds).
- term: Timer D
  definition: Keeps an INVITE client transaction in Completed (32 s on UDP) to absorb copies of a 300–699 response.
- term: Timer E
  definition: Resends a non-INVITE request over UDP. It starts at T1 and doubles up to T2.
- term: Timer F
  definition: Ends a non-INVITE client transaction that has no final response after 64×T1.
- term: Timer G
  definition: Resends a 300–699 response to INVITE over UDP until the ACK arrives. It starts at T1 and doubles up to T2.
- term: Timer H
  definition: The limit, 64×T1 (32 seconds), for receiving the ACK for a 300–699 response to INVITE.
- term: Timer I
  definition: Keeps an INVITE server transaction in Confirmed (T4 on UDP) to absorb copies of the ACK.
- term: Timer J
  definition: Keeps a non-INVITE server transaction in Completed (64×T1 on UDP) to answer copies of the request.
- term: Timer K
  definition: Keeps a non-INVITE client transaction in Completed (T4 on UDP) to absorb copies of the response.
- term: Timer L
  definition: Keeps an INVITE server transaction in the Accepted state for 64×T1 after a 2xx (RFC 6026).
- term: Timer M
  definition: Keeps an INVITE client transaction in the Accepted state for 64×T1 after a 2xx (RFC 6026).

# --- Media -----------------------------------------------------------------
- term: RTP
  definition: The protocol that carries audio and video.
- term: RTCP
  definition: The control protocol that reports RTP quality.
- term: SDP
  aliases: [Session Description Protocol]
  definition: The body format that describes media sessions.
- term: SRTP
  definition: Secure RTP. It encrypts and authenticates media packets.
- term: TLS
  definition: Transport Layer Security. It encrypts SIP between two hops.
- term: WebSocket
  aliases: [WS, WSS]
  definition: A two-way connection that a web page opens over HTTP or HTTPS. SIP runs over it in browsers (RFC 7118).
- term: DTLS
  definition: TLS for UDP. DTLS-SRTP runs a DTLS handshake on the media ports to create the SRTP keys.
- term: SDES
  aliases: [security descriptions]
  definition: SRTP keys sent in the SDP, in a=crypto lines (RFC 4568). Safe only when the SIP travels over TLS.
- term: ZRTP
  definition: A key exchange inside the media stream. The callers compare a short code to detect a man in the middle.
- term: fingerprint
  definition: The hash of a certificate, sent in the SDP (a=fingerprint), so the other side can check the certificate in a DTLS handshake.
- term: offer
  aliases: [SDP offer]
  definition: The SDP that one side sends first, listing the media it wants and the codecs it can use.
- term: answer
  aliases: [SDP answer]
  definition: The SDP sent back for an offer. It accepts or rejects each stream and picks codecs from the offer.
- term: media description
  aliases: [m= line, m-line, media section]
  definition: One stream in SDP. It starts with an m= line that gives the media type, port, transport, and formats.
- term: payload type
  aliases: [PT]
  definition: The number in each RTP packet that says which codec the packet uses. 0 to 95 are static; 96 to 127 are dynamic.
- term: DTMF
  aliases: [telephone-event]
  definition: The tones of the telephone keypad. In VoIP they usually travel as RTP telephone-event packets (RFC 4733).
- term: early offer
  definition: The offer is in the INVITE, and the answer is in the 200 OK (or a reliable 1xx).
- term: late offer
  aliases: [delayed offer]
  definition: The INVITE has no SDP. The offer is in the 200 OK (or a reliable 1xx), and the answer is in the ACK (or PRACK).
- term: hold
  definition: Stopping the media from the other side with a new offer, usually a=sendonly or a=inactive.
- term: CNAME
  definition: The name in RTCP that identifies an endpoint. It does not change when the SSRC does.
- term: MOS
  aliases: [Mean Opinion Score]
  definition: A call quality score from 1 (bad) to 5 (excellent). Tools estimate it from the R-factor.
- term: R-factor
  definition: A call quality score from 0 to 100, calculated from delay, loss, and the codec with the ITU-T E-model.
- term: IVR
  aliases: [interactive voice response]
  definition: An automated phone menu that plays prompts and reads the keys the caller presses.
- term: SSRC
  definition: The random 32-bit number in each RTP packet that names the stream it belongs to.
- term: jitter
  definition: The variation in packet delay. Packets sent every 20 ms arrive 12, 31, 18 ms apart.
- term: jitter buffer
  definition: A queue in the receiver that holds packets for a short time, so that they can be played at an even pace.
- term: comfort noise
  aliases: [CN]
  definition: Soft background noise that the receiver plays during silence, so the line does not sound dead.
- term: symmetric RTP
  definition: Sending RTP from the same address and port where it is received. NAT routers and SBCs need it.
- term: latching
  definition: An SBC sends media back to the address and port that the media came from, not to the address in the SDP.
- term: STUN
  aliases: [STUN server]
  definition: A protocol that tells a device its public address and port, as a NAT router maps them.
- term: TURN
  aliases: [TURN server]
  definition: A STUN extension (RFC 8656). A server on the Internet gives a device a relayed address and relays media to and from it.
- term: ICE
  aliases: [Interactive Connectivity Establishment]
  definition: A method (RFC 8445) in which both sides exchange their candidates in SDP, test the candidate pairs with STUN, and send media on a pair that works.
- term: candidate
  aliases: [ICE candidate, host candidate, server-reflexive candidate, relayed candidate, peer-reflexive candidate, srflx, prflx]
  definition: An address where a device might receive media. Host candidates are its own addresses, server-reflexive ones come from STUN, relayed ones from TURN.
- term: connectivity check
  aliases: [ICE check]
  definition: A STUN request that one ICE agent sends from one of its candidates to one of the other side's, to test whether that pair works.
- term: symmetric NAT
  aliases: [address and port-dependent mapping]
  definition: A NAT router that makes a new mapping for each destination. The address that STUN reports works only for the STUN server.
- term: SIP ALG
  aliases: [ALG, SIP helper, application layer gateway]
  definition: A router feature that rewrites the addresses inside SIP and SDP. It is often buggy, and it breaks NAT fixes that already work.

# --- Networking (Module 2) ------------------------------------------------
- term: IP address
  definition: The address of a network interface. IPv4 addresses look like 192.0.2.10; IPv6 addresses look like 2001:db8::10.
- term: port
  definition: A number from 0 to 65535 that selects one application on a host. SIP usually listens on 5060 (5061 for TLS).
- term: socket
  definition: One end of a network conversation, written as IP address and port, such as 192.0.2.10:5060.
- term: UDP
  definition: A transport that sends independent packets with no connection and no retransmission. SIP over UDP retransmits by itself.
- term: TCP
  aliases: [TCP SYN, TCP SYN-ACK, TCP ACK]
  definition: A transport that opens a connection and delivers a reliable, ordered byte stream.
- term: DNS
  aliases: [DNS query, DNS answer]
  definition: The Domain Name System. It turns names such as proxy.atlanta.example into IP addresses.
- term: DNS resolver
  definition: The server that a device asks to look up DNS names for it.
- term: A record
  aliases: [AAAA record, address record]
  definition: A DNS record that gives the IPv4 address (A) or IPv6 address (AAAA) of a name.
- term: SRV record
  aliases: [SRV]
  definition: A DNS record that lists the servers for a service, such as _sip._udp.biloxi.example, each with a priority, a weight, a port, and a host name (RFC 2782).
- term: NAPTR record
  aliases: [NAPTR]
  definition: A DNS record that says which transports a SIP domain offers, in order of preference, and which SRV name to query for each (RFC 3263).
- term: priority
  definition: The SRV field for failover. A client tries the lowest number first, and a higher number only when all lower ones fail.
- term: weight
  definition: The SRV field for load sharing. Among servers with the same priority, a larger weight gets a larger share of the requests.
- term: TTL
  aliases: [time to live]
  definition: How long, in seconds, a resolver may keep a DNS answer before it asks again.
- term: failover
  definition: Moving to the next server when one fails, for example after a 503, a refused connection, or a Timer B timeout.
- term: NAT
  aliases: [network address translation]
  definition: A router function that rewrites private addresses and ports into public ones, and back.
- term: private address
  definition: An IPv4 address from the RFC 1918 ranges (10/8, 172.16/12, 192.168/16). It is not reachable from the Internet.
- term: MTU
  aliases: [maximum transmission unit]
  definition: The largest packet a link can carry in one piece. On Ethernet it is usually 1500 bytes.
- term: Edge proxy
  aliases: [edge proxies]
  definition: The first proxy that a user agent reaches, at the edge of its provider's network. It often handles NAT and keeps the connection to the phone.
- term: expiry
  aliases: [expiry time, expiration interval]
  definition: How long a binding lasts, in seconds, unless the user agent refreshes it.
- term: refresh
  definition: A new REGISTER, with the same Contact and Call-ID and a higher CSeq, that restarts the expiry of a binding.
- term: keepalive
  aliases: [keep-alive, keepalives, keep-alives]
  definition: A small packet sent only to keep a NAT mapping or a connection open, such as a double CRLF, a STUN request, or an OPTIONS request.
- term: NAT mapping
  aliases: [NAT binding, pinhole]
  definition: The NAT router's record of one private address and port and the public port it uses for them. It ends after a time with no outgoing traffic.
- term: instance ID
  aliases: [instance-id, +sip.instance]
  definition: A permanent, unique URN for one device, sent in the +sip.instance Contact parameter (RFC 5626). It does not change when the device reboots or moves.
- term: reg-id
  definition: A Contact parameter that numbers the flows of one device (RFC 5626). Same instance ID and reg-id means "replace my old registration".
- term: SIP Outbound
  aliases: [outbound]
  definition: RFC 5626. A user agent keeps its own connections to the server open, with keepalives, and receives its calls over them.
- term: flow
  definition: In SIP Outbound, the connection or UDP address pair that a user agent opened to its edge proxy or registrar.
- term: GRUU
  aliases: [globally routable user agent URI, public GRUU, temporary GRUU]
  definition: A URI that reaches one device of a user, not all of them (RFC 5627). It has the gr parameter.
- term: Path
  definition: A header that proxies add to a REGISTER. The registrar stores it, so later requests to the user pass the same proxies (RFC 3327).
- term: Service-Route
  definition: A header in the 200 OK to REGISTER. It lists the proxies that the user agent puts in Route for its own requests (RFC 3608).
- term: Min-Expires
  definition: The header in a 423 response that gives the shortest expiry the registrar accepts.
- term: Attacker
  definition: In Module 14, a host on the Internet that scans, guesses passwords, floods, or forges requests.
- term: trust domain
  definition: A set of SIP elements that trust each other to authenticate users and to assert identity with P-Asserted-Identity (RFC 3325).
- term: P-Asserted-Identity
  aliases: [PAI]
  definition: The identity of the caller as the network verified it. Only meaningful when it comes from a member of the trust domain.
- term: toll fraud
  definition: Calls that an attacker makes on someone else's account or trunk, usually to expensive or premium-rate numbers.
- term: mutual TLS
  aliases: [mTLS]
  definition: TLS in which both sides present a certificate and check the other's, as between two proxies or on a SIP trunk.
- term: certificate
  aliases: [X.509 certificate]
  definition: A file signed by a certificate authority that binds a public key to names, such as the SIP domain of a server.
