id: ack-reaches-bob
title: "Fixed: Proxy B stays in the path"
summary: "Proxy B record-routes and replaces Bob's private Contact with the public address it saw. The ACK travels through Proxy B and reaches Bob."
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: proxyB, label: Proxy B, kind: proxy, sub: 203.0.113.10 }
  - { id: bob, label: Bob, kind: ua, sub: 10.0.0.20 · NAT }
steps:
  - from: alice
    to: proxyB
    label: INVITE
    caption: Alice sends the INVITE to Proxy B.
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776asdhds
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: a84b4c76e66710@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000

  - from: proxyB
    to: alice
    label: "100 Trying"
    caption: Proxy B answers 100 Trying on this hop.
    message: |
      SIP/2.0 100 Trying
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776asdhds
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: a84b4c76e66710@192.0.2.10
      CSeq: 1 INVITE
      Content-Length: {auto}

  - from: proxyB
    to: bob
    label: INVITE
    caption: Proxy B forwards the INVITE through the NAT router and adds Record-Route.
    message: |
      INVITE sip:bob@10.0.0.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bK2d4790
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776asdhds
      Max-Forwards: 69
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: a84b4c76e66710@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000

  - from: bob
    to: proxyB
    label: "180 Ringing"
    caption: "Bob's phone rings. Its Contact is a private address: 10.0.0.20."
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bK2d4790
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776asdhds
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=a6c85cf
      Call-ID: a84b4c76e66710@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@10.0.0.20:5060>
      Content-Length: {auto}

  - from: proxyB
    to: alice
    label: "180 Ringing"
    caption: Proxy B replaces the private Contact with the address of the NAT router.
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776asdhds
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=a6c85cf
      Call-ID: a84b4c76e66710@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.77:41000>
      Content-Length: {auto}

  - from: bob
    to: proxyB
    label: "200 OK"
    caption: "Bob answers. Bob's UA core starts to send the 200 OK again until an ACK arrives."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bK2d4790
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776asdhds
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=a6c85cf
      Call-ID: a84b4c76e66710@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@10.0.0.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 10.0.0.20
      s=-
      c=IN IP4 10.0.0.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: proxyB
    to: alice
    label: "200 OK"
    caption: Proxy B forwards the 200 OK with the public Contact and its Record-Route.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776asdhds
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=a6c85cf
      Call-ID: a84b4c76e66710@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.77:41000>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 10.0.0.20
      s=-
      c=IN IP4 10.0.0.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: alice
    to: proxyB
    label: ACK
    caption: Alice sends the ACK with a new branch. The route set sends it to Proxy B first.
    rfc: rfc3261-13.2.2.4-ack-core
    message: |
      ACK sip:bob@203.0.113.77:41000 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK5a1e0
      Max-Forwards: 70
      Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=a6c85cf
      Call-ID: a84b4c76e66710@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}

  - from: proxyB
    to: bob
    label: ACK
    caption: "Proxy B sends the ACK to the NAT router's public address. The router passes it to Bob, and the 200 OK copies stop."
    message: |
      ACK sip:bob@203.0.113.77:41000 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bK2d4791
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK5a1e0
      Max-Forwards: 69
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=a6c85cf
      Call-ID: a84b4c76e66710@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}
