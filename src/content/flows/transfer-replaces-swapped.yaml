id: transfer-replaces-swapped
title: "Broken: the Replaces tags are swapped"
summary: Alice's phone builds Replaces from its own point of view. Carol's phone finds no dialog with those tags, answers 481, and the transfer fails.
broken: true
breaks:
  - replaces-match
lanes:
  - id: alice
    label: Alice
    kind: ua
    sub: 192.0.2.10
  - id: bob
    label: Bob
    kind: ua
    sub: 203.0.113.20
  - id: carol
    label: Carol
    kind: ua
    sub: 198.51.100.30
steps:
  - from: alice
    to: bob
    label: INVITE
    caption: Alice calls Bob.
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
  - from: bob
    to: alice
    label: 200 OK
    caption: Bob answers.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
  - from: alice
    to: bob
    label: ACK
    caption: Alice's phone confirms the 200 OK.
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b2048
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}
  - kind: media
    from: alice
    to: bob
    proto: rtp
    label: RTP audio (PCMU)
    caption: Bob asks for someone in sales. Alice decides to transfer him to Carol.
  - from: alice
    to: bob
    label: INVITE (hold)
    caption: Alice puts Bob on hold first, so he hears music, not the transfer.
    message: |
      INVITE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b231b
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 2 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844527 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
      a=sendonly
    rfc: rfc3264-8.4-hold
  - from: bob
    to: alice
    label: 200 OK (recvonly)
    caption: Bob's phone answers a=recvonly.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b231b
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 2 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844565 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
      a=recvonly
  - from: alice
    to: bob
    label: ACK
    caption: Alice's phone confirms the 200 OK.
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b25ee
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 2 ACK
      Content-Length: {auto}
  - kind: media
    from: alice
    to: bob
    proto: rtp
    label: RTP music on hold
    caption: Bob hears music on hold.
    oneway: true
  - from: alice
    to: carol
    label: INVITE
    caption: Alice calls Carol, on a second line. This is a new dialog, with a new Call-ID.
    message: |
      INVITE sip:carol@chicago.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b28c1
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=b81ac3e2
      To: Carol <sip:carol@chicago.example>
      Call-ID: c7d2e19a5b@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844530 2890844530 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49172 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
  - from: carol
    to: alice
    label: 180 Ringing
    caption: Carol's phone rings.
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b28c1
      From: Alice <sip:alice@atlanta.example>;tag=b81ac3e2
      To: Carol <sip:carol@chicago.example>;tag=5f35a3
      Call-ID: c7d2e19a5b@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:carol@198.51.100.30:5060>
      Content-Length: {auto}
  - from: carol
    to: alice
    label: 200 OK
    caption: Carol answers.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b28c1
      From: Alice <sip:alice@atlanta.example>;tag=b81ac3e2
      To: Carol <sip:carol@chicago.example>;tag=5f35a3
      Call-ID: c7d2e19a5b@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:carol@198.51.100.30:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=carol 3302218841 3302218841 IN IP4 198.51.100.30
      s=-
      c=IN IP4 198.51.100.30
      t=0 0
      m=audio 5004 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
  - from: alice
    to: carol
    label: ACK
    caption: Alice's phone confirms the 200 OK.
    message: |
      ACK sip:carol@198.51.100.30:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b2b94
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=b81ac3e2
      To: Carol <sip:carol@chicago.example>;tag=5f35a3
      Call-ID: c7d2e19a5b@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}
  - kind: media
    from: alice
    to: carol
    proto: rtp
    label: RTP audio (consultation)
    caption: Alice tells Carol about Bob. Bob still hears music on hold.
  - from: alice
    to: bob
    label: REFER
    caption: Alice transfers Bob. Refer-To carries Carol's Contact and a Replaces header for Alice's call with Carol.
    message: |
      REFER sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b2e67
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 3 REFER
      Contact: <sip:alice@192.0.2.10:5060>
      Refer-To: <sip:carol@198.51.100.30:5060?Replaces=c7d2e19a5b%40192.0.2.10%3Bto-tag%3Db81ac3e2%3Bfrom-tag%3D5f35a3>
      Referred-By: <sip:alice@atlanta.example>
      Content-Length: {auto}
    rfc: rfc3892-1-referred-by
    warn: In Replaces, to-tag must be Carol's own tag, and from-tag Alice's. Alice's phone swapped them.
  - from: bob
    to: alice
    label: 202 Accepted
    caption: Bob's phone accepts the REFER. It will call Carol, and report back in NOTIFYs.
    message: |
      SIP/2.0 202 Accepted
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b2e67
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 3 REFER
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Length: {auto}
    rfc: rfc3515-2.4.2-202
  - from: bob
    to: alice
    label: NOTIFY (100)
    caption: The first NOTIFY says that Bob's phone is trying. Its body is a message/sipfrag.
    message: |
      NOTIFY sip:alice@192.0.2.10:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKb01f6b
      Max-Forwards: 70
      From: Bob <sip:bob@biloxi.example>;tag=314159
      To: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 NOTIFY
      Contact: <sip:bob@203.0.113.20:5060>
      Event: refer
      Subscription-State: active;expires=60
      Content-Type: message/sipfrag;version=2.0
      Content-Length: {auto}

      SIP/2.0 100 Trying
    rfc: rfc3515-2.4.4-notify
  - from: alice
    to: bob
    label: 200 OK (NOTIFY)
    caption: Alice's phone confirms the NOTIFY.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKb01f6b
      From: Bob <sip:bob@biloxi.example>;tag=314159
      To: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 NOTIFY
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Length: {auto}
  - from: bob
    to: carol
    label: INVITE (Replaces)
    caption: Bob's phone calls Carol's Contact, with the Replaces header from Refer-To. It is a new dialog, with a new Call-ID.
    message: |
      INVITE sip:carol@198.51.100.30:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKb0223e
      Max-Forwards: 70
      From: Bob <sip:bob@biloxi.example>;tag=c4f2a91d
      To: Carol <sip:carol@chicago.example>
      Call-ID: a84b4c76e66710@203.0.113.20
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Replaces: c7d2e19a5b@192.0.2.10;to-tag=b81ac3e2;from-tag=5f35a3
      Referred-By: <sip:alice@atlanta.example>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844570 2808844570 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3458 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
  - from: carol
    to: bob
    label: 481 Call/Transaction Does Not Exist
    caption: Carol's phone compares to-tag with its own tag and finds no such dialog. It answers 481.
    message: |
      SIP/2.0 481 Call/Transaction Does Not Exist
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKb0223e
      From: Bob <sip:bob@biloxi.example>;tag=c4f2a91d
      To: Carol <sip:carol@chicago.example>;tag=e8d0b6
      Call-ID: a84b4c76e66710@203.0.113.20
      CSeq: 1 INVITE
      Content-Length: {auto}
  - from: bob
    to: carol
    label: ACK
    caption: Bob's phone confirms the 481.
    message: |
      ACK sip:carol@198.51.100.30:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKb0223e
      Max-Forwards: 70
      From: Bob <sip:bob@biloxi.example>;tag=c4f2a91d
      To: Carol <sip:carol@chicago.example>;tag=e8d0b6
      Call-ID: a84b4c76e66710@203.0.113.20
      CSeq: 1 ACK
      Content-Length: {auto}
  - from: bob
    to: alice
    label: NOTIFY (481)
    caption: "The last NOTIFY carries Carol's final response: 481. Alice now knows that the transfer failed."
    message: |
      NOTIFY sip:alice@192.0.2.10:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKb02511
      Max-Forwards: 70
      From: Bob <sip:bob@biloxi.example>;tag=314159
      To: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 2 NOTIFY
      Contact: <sip:bob@203.0.113.20:5060>
      Event: refer
      Subscription-State: terminated;reason=noresource
      Content-Type: message/sipfrag;version=2.0
      Content-Length: {auto}

      SIP/2.0 481 Call/Transaction Does Not Exist
    rfc: rfc3515-2.4.5-sipfrag
  - from: alice
    to: bob
    label: 200 OK (NOTIFY)
    caption: Alice's phone confirms the last NOTIFY. The subscription has ended.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKb02511
      From: Bob <sip:bob@biloxi.example>;tag=314159
