id: cancel-after-200
title: "Broken: CANCEL after the 200 OK"
summary: Alice's phone tries to end an answered call with CANCEL. The CANCEL has no effect, and the call stays up.
broken: true
breaks: [cancel-after-final]
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: bob
    label: INVITE
    caption: Alice's phone calls Bob's phone.
    message: |
      INVITE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000

  - from: bob
    to: alice
    label: 180 Ringing
    caption: Bob's phone rings.
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Length: {auto}

  - from: bob
    to: alice
    label: 200 OK
    caption: Bob answers, at the same moment that Alice decides to hang up.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: alice
    to: bob
    label: ACK
    caption: Alice's phone confirms the 200 OK. The call is now set up.
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b76
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}

  - from: alice
    to: bob
    label: CANCEL
    caption: Alice's phone sends CANCEL to end the call.
    warn: The INVITE already has its final response. CANCEL cannot end an answered call.
    rfc: rfc3261-9-no-effect
    message: |
      CANCEL sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 CANCEL
      Content-Length: {auto}

  - from: bob
    to: alice
    label: 200 OK (CANCEL)
    caption: Bob's phone accepts the CANCEL, but nothing else happens.
    warn: Bob's phone stays in the call. Depending on timing, the answer is 481 instead.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 CANCEL
      Content-Length: {auto}

  - from: bob
    to: alice
    kind: media
    label: RTP still flows
    caption: Bob's phone still sends media. Bob hears silence and waits for Alice.
    warn: The call stays up until Bob hangs up, or until a session timer ends it.
