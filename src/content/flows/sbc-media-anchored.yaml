id: sbc-media-anchored
title: An SBC that anchors the media
summary: The SBC replaces the addresses in the SDP with its own, and relays the media.
lanes:
  - id: pbx
    label: PBX
    kind: b2bua
    sub: 10.1.1.20
  - id: sbc
    label: SBC
    kind: sbc
    sub: 203.0.113.1
  - id: gw
    label: Carrier gateway
    kind: ua
    sub: 198.51.100.50
steps:
  - from: pbx
    to: sbc
    label: INVITE
    caption: The PBX sends a call to the SBC on its inside interface. Its SDP gives its private address.
    message: |
      INVITE sip:+14045550199@10.1.1.1;user=phone SIP/2.0
      Via: SIP/2.0/UDP 10.1.1.20:5060;branch=z9hG4bKpx227f
      Max-Forwards: 70
      From: "Alice" <sip:+14045550101@corp.example;user=phone>;tag=px81a2
      To: <sip:+14045550199@10.1.1.1;user=phone>
      Call-ID: 5f0c1e9a@10.1.1.20
      CSeq: 1 INVITE
      Contact: <sip:pbx@10.1.1.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=pbx 1001 1001 IN IP4 10.1.1.20
      s=-
      c=IN IP4 10.1.1.20
      t=0 0
      m=audio 20000 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
  - from: sbc
    to: gw
    label: INVITE
    caption: The SBC hides the inside addresses in the headers and in the SDP. The media will flow through it.
    message: |
      INVITE sip:+14045550199@198.51.100.50;user=phone SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.1:5060;branch=z9hG4bKsb1dae
      Max-Forwards: 69
      From: "Alice" <sip:+14045550101@corp.example;user=phone>;tag=sb20d4
      To: <sip:+14045550199@sip.carrier.example;user=phone>
      Call-ID: b8e21d07a4f3c5
      CSeq: 1 INVITE
      Contact: <sip:sbc@203.0.113.1:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=sbc 7001 7001 IN IP4 203.0.113.1
      s=-
      c=IN IP4 203.0.113.1
      t=0 0
      m=audio 40000 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
  - from: gw
    to: sbc
    label: 200 OK
    caption: The carrier answers.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.1:5060;branch=z9hG4bKsb1dae
      From: "Alice" <sip:+14045550101@corp.example;user=phone>;tag=sb20d4
      To: <sip:+14045550199@sip.carrier.example;user=phone>;tag=gw41a
      Call-ID: b8e21d07a4f3c5
      CSeq: 1 INVITE
      Contact: <sip:gw@198.51.100.50:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=gw 3001 3001 IN IP4 198.51.100.50
      s=-
      c=IN IP4 198.51.100.50
      t=0 0
      m=audio 50000 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
  - from: sbc
    to: pbx
    label: 200 OK
    caption: The SBC answers the PBX with its inside address, 10.1.1.1, in the SDP.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 10.1.1.20:5060;branch=z9hG4bKpx227f
      From: "Alice" <sip:+14045550101@corp.example;user=phone>;tag=px81a2
      To: <sip:+14045550199@10.1.1.1;user=phone>;tag=sb4410f
      Call-ID: 5f0c1e9a@10.1.1.20
      CSeq: 1 INVITE
      Contact: <sip:sbc@10.1.1.1:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=sbc 7002 7002 IN IP4 10.1.1.1
      s=-
      c=IN IP4 10.1.1.1
      t=0 0
      m=audio 40002 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
  - from: pbx
    to: sbc
    label: ACK
    caption: The PBX acknowledges.
    message: |
      ACK sip:sbc@10.1.1.1:5060 SIP/2.0
      Via: SIP/2.0/UDP 10.1.1.20:5060;branch=z9hG4bKpx2552
      Max-Forwards: 70
      From: "Alice" <sip:+14045550101@corp.example;user=phone>;tag=px81a2
      To: <sip:+14045550199@10.1.1.1;user=phone>;tag=sb4410f
      Call-ID: 5f0c1e9a@10.1.1.20
      CSeq: 1 ACK
      Content-Length: {auto}
  - from: sbc
    to: gw
    label: ACK
    caption: The SBC acknowledges the carrier's 200 OK.
    message: |
      ACK sip:gw@198.51.100.50:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.1:5060;branch=z9hG4bKsb2081
      Max-Forwards: 70
      From: "Alice" <sip:+14045550101@corp.example;user=phone>;tag=sb20d4
      To: <sip:+14045550199@sip.carrier.example;user=phone>;tag=gw41a
      Call-ID: b8e21d07a4f3c5
      CSeq: 1 ACK
      Content-Length: {auto}
  - kind: media
    from: gw
    to: pbx
    proto: rtp
    label: RTP
    caption: The media flows through the SBC, in both directions.
