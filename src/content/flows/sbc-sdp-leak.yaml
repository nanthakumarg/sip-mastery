id: sbc-sdp-leak
title: An SBC that hides the headers but copies the SDP
summary: The SBC rewrites the SIP headers but passes the PBX's SDP to the carrier, with a private address in it.
broken: true
breaks:
  - sdp-private-address
lanes:
  - id: pbx
    label: PBX
    kind: b2bua
    sub: 10.1.1.20
  - id: sbc
    label: SBC
    kind: sbc
    sub: 203.0.113.1
  - id: gw
    label: Carrier gateway
    kind: ua
    sub: 198.51.100.50
steps:
  - from: pbx
    to: sbc
    label: INVITE
    caption: The PBX sends a call to the SBC on its inside interface. Its SDP gives its private address.
    message: |
      INVITE sip:+14045550199@10.1.1.1;user=phone SIP/2.0
      Via: SIP/2.0/UDP 10.1.1.20:5060;branch=z9hG4bKpx227f
      Max-Forwards: 70
      From: "Alice" <sip:+14045550101@corp.example;user=phone>;tag=px81a2
      To: <sip:+14045550199@10.1.1.1;user=phone>
      Call-ID: 5f0c1e9a@10.1.1.20
      CSeq: 1 INVITE
      Contact: <sip:pbx@10.1.1.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=pbx 1001 1001 IN IP4 10.1.1.20
      s=-
      c=IN IP4 10.1.1.20
      t=0 0
      m=audio 20000 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
  - from: sbc
    to: gw
    label: INVITE
    caption: "The SBC hides the inside addresses in the headers: new Call-ID, its own Via and Contact. It copies the SDP unchanged."
    message: |
      INVITE sip:+14045550199@198.51.100.50;user=phone SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.1:5060;branch=z9hG4bKsb1dae
      Max-Forwards: 69
      From: "Alice" <sip:+14045550101@corp.example;user=phone>;tag=sb20d4
      To: <sip:+14045550199@sip.carrier.example;user=phone>
      Call-ID: b8e21d07a4f3c5
      CSeq: 1 INVITE
      Contact: <sip:sbc@203.0.113.1:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=pbx 1001 1001 IN IP4 10.1.1.20
      s=-
      c=IN IP4 10.1.1.20
      t=0 0
      m=audio 20000 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
    warn: The SDP still gives 10.1.1.20. The carrier cannot send media to a private address.
  - from: gw
    to: sbc
    label: 200 OK
    caption: The carrier answers.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.1:5060;branch=z9hG4bKsb1dae
      From: "Alice" <sip:+14045550101@corp.example;user=phone>;tag=sb20d4
      To: <sip:+14045550199@sip.carrier.example;user=phone>;tag=gw41a
      Call-ID: b8e21d07a4f3c5
      CSeq: 1 INVITE
      Contact: <sip:gw@198.51.100.50:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=gw 3001 3001 IN IP4 198.51.100.50
      s=-
      c=IN IP4 198.51.100.50
      t=0 0
      m=audio 50000 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
  - from: sbc
    to: pbx
    label: 200 OK
    caption: The SBC passes the carrier's SDP to the PBX.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 10.1.1.20:5060;branch=z9hG4bKpx227f
      From: "Alice" <sip:+14045550101@corp.example;user=phone>;tag=px81a2
      To: <sip:+14045550199@10.1.1.1;user=phone>;tag=sb4410f
      Call-ID: 5f0c1e9a@10.1.1.20
      CSeq: 1 INVITE
      Contact: <sip:sbc@10.1.1.1:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=gw 3001 3001 IN IP4 198.51.100.50
      s=-
      c=IN IP4 198.51.100.50
      t=0 0
      m=audio 50000 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
  - from: pbx
    to: sbc
    label: ACK
    caption: The PBX acknowledges.
    message: |
      ACK sip:sbc@10.1.1.1:5060 SIP/2.0
      Via: SIP/2.0/UDP 10.1.1.20:5060;branch=z9hG4bKpx2552
      Max-Forwards: 70
      From: "Alice" <sip:+14045550101@corp.example;user=phone>;tag=px81a2
      To: <sip:+14045550199@10.1.1.1;user=phone>;tag=sb4410f
      Call-ID: 5f0c1e9a@10.1.1.20
      CSeq: 1 ACK
      Content-Length: {auto}
  - from: sbc
    to: gw
    label: ACK
    caption: The SBC acknowledges the carrier's 200 OK.
    message: |
      ACK sip:gw@198.51.100.50:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.1:5060;branch=z9hG4bKsb2081
      Max-Forwards: 70
      From: "Alice" <sip:+14045550101@corp.example;user=phone>;tag=sb20d4
      To: <sip:+14045550199@sip.carrier.example;user=phone>;tag=gw41a
      Call-ID: b8e21d07a4f3c5
      CSeq: 1 ACK
      Content-Length: {auto}
  - kind: media
    from: pbx
    to: gw
    proto: rtp
    label: RTP
    caption: The PBX's RTP reaches the carrier through the company's NAT.
    oneway: true
  - kind: media
    from: gw
    to: pbx
    proto: rtp
    label: RTP
    caption: The carrier sends its RTP to 10.1.1.20, a private address. It never arrives.
    oneway: true
    lost: true
    warn: "One-way audio: Bob hears Alice, but Alice hears nothing."
