id: ice-direct
title: "ICE opens a direct path through two NATs"
summary: "Both NAT routers keep one mapping for each port. Each side's check opens its own NAT for the other, and the media flows directly."
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.168.1.20 }
  - { id: natA, label: NAT A, kind: nat, sub: 198.51.100.7 }
  - { id: turn, label: STUN server, kind: server, sub: 203.0.113.50 }
  - { id: natB, label: NAT B, kind: nat, sub: 198.51.100.200 }
  - { id: bob, label: Bob, kind: ua, sub: 10.0.0.30 }
steps:
  - kind: media
    from: alice
    to: turn
    proto: dns
    label: "STUN Binding"
    caption: "Alice learns her server-reflexive address, 198.51.100.7:40112."
    detail: |
      Binding request   192.168.1.20:49170 → 203.0.113.50:3478
        after the NAT router: 198.51.100.7:40112 → 203.0.113.50:3478

      Binding success response
        XOR-MAPPED-ADDRESS  0020 0008 0001 bda2 e721 c045
        = 198.51.100.7:40112  (the address the server saw)

  - kind: media
    from: bob
    to: turn
    proto: dns
    label: "STUN Binding"
    caption: "Bob learns his: 198.51.100.200:52010."
    detail: |
      Binding request   10.0.0.30:3456 → 203.0.113.50:3478
        after the NAT router: 198.51.100.200:52010 → 203.0.113.50:3478

      Binding success response
        XOR-MAPPED-ADDRESS  0020 0008 0001 ea38 e721 c08a
        = 198.51.100.200:52010  (the address the server saw)

  - from: alice
    to: bob
    label: "INVITE (offer)"
    caption: "Alice offers her host and server-reflexive candidates."
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.168.1.20:5060;rport;branch=z9hG4bKid20a1
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=id20a
      To: Bob <sip:bob@biloxi.example>
      Call-ID: id20@192.168.1.20
      CSeq: 1 INVITE
      Contact: <sip:alice@192.168.1.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 198.51.100.7
      s=-
      c=IN IP4 198.51.100.7
      t=0 0
      m=audio 40112 RTP/AVP 0 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16
      a=ice-ufrag:aL3x
      a=ice-pwd:asd88fgpdd777uzjYhagZg
      a=rtcp-mux
      a=candidate:1 1 UDP 2130706431 192.168.1.20 49170 typ host
      a=candidate:2 1 UDP 1694498815 198.51.100.7 40112 typ srflx raddr 192.168.1.20 rport 49170

  - from: bob
    to: alice
    label: "200 OK (answer)"
    caption: "Bob answers with his. The highest pair, host to host, fails: both addresses are private."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.168.1.20:5060;rport=40114;received=198.51.100.7;branch=z9hG4bKid20a1
      From: Alice <sip:alice@atlanta.example>;tag=id20a
      To: Bob <sip:bob@biloxi.example>;tag=id20b
      Call-ID: id20@192.168.1.20
      CSeq: 1 INVITE
      Contact: <sip:bob@10.0.0.30:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 198.51.100.200
      s=-
      c=IN IP4 198.51.100.200
      t=0 0
      m=audio 52010 RTP/AVP 0 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16
      a=ice-ufrag:bR9q
      a=ice-pwd:xq2vB7lmd0Ku31rQ8zNfTc
      a=rtcp-mux
      a=candidate:1 1 UDP 2130706431 10.0.0.30 3456 typ host
      a=candidate:2 1 UDP 1694498815 198.51.100.200 52010 typ srflx raddr 10.0.0.30 rport 3456

  - from: alice
    to: bob
    label: "ACK"
    caption: "The call is up. The connectivity checks start."
    message: |
      ACK sip:bob@10.0.0.30:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.168.1.20:5060;rport;branch=z9hG4bKid20a2
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=id20a
      To: Bob <sip:bob@biloxi.example>;tag=id20b
      Call-ID: id20@192.168.1.20
      CSeq: 1 ACK
      Content-Length: 0

  - kind: media
    from: alice
    to: natB
    proto: dns
    label: "ICE check to 52010"
    caption: "NAT B drops Alice's check. But NAT A now lets packets in from 198.51.100.200:52010."
    lost: true
    oneway: true
    detail: |
      STUN Binding request  192.168.1.20:49170 → 198.51.100.200:52010
        after NAT A: 198.51.100.7:40112 (the same mapping)
        NAT B: filtered — Bob has not sent to 198.51.100.7:40112 yet

  - kind: media
    from: bob
    to: alice
    proto: dns
    label: "ICE check to 40112"
    caption: "Bob checks Alice's server-reflexive address. NAT A lets it in, and Alice answers."
    rfc: rfc8445-2.2-checks
    detail: |
      STUN Binding request  10.0.0.30:3456 → 198.51.100.7:40112
        after NAT B: 198.51.100.200:52010
        NAT A: allowed → 192.168.1.20:49170
      Binding success response, the same way back

  - kind: media
    from: alice
    to: bob
    proto: dns
    label: "ICE check to 52010"
    caption: "Alice sends a triggered check. NAT B now lets it in: Bob has sent to 198.51.100.7:40112."
    detail: |
      STUN Binding request (triggered)  192.168.1.20:49170 → 198.51.100.200:52010
        NAT B: allowed → 10.0.0.30:3456

  - kind: media
    from: alice
    to: bob
    label: "RTP direct"
    caption: "The pair works both ways. Media flows directly, with no relay."
    detail: |
      192.168.1.20:49170 ⇄ 198.51.100.7:40112 ⇄ 198.51.100.200:52010 ⇄ 10.0.0.30:3456
