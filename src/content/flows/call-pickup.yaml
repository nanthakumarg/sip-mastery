id: call-pickup
title: "Call pickup: Carol answers Bob's ringing phone"
summary: Based on RFC 5359 §2.16. Carol sends Alice an INVITE with Replaces and early-only. Alice's phone answers it and cancels the call to Bob.
lanes:
  - id: alice
    label: Alice
    kind: ua
    sub: 192.0.2.10
  - id: bob
    label: Bob
    kind: ua
    sub: 203.0.113.20
  - id: carol
    label: Carol
    kind: ua
    sub: 198.51.100.30
steps:
  - from: alice
    to: bob
    label: INVITE
    caption: Alice calls Bob.
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
  - from: bob
    to: alice
    label: 180 Ringing
    caption: Bob's phone rings, but Bob is away. The 180 makes an early dialog with Alice.
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Length: {auto}
  - from: carol
    to: alice
    label: INVITE (Replaces)
    caption: Carol presses Pickup. Her phone calls Alice's Contact, with Replaces naming Alice's early dialog with Bob.
    message: |
      INVITE sip:alice@192.0.2.10:5060 SIP/2.0
      Via: SIP/2.0/UDP 198.51.100.30:5060;branch=z9hG4bKc0211b
      Max-Forwards: 70
      From: Carol <sip:carol@chicago.example>;tag=d9f33c1
      To: Alice <sip:alice@atlanta.example>
      Call-ID: 91be44a07c@198.51.100.30
      CSeq: 1 INVITE
      Contact: <sip:carol@198.51.100.30:5060>
      Replaces: 3848276298220188511@192.0.2.10;to-tag=9fxced76sl;from-tag=314159;early-only
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=carol 3302218841 3302218841 IN IP4 198.51.100.30
      s=-
      c=IN IP4 198.51.100.30
      t=0 0
      m=audio 5004 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
    rfc: rfc5359-2.16-pickup
  - from: alice
    to: carol
    label: 200 OK
    caption: Alice's phone sent that INVITE to Bob, so it may replace the early dialog. It answers Carol at once.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 198.51.100.30:5060;branch=z9hG4bKc0211b
      From: Carol <sip:carol@chicago.example>;tag=d9f33c1
      To: Alice <sip:alice@atlanta.example>;tag=e3a1d07
      Call-ID: 91be44a07c@198.51.100.30
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
    rfc: rfc3891-3-early
  - from: carol
    to: alice
    label: ACK
    caption: Carol's phone confirms the 200 OK.
    message: |
      ACK sip:alice@192.0.2.10:5060 SIP/2.0
      Via: SIP/2.0/UDP 198.51.100.30:5060;branch=z9hG4bKc023ee
      Max-Forwards: 70
      From: Carol <sip:carol@chicago.example>;tag=d9f33c1
      To: Alice <sip:alice@atlanta.example>;tag=e3a1d07
      Call-ID: 91be44a07c@198.51.100.30
      CSeq: 1 ACK
      Content-Length: {auto}
  - from: alice
    to: bob
    label: CANCEL
    caption: Alice's phone ends the replaced early dialog with a CANCEL, so Bob's phone stops ringing.
    message: |
      CANCEL sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 CANCEL
      Content-Length: {auto}
  - from: bob
    to: alice
    label: 200 OK (CANCEL)
    caption: Bob's phone answers the CANCEL.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 CANCEL
      Content-Length: {auto}
  - from: bob
    to: alice
    label: 487 Request Terminated
    caption: Bob's phone ends the INVITE with 487.
    message: |
      SIP/2.0 487 Request Terminated
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Content-Length: {auto}
  - from: alice
    to: bob
    label: ACK
    caption: Alice's phone confirms the 487.
    message: |
      ACK sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}
  - kind: media
    from: alice
    to: carol
    proto: rtp
    label: RTP audio (PCMU)
    caption: Alice talks to Carol. She called Bob, and Carol answered for him.
