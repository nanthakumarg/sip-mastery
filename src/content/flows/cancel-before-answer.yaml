id: cancel-before-answer
title: Alice hangs up while Bob's phone rings
summary: Alice cancels the INVITE before Bob answers. Each stateful hop answers the CANCEL itself, and the INVITE ends with 487 Request Terminated.
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: proxyB, label: Proxy B, kind: proxy, sub: 203.0.113.10 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: proxyB
    label: INVITE
    caption: Alice's phone calls Bob through Proxy B.
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000

  - from: proxyB
    to: alice
    label: 100 Trying
    caption: Proxy B answers 100 Trying. It keeps state for the INVITE transaction.
    message: |
      SIP/2.0 100 Trying
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Content-Length: {auto}

  - from: proxyB
    to: bob
    label: INVITE
    caption: Proxy B forwards the INVITE to Bob's phone.
    message: |
      INVITE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKpb721e
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      Max-Forwards: 69
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000

  - from: bob
    to: proxyB
    label: 180 Ringing
    caption: Bob's phone rings.
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKpb721e
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Length: {auto}

  - from: proxyB
    to: alice
    label: 180 Ringing
    caption: Alice hears the ringback tone.
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Length: {auto}

  - from: alice
    to: proxyB
    label: CANCEL
    caption: Alice hangs up before Bob answers. The CANCEL copies the Request-URI, Call-ID, From, To, and branch of the INVITE.
    rfc: rfc3261-9.1-wait-provisional
    message: |
      CANCEL sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 CANCEL
      Content-Length: {auto}

  - from: proxyB
    to: alice
    label: 200 OK (CANCEL)
    caption: Proxy B answers the CANCEL itself. CANCEL is hop-by-hop.
    rfc: rfc3261-9-hop-by-hop
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 CANCEL
      Content-Length: {auto}

  - from: proxyB
    to: bob
    label: CANCEL
    caption: Proxy B sends its own CANCEL on its own hop, with the branch of its own INVITE.
    message: |
      CANCEL sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKpb721e
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 CANCEL
      Content-Length: {auto}

  - from: bob
    to: proxyB
    label: 200 OK (CANCEL)
    caption: Bob's phone stops ringing and answers the CANCEL.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKpb721e
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 CANCEL
      Content-Length: {auto}

  - from: bob
    to: proxyB
    label: 487 Request Terminated
    caption: Bob's phone ends the INVITE transaction with 487.
    rfc: rfc3261-9.2-487
    message: |
      SIP/2.0 487 Request Terminated
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKpb721e
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Content-Length: {auto}

  - from: proxyB
    to: bob
    label: ACK
    caption: Proxy B confirms the 487 on its hop. This ACK reuses the branch of the INVITE.
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKpb721e
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}

  - from: proxyB
    to: alice
    label: 487 Request Terminated
    caption: Proxy B forwards the 487 to Alice's phone.
    message: |
      SIP/2.0 487 Request Terminated
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Content-Length: {auto}

  - from: alice
    to: proxyB
    label: ACK
    caption: Alice's phone confirms the 487. The call never started.
    message: |
      ACK sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}
