id: voicemail-no-diversion
title: Forwarded to voicemail, with no history
summary: Alice does not answer. The PBX forwards the call to voicemail, but the INVITE says nothing about Alice, so the voicemail server asks for a mailbox number.
lanes:
  - id: sbc
    label: Carrier SBC
    kind: sbc
    sub: 198.51.100.50
  - id: pbx
    label: PBX
    kind: b2bua
    sub: 192.0.2.20
  - id: alice
    label: Alice
    kind: ua
    sub: 192.0.2.10
  - id: vm
    label: Voicemail server
    kind: server
    sub: 192.0.2.40
steps:
  - from: sbc
    to: pbx
    label: INVITE
    caption: Carol calls Alice's direct number from the PSTN. The carrier sends the call down the trunk.
    message: |
      INVITE sip:+14045550101@192.0.2.20:5060;user=phone SIP/2.0
      Via: SIP/2.0/UDP 198.51.100.50:5060;branch=z9hG4bKsb1dae
      Max-Forwards: 70
      From: "Carol" <sip:+12025550123@sip.carrier.example;user=phone>;tag=sb22c1
      To: <sip:+14045550101@sip.carrier.example;user=phone>
      Call-ID: in-5b21@198.51.100.50
      CSeq: 1 INVITE
      Contact: <sip:sbc@198.51.100.50:5060>
      P-Asserted-Identity: <sip:+12025550123@sip.carrier.example;user=phone>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=sbc 4001 4001 IN IP4 198.51.100.50
      s=-
      c=IN IP4 198.51.100.50
      t=0 0
      m=audio 31000 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
  - from: pbx
    to: sbc
    label: 100 Trying
    caption: "The PBX looks up the extension for this DID: Alice."
    message: |
      SIP/2.0 100 Trying
      Via: SIP/2.0/UDP 198.51.100.50:5060;branch=z9hG4bKsb1dae
      From: "Carol" <sip:+12025550123@sip.carrier.example;user=phone>;tag=sb22c1
      To: <sip:+14045550101@sip.carrier.example;user=phone>
      Call-ID: in-5b21@198.51.100.50
      CSeq: 1 INVITE
      Content-Length: {auto}
  - from: pbx
    to: alice
    label: INVITE
    caption: The PBX calls Alice's desk phone on its own dialog.
    message: |
      INVITE sip:alice@192.0.2.10:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.20:5060;branch=z9hG4bKpx227f
      Max-Forwards: 70
      From: "Carol" <sip:+12025550123@sip.carrier.example;user=phone>;tag=px61e0
      To: <sip:alice@pbx.atlanta.example>
      Call-ID: ext-0c4e@192.0.2.20
      CSeq: 1 INVITE
      Contact: <sip:pbx@192.0.2.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=pbx 5001 5001 IN IP4 192.0.2.20
      s=-
      c=IN IP4 192.0.2.20
      t=0 0
      m=audio 22000 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
  - from: alice
    to: pbx
    label: 180 Ringing
    caption: Alice's phone rings, but she is not at her desk.
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 192.0.2.20:5060;branch=z9hG4bKpx227f
      From: "Carol" <sip:+12025550123@sip.carrier.example;user=phone>;tag=px61e0
      To: <sip:alice@pbx.atlanta.example>;tag=al71b
      Call-ID: ext-0c4e@192.0.2.20
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Length: {auto}
  - from: pbx
    to: sbc
    label: 180 Ringing
    caption: The PBX passes the ringing on to Carol.
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 198.51.100.50:5060;branch=z9hG4bKsb1dae
      From: "Carol" <sip:+12025550123@sip.carrier.example;user=phone>;tag=sb22c1
      To: <sip:+14045550101@sip.carrier.example;user=phone>;tag=px93d4
      Call-ID: in-5b21@198.51.100.50
      CSeq: 1 INVITE
      Contact: <sip:pbx@192.0.2.20:5060>
      Content-Length: {auto}
  - from: pbx
    to: alice
    label: CANCEL
    caption: After 20 seconds with no answer, the PBX stops ringing Alice's phone.
    message: |
      CANCEL sip:alice@192.0.2.10:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.20:5060;branch=z9hG4bKpx227f
      Max-Forwards: 70
      From: "Carol" <sip:+12025550123@sip.carrier.example;user=phone>;tag=px61e0
      To: <sip:alice@pbx.atlanta.example>
      Call-ID: ext-0c4e@192.0.2.20
      CSeq: 1 CANCEL
      Content-Length: {auto}
  - from: alice
    to: pbx
    label: 200 OK (CANCEL)
    caption: Alice's phone accepts the CANCEL.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.20:5060;branch=z9hG4bKpx227f
      From: "Carol" <sip:+12025550123@sip.carrier.example;user=phone>;tag=px61e0
      To: <sip:alice@pbx.atlanta.example>;tag=al71b
      Call-ID: ext-0c4e@192.0.2.20
      CSeq: 1 CANCEL
      Content-Length: {auto}
  - from: alice
    to: pbx
    label: 487 Request Terminated
    caption: Alice's phone ends the INVITE transaction.
    message: |
      SIP/2.0 487 Request Terminated
      Via: SIP/2.0/UDP 192.0.2.20:5060;branch=z9hG4bKpx227f
      From: "Carol" <sip:+12025550123@sip.carrier.example;user=phone>;tag=px61e0
      To: <sip:alice@pbx.atlanta.example>;tag=al71b
      Call-ID: ext-0c4e@192.0.2.20
      CSeq: 1 INVITE
      Content-Length: {auto}
  - from: pbx
    to: alice
    label: ACK
    caption: The PBX acknowledges the 487.
    message: |
      ACK sip:alice@192.0.2.10:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.20:5060;branch=z9hG4bKpx227f
      Max-Forwards: 70
      From: "Carol" <sip:+12025550123@sip.carrier.example;user=phone>;tag=px61e0
      To: <sip:alice@pbx.atlanta.example>;tag=al71b
      Call-ID: ext-0c4e@192.0.2.20
      CSeq: 1 ACK
      Content-Length: {auto}
  - from: pbx
    to: vm
    label: INVITE
    caption: The PBX forwards the call to voicemail. The INVITE gives only Carol's number, and nothing about Alice.
    message: |
      INVITE sip:vm@192.0.2.40 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.20:5060;branch=z9hG4bKpx2552
      Max-Forwards: 70
      From: "Carol" <sip:+12025550123@sip.carrier.example;user=phone>;tag=px61e1
      To: <sip:vm@192.0.2.40>
      Call-ID: vm-7a90@192.0.2.20
      CSeq: 1 INVITE
      Contact: <sip:pbx@192.0.2.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=pbx 5002 5002 IN IP4 192.0.2.20
      s=-
      c=IN IP4 192.0.2.20
      t=0 0
      m=audio 22002 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
    warn: The voicemail server cannot tell whose mailbox this call is for.
  - from: vm
    to: pbx
    label: 200 OK
    caption: The voicemail server answers. It does not know which mailbox to open.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.20:5060;branch=z9hG4bKpx2552
      From: "Carol" <sip:+12025550123@sip.carrier.example;user=phone>;tag=px61e1
      To: <sip:vm@192.0.2.40>;tag=vm3c8
      Call-ID: vm-7a90@192.0.2.20
      CSeq: 1 INVITE
      Contact: <sip:vm@192.0.2.40:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=vm 6001 6001 IN IP4 192.0.2.40
      s=-
      c=IN IP4 192.0.2.40
      t=0 0
      m=audio 18000 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
  - from: pbx
    to: vm
    label: ACK
    caption: The PBX acknowledges the 200 OK.
    message: |
      ACK sip:vm@192.0.2.40:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.20:5060;branch=z9hG4bKpx2825
      Max-Forwards: 70
      From: "Carol" <sip:+12025550123@sip.carrier.example;user=phone>;tag=px61e1
      To: <sip:vm@192.0.2.40>;tag=vm3c8
      Call-ID: vm-7a90@192.0.2.20
      CSeq: 1 ACK
      Content-Length: {auto}
  - from: pbx
    to: sbc
    label: 200 OK
    caption: The PBX answers Carol's call, with its own SDP.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 198.51.100.50:5060;branch=z9hG4bKsb1dae
      From: "Carol" <sip:+12025550123@sip.carrier.example;user=phone>;tag=sb22c1
      To: <sip:+14045550101@sip.carrier.example;user=phone>;tag=px93d4
      Call-ID: in-5b21@198.51.100.50
      CSeq: 1 INVITE
      Contact: <sip:pbx@192.0.2.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=pbx 5003 5003 IN IP4 192.0.2.20
      s=-
      c=IN IP4 192.0.2.20
      t=0 0
      m=audio 22004 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
  - from: sbc
    to: pbx
    label: ACK
    caption: The carrier acknowledges the 200 OK.
    message: |
      ACK sip:pbx@192.0.2.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 198.51.100.50:5060;branch=z9hG4bKsb2081
      Max-Forwards: 70
      From: "Carol" <sip:+12025550123@sip.carrier.example;user=phone>;tag=sb22c1
      To: <sip:+14045550101@sip.carrier.example;user=phone>;tag=px93d4
      Call-ID: in-5b21@198.51.100.50
      CSeq: 1 ACK
      Content-Length: {auto}
  - kind: media
    from: vm
    to: sbc
    proto: rtp
    label: RTP (main menu)
    caption: Carol hears "Please enter the mailbox number". She does not know it, and hangs up.
    oneway: true
    warn: Carol leaves no message, and Alice never learns that she called.
