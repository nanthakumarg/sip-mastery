id: outbound-proxy
title: "Outbound proxy and pre-loaded Route"
summary: "Alice's phone sends every new request to Proxy A, with a pre-loaded Route. Proxy A does not record-route, so the ACK skips it."
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: proxyA, label: Proxy A, kind: proxy, sub: proxy.atlanta.example }
  - { id: proxyB, label: Proxy B, kind: proxy, sub: proxy.biloxi.example }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: proxyA
    label: "INVITE"
    caption: "Alice's phone has one pre-loaded Route: its outbound proxy. The Request-URI stays Bob's AOR."
    rfc: rfc3261-8.1.1.1-outbound
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKob1
      Max-Forwards: 70
      Route: <sip:proxy.atlanta.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=c19a3f
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 41c8e2d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: proxyA
    to: proxyB
    label: "INVITE"
    caption: "Proxy A removes its own Route entry. No Route is left, so it routes on the Request-URI: biloxi.example."
    rfc: rfc3261-16.4-route-pop
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 198.51.100.10:5060;branch=z9hG4bKob1a
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKob1
      Max-Forwards: 69
      From: Alice <sip:alice@atlanta.example>;tag=c19a3f
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 41c8e2d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: proxyB
    to: bob
    label: "INVITE"
    caption: "Proxy B adds Record-Route and replaces the Request-URI with Bob's Contact."
    message: |
      INVITE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKob1b
      Via: SIP/2.0/UDP 198.51.100.10:5060;branch=z9hG4bKob1a
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKob1
      Max-Forwards: 68
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=c19a3f
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 41c8e2d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: bob
    to: proxyB
    label: "200 OK"
    caption: "Bob answers. The Record-Route names only Proxy B."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKob1b
      Via: SIP/2.0/UDP 198.51.100.10:5060;branch=z9hG4bKob1a
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKob1
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=c19a3f
      To: Bob <sip:bob@biloxi.example>;tag=77d0e4
      Call-ID: 41c8e2d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: proxyB
    to: proxyA
    label: "200 OK"
    caption: "Proxy B removes its Via and sends the 200 OK to Proxy A."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 198.51.100.10:5060;branch=z9hG4bKob1a
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKob1
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=c19a3f
      To: Bob <sip:bob@biloxi.example>;tag=77d0e4
      Call-ID: 41c8e2d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: proxyA
    to: alice
    label: "200 OK"
    caption: "Responses follow Via, so Proxy A still sees the 200 OK. Alice's route set is Proxy B only."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKob1
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=c19a3f
      To: Bob <sip:bob@biloxi.example>;tag=77d0e4
      Call-ID: 41c8e2d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: alice
    to: proxyB
    label: "ACK"
    caption: "Alice sends the ACK to the first Route, Proxy B, not to her outbound proxy."
    rfc: rfc3261-8.1.2-first-route
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKob2
      Max-Forwards: 70
      Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=c19a3f
      To: Bob <sip:bob@biloxi.example>;tag=77d0e4
      Call-ID: 41c8e2d0@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}

  - from: proxyB
    to: bob
    label: "ACK"
    caption: "Proxy B removes its Route entry and forwards the ACK to Bob."
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKob2b
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKob2
      Max-Forwards: 69
      From: Alice <sip:alice@atlanta.example>;tag=c19a3f
      To: Bob <sip:bob@biloxi.example>;tag=77d0e4
      Call-ID: 41c8e2d0@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}
