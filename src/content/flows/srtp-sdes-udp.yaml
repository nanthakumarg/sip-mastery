id: srtp-sdes-udp
title: "Broken: SDES keys over UDP"
summary: "The SRTP keys travel in a=crypto, in SIP over UDP. Anyone on the path reads them, and can decrypt the call."
broken: true
breaks: [sdes-over-tls]
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: bob
    label: "INVITE (RTP/SAVP)"
    caption: "The same offer, with the keys in a=crypto. But this INVITE goes over UDP: every byte is readable on the network."
    rfc: rfc4568-8.3-tls
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKs3d5b8i
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: s3d5b8e0f1@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/SAVP 0 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16
      a=crypto:1 AES_CM_128_HMAC_SHA1_80 inline:WVNfX19zZW1jdGwgKCkgewkyMjA7fQp9CnVubGVz|2^31
      a=crypto:2 AES_CM_128_HMAC_SHA1_32 inline:NzB4d1BINUAvLEw6UzF3WSJ+PSdFcGdUJShpX1Zj|2^31

  - from: bob
    to: alice
    label: "200 OK (RTP/SAVP)"
    caption: "Bob accepts crypto line 1, and sends his own key for the media he sends."
    rfc: rfc4568-7.1.2-one
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKs3d5b8i
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: s3d5b8e0f1@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/SAVP 0 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16
      a=crypto:1 AES_CM_128_HMAC_SHA1_80 inline:PS1uQCVeeCFCanVmcjkpPywjNWhcYD0mXXtxaVBR|2^31

  - from: alice
    to: bob
    label: "ACK"
    caption: "The call is up."
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKs3d5b8ia
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: s3d5b8e0f1@192.0.2.10
      CSeq: 1 ACK
      Content-Length: 0

  - kind: media
    from: alice
    to: bob
    label: "SRTP audio"
    caption: "The media is SRTP, but the keys travelled in plain text. Anyone who captured the INVITE and the 200 OK can decrypt the call."
    warn: "Encrypted media, readable keys: the encryption protects nothing."
    detail: |
      UDP  192.0.2.10:49170 → 203.0.113.20:3456

      RTP header (readable)   V=2  PT=0 (PCMU)  seq=26232  ts=2412530560  SSRC=0x3a5f12c4
      Payload (encrypted)     9f 3c e1 07 5a d2 81 4b c6 ... 160 bytes, AES-CM
      Auth tag                10 bytes, HMAC-SHA1
