id: register-new-address
title: "Without SIP Outbound: a new address adds a binding"
summary: "The mobile app moves from Wi-Fi to 4G and registers again. The Registrar keeps the old, dead binding next to the new one."
registrar: { lane: registrar }
lanes:
  - { id: mobile, label: Mobile, kind: ua, sub: 198.51.100.77 }
  - { id: registrar, label: Registrar, kind: registrar, sub: biloxi.example }
steps:
  - from: mobile
    to: registrar
    at: 0
    label: "REGISTER"
    caption: "Bob's mobile app registers over TCP on Wi-Fi."
    status: { mobile: "Wi-Fi" }
    message: |
      REGISTER sip:biloxi.example SIP/2.0
      Via: SIP/2.0/TCP 198.51.100.77:41270;branch=z9hG4bKr022x7
      Max-Forwards: 70
      From: Bob <sip:bob@biloxi.example>;tag=m0b4x2
      To: Bob <sip:bob@biloxi.example>
      Call-ID: Mb48wn93@198.51.100.77
      CSeq: 1 REGISTER
      Contact: <sip:bob@198.51.100.77:41270;transport=tcp>
      Expires: 600
      Content-Length: 0

  - from: registrar
    to: mobile
    label: "200 OK"
    caption: "One binding, for 600 seconds."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/TCP 198.51.100.77:41270;branch=z9hG4bKr022x7
      From: Bob <sip:bob@biloxi.example>;tag=m0b4x2
      To: Bob <sip:bob@biloxi.example>;tag=rg8823
      Call-ID: Mb48wn93@198.51.100.77
      CSeq: 1 REGISTER
      Date: Sun, 04 Oct 2026 09:00:00 GMT
      Contact: <sip:bob@198.51.100.77:41270;transport=tcp>;expires=600
      Content-Length: 0

  - from: mobile
    to: registrar
    at: 240
    label: "REGISTER"
    caption: "Bob leaves the building. The phone moves to 4G, opens a new connection, and registers its new address."
    status: { mobile: "4G" }
    message: |
      REGISTER sip:biloxi.example SIP/2.0
      Via: SIP/2.0/TCP 198.51.100.200:50122;branch=z9hG4bKr023x7
      Max-Forwards: 70
      From: Bob <sip:bob@biloxi.example>;tag=m0b4x2
      To: Bob <sip:bob@biloxi.example>
      Call-ID: Mb48wn93@198.51.100.77
      CSeq: 2 REGISTER
      Contact: <sip:bob@198.51.100.200:50122;transport=tcp>
      Expires: 600
      Content-Length: 0

  - from: registrar
    to: mobile
    label: "200 OK"
    caption: "A different Contact is a new binding. The dead Wi-Fi binding stays for 360 more seconds."
    warn: "Calls fork to the dead Wi-Fi Contact too."
    rfc: rfc3261-10.2.1-complete-list
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/TCP 198.51.100.200:50122;branch=z9hG4bKr023x7
      From: Bob <sip:bob@biloxi.example>;tag=m0b4x2
      To: Bob <sip:bob@biloxi.example>;tag=rg8824
      Call-ID: Mb48wn93@198.51.100.77
      CSeq: 2 REGISTER
      Date: Sun, 04 Oct 2026 09:04:00 GMT
      Contact: <sip:bob@198.51.100.77:41270;transport=tcp>;expires=360
      Contact: <sip:bob@198.51.100.200:50122;transport=tcp>;expires=600
      Content-Length: 0
