id: b2bua-call
title: A B2BUA makes two calls out of one
summary: The B2BUA answers Alice's INVITE as a UAS, then starts a new INVITE to Bob as a UAC. The two legs have different Call-IDs, tags, and CSeq numbers.
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: b2bua, label: B2BUA, kind: b2bua, sub: 203.0.113.50 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: b2bua
    label: INVITE
    caption: Alice's phone sends the INVITE to the B2BUA, for example a PBX.
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000

  - from: b2bua
    to: alice
    label: 100 Trying
    caption: The B2BUA acts as a UAS for Alice's phone. This is leg 1.
    message: |
      SIP/2.0 100 Trying
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Content-Length: {auto}

  - from: b2bua
    to: bob
    label: INVITE (leg 2)
    caption: The B2BUA acts as a UAC and starts a new call. Call-ID, From tag, CSeq, Via, and Contact are all new.
    rfc: rfc7092-3.1.2-signaling-only
    message: |
      INVITE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.50:5060;branch=z9hG4bK-b2b-77a1
      Max-Forwards: 69
      From: Alice <sip:alice@atlanta.example>;tag=as58f4201b
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 6c1e2a9b4f7d@203.0.113.50
      CSeq: 102 INVITE
      Contact: <sip:b2bua@203.0.113.50:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000

  - from: bob
    to: b2bua
    label: 180 Ringing
    caption: Bob's phone rings. It answers on leg 2 only and never sees leg 1.
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 203.0.113.50:5060;branch=z9hG4bK-b2b-77a1
      From: Alice <sip:alice@atlanta.example>;tag=as58f4201b
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 6c1e2a9b4f7d@203.0.113.50
      CSeq: 102 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Length: {auto}

  - from: b2bua
    to: alice
    label: 180 Ringing
    caption: The B2BUA sends its own 180 on leg 1. It uses its own To tag and Contact.
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=8c1f0e
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:b2bua@203.0.113.50:5060>
      Content-Length: {auto}

  - from: bob
    to: b2bua
    label: 200 OK
    caption: Bob answers on leg 2.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.50:5060;branch=z9hG4bK-b2b-77a1
      From: Alice <sip:alice@atlanta.example>;tag=as58f4201b
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 6c1e2a9b4f7d@203.0.113.50
      CSeq: 102 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: b2bua
    to: alice
    label: 200 OK
    caption: The B2BUA answers leg 1. It copies Bob's SDP into its own 200 OK.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=8c1f0e
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:b2bua@203.0.113.50:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: alice
    to: b2bua
    label: ACK
    caption: Alice's phone sends the ACK to the B2BUA's Contact. Alice's phone does not know Bob's address.
    message: |
      ACK sip:b2bua@203.0.113.50:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b76
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=8c1f0e
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}

  - from: b2bua
    to: bob
    label: ACK
    caption: The B2BUA sends its own ACK on leg 2. Now there are two dialogs, one on each side.
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.50:5060;branch=z9hG4bK-b2b-77a2
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=as58f4201b
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 6c1e2a9b4f7d@203.0.113.50
      CSeq: 102 ACK
      Content-Length: {auto}
