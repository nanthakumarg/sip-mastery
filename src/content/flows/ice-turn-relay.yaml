id: ice-turn-relay
title: "Fixed: ICE finds a path through the TURN server"
summary: "Both phones gather host, server-reflexive, and relayed candidates. ICE checks the pairs, and the media flows through Bob's relayed address."
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.168.1.20 }
  - { id: natA, label: NAT A, kind: nat, sub: 198.51.100.7 }
  - { id: turn, label: TURN server, kind: server, sub: 203.0.113.50 }
  - { id: natB, label: NAT B, kind: nat, sub: 198.51.100.200 }
  - { id: bob, label: Bob, kind: ua, sub: 10.0.0.30 }
steps:
  - kind: media
    from: alice
    to: turn
    proto: dns
    label: "TURN Allocate"
    caption: "Alice asks the TURN server for a relayed address: 203.0.113.50:50000. The response also gives her STUN address."
    rfc: rfc8656-1-relay
    detail: |
      Allocate request   192.168.1.20:49170 → 203.0.113.50:3478
        after NAT A: 198.51.100.7:40112

      Allocate success response
        XOR-RELAYED-ADDRESS  203.0.113.50:50000
        XOR-MAPPED-ADDRESS   198.51.100.7:40112

  - kind: media
    from: bob
    to: turn
    proto: dns
    label: "TURN Allocate"
    caption: "Bob gets 203.0.113.50:50002 and his STUN address, 198.51.100.200:52010."
    detail: |
      Allocate request   10.0.0.30:3456 → 203.0.113.50:3478
        after NAT B: 198.51.100.200:52010

      Allocate success response
        XOR-RELAYED-ADDRESS  203.0.113.50:50002
        XOR-MAPPED-ADDRESS   198.51.100.200:52010

  - from: alice
    to: bob
    label: "INVITE (offer)"
    caption: "Alice offers three candidates: host, server-reflexive, and relayed. The relayed one is also in c= and m=."
    rfc: rfc8445-2-candidates
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.168.1.20:5060;rport;branch=z9hG4bKit20a1
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=it20a
      To: Bob <sip:bob@biloxi.example>
      Call-ID: it20@192.168.1.20
      CSeq: 1 INVITE
      Contact: <sip:alice@192.168.1.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 203.0.113.50
      s=-
      c=IN IP4 203.0.113.50
      t=0 0
      m=audio 50000 RTP/AVP 0 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16
      a=ice-ufrag:aL3x
      a=ice-pwd:asd88fgpdd777uzjYhagZg
      a=rtcp-mux
      a=candidate:1 1 UDP 2130706431 192.168.1.20 49170 typ host
      a=candidate:2 1 UDP 1694498815 198.51.100.7 40112 typ srflx raddr 192.168.1.20 rport 49170
      a=candidate:3 1 UDP 16777215 203.0.113.50 50000 typ relay raddr 198.51.100.7 rport 40112

  - from: bob
    to: alice
    label: "200 OK (answer)"
    caption: "Bob answers with his three candidates. Each side now pairs its candidates with the other's."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.168.1.20:5060;rport=40114;received=198.51.100.7;branch=z9hG4bKit20a1
      From: Alice <sip:alice@atlanta.example>;tag=it20a
      To: Bob <sip:bob@biloxi.example>;tag=it20b
      Call-ID: it20@192.168.1.20
      CSeq: 1 INVITE
      Contact: <sip:bob@10.0.0.30:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.50
      s=-
      c=IN IP4 203.0.113.50
      t=0 0
      m=audio 50002 RTP/AVP 0 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16
      a=ice-ufrag:bR9q
      a=ice-pwd:xq2vB7lmd0Ku31rQ8zNfTc
      a=rtcp-mux
      a=candidate:1 1 UDP 2130706431 10.0.0.30 3456 typ host
      a=candidate:2 1 UDP 1694498815 198.51.100.200 52010 typ srflx raddr 10.0.0.30 rport 3456
      a=candidate:3 1 UDP 16777215 203.0.113.50 50002 typ relay raddr 198.51.100.200 rport 52010

  - from: alice
    to: bob
    label: "ACK"
    caption: "The call is up. The connectivity checks start."
    message: |
      ACK sip:bob@10.0.0.30:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.168.1.20:5060;rport;branch=z9hG4bKit20a2
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=it20a
      To: Bob <sip:bob@biloxi.example>;tag=it20b
      Call-ID: it20@192.168.1.20
      CSeq: 1 ACK
      Content-Length: 0

  - kind: media
    from: alice
    to: natB
    proto: dns
    label: "ICE check to 52010"
    caption: "Alice checks Bob's server-reflexive address. NAT B drops it: Bob never sent to Alice's new mapping."
    lost: true
    oneway: true
    detail: |
      STUN Binding request  192.168.1.20:49170 → 198.51.100.200:52010
        after NAT A: 198.51.100.7:40116 (a new mapping)
        NAT B: filtered

  - kind: media
    from: bob
    to: natA
    proto: dns
    label: "ICE check to 40112"
    caption: "Bob checks Alice's server-reflexive address. NAT A drops it: mapping 40112 is for the TURN server only."
    lost: true
    oneway: true
    detail: |
      STUN Binding request  10.0.0.30:3456 → 198.51.100.7:40112
        NAT A: filtered

  - kind: media
    from: alice
    to: bob
    proto: dns
    label: "ICE check to 50002"
    caption: "Alice checks Bob's relayed address. The TURN server relays it to Bob, and the response returns."
    rfc: rfc8445-2.2-checks
    detail: |
      STUN Binding request  192.168.1.20:49170 → 203.0.113.50:50002
        after NAT A: 198.51.100.7:40118
        TURN server → Bob (Data indication, through NAT B)
      Binding success response, the same way back

  - kind: media
    from: alice
    to: bob
    label: "RTP via the TURN server"
    caption: "Alice nominates the pair, and the media flows: Alice's host address to Bob's relayed address."
    detail: |
      Alice  192.168.1.20:49170 → 203.0.113.50:50002 → Bob 10.0.0.30:3456
      Bob    10.0.0.30:3456 → TURN server → 198.51.100.7:40118 → Alice
