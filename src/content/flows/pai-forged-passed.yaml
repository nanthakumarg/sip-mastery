id: pai-forged-passed
title: "Broken: Proxy A passes on a forged PAI"
summary: "An attacker writes P-Asserted-Identity with a bank's number. Proxy A passes it on, and Alice's phone shows it as verified."
broken: true
breaks: [pai-trust]
trust: [proxyA, alice]
lanes:
  - { id: attacker, label: Attacker, kind: ua, sub: 198.51.100.66 }
  - { id: proxyA, label: Proxy A, kind: proxy, sub: proxy.atlanta.example }
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
steps:
  - from: attacker
    to: proxyA
    label: "INVITE"
    caption: "The attacker calls Alice. It writes its own P-Asserted-Identity: the number of Alice's bank."
    rfc: rfc3325-1-forgery
    message: |
      INVITE sip:alice@atlanta.example SIP/2.0
      Via: SIP/2.0/UDP 198.51.100.66:5060;branch=z9hG4bKpa1f00
      Max-Forwards: 70
      From: "First Bank" <sip:service@bank.example>;tag=b4nk11
      To: <sip:alice@atlanta.example>
      Call-ID: f0rg3d77c1@198.51.100.66
      CSeq: 1 INVITE
      Contact: <sip:service@198.51.100.66:5060>
      P-Asserted-Identity: "First Bank" <tel:+14045550100>
      Content-Length: 0

  - from: proxyA
    to: alice
    label: "INVITE"
    caption: "Proxy A forwards the INVITE with the forged PAI. Alice's phone trusts Proxy A, so it trusts the PAI."
    warn: "Proxy A passes on a PAI from outside the trust domain."
    rfc: rfc3325-8-uas
    message: |
      INVITE sip:alice@192.0.2.10:5060 SIP/2.0
      Via: SIP/2.0/UDP proxy.atlanta.example:5060;branch=z9hG4bKpa2f00
      Via: SIP/2.0/UDP 198.51.100.66:5060;branch=z9hG4bKpa1f00
      Max-Forwards: 69
      From: "First Bank" <sip:service@bank.example>;tag=b4nk11
      To: <sip:alice@atlanta.example>
      Call-ID: f0rg3d77c1@198.51.100.66
      CSeq: 1 INVITE
      Contact: <sip:service@198.51.100.66:5060>
      P-Asserted-Identity: "First Bank" <tel:+14045550100>
      Content-Length: 0

  - from: alice
    to: proxyA
    label: "180 Ringing"
    caption: "Alice's phone rings and shows the bank's number as a network-verified caller."
    status: { alice: "Shows bank" }
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP proxy.atlanta.example:5060;branch=z9hG4bKpa2f00
      Via: SIP/2.0/UDP 198.51.100.66:5060;branch=z9hG4bKpa1f00
      From: "First Bank" <sip:service@bank.example>;tag=b4nk11
      To: <sip:alice@atlanta.example>;tag=al1c3r
      Call-ID: f0rg3d77c1@198.51.100.66
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Length: 0

  - from: proxyA
    to: attacker
    label: "180 Ringing"
    caption: "Proxy A removes its Via and forwards the 180."
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 198.51.100.66:5060;branch=z9hG4bKpa1f00
      From: "First Bank" <sip:service@bank.example>;tag=b4nk11
      To: <sip:alice@atlanta.example>;tag=al1c3r
      Call-ID: f0rg3d77c1@198.51.100.66
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Length: 0
