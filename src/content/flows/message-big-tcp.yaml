id: message-big-tcp
title: "Fixed: a large MESSAGE over TCP"
summary: The same long message over TCP, which carries it in a stream, with no IP fragments.
lanes:
  - id: alice
    label: Alice
    kind: ua
    sub: 192.0.2.10
  - id: proxyB
    label: Proxy B
    kind: proxy
    sub: 203.0.113.10
  - id: bob
    label: Bob
    kind: ua
    sub: 203.0.113.20
steps:
  - from: alice
    to: proxyB
    label: MESSAGE
    caption: Alice pastes her meeting notes into a message. Her phone sends it over TCP.
    message: |
      MESSAGE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/TCP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      Max-Forwards: 70
