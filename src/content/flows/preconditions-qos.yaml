id: preconditions-qos
title: "Preconditions: ring only when the network is ready"
summary: Based on RFC 3312 §13.1. Bob's phone does not ring until both sides report their network resources as reserved.
lanes:
  - id: alice
    label: Alice
    kind: ua
    sub: 192.0.2.10
  - id: bob
    label: Bob
    kind: ua
    sub: 203.0.113.20
steps:
  - from: alice
    to: bob
    label: INVITE (offer)
    caption: "Alice calls Bob. The offer says: no resources reserved yet, and they are mandatory in both directions."
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Require: precondition
      Supported: 100rel
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
      a=curr:qos e2e none
      a=des:qos mandatory e2e sendrecv
    rfc: rfc3312-1-precondition
  - from: bob
    to: alice
    label: 183 Session Progress (answer)
    caption: Bob's phone answers in a reliable 183, but does not ring yet. a=conf asks Alice to say when her side is ready.
    message: |
      SIP/2.0 183 Session Progress
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Require: 100rel
      RSeq: 1
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
      a=curr:qos e2e none
      a=des:qos mandatory e2e sendrecv
      a=conf:qos e2e recv
  - from: alice
    to: bob
    label: PRACK
    caption: Alice's phone acknowledges the 183.
    message: |
      PRACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b2048
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 2 PRACK
      RAck: 1 1 INVITE
      Content-Length: {auto}
  - from: bob
    to: alice
    label: 200 OK (PRACK)
    caption: Bob's phone confirms the PRACK. Both sides now reserve network resources, for example with RSVP.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b2048
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 2 PRACK
      Content-Length: {auto}
  - from: alice
    to: bob
    label: UPDATE (offer)
    caption: "Alice's side has its resources. An UPDATE in the early dialog tells Bob: a=curr:qos e2e send."
    message: |
      UPDATE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b231b
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 3 UPDATE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844527 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
      a=curr:qos e2e send
      a=des:qos mandatory e2e sendrecv
    rfc: rfc3311-1-early
  - from: bob
    to: alice
    label: 200 OK (answer)
    caption: Bob's side is ready too, so the answer says e2e sendrecv. The preconditions are met.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b231b
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 3 UPDATE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844565 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
      a=curr:qos e2e sendrecv
      a=des:qos mandatory e2e sendrecv
  - from: bob
    to: alice
    label: 180 Ringing (reliable)
    caption: Only now does Bob's phone ring. The call cannot fail for lack of resources after Bob answers.
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Require: 100rel
      RSeq: 2
      Content-Length: {auto}
    rfc: rfc3312-1-ghost
  - from: alice
    to: bob
    label: PRACK
    caption: Alice's phone acknowledges the 180, with RSeq 2.
    message: |
      PRACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b25ee
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 4 PRACK
      RAck: 2 1 INVITE
      Content-Length: {auto}
  - from: bob
    to: alice
    label: 200 OK (PRACK)
    caption: Bob's phone confirms the PRACK.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b25ee
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 4 PRACK
      Content-Length: {auto}
  - from: bob
    to: alice
    label: 200 OK
    caption: Bob answers. The UPDATE already settled the SDP, so the 200 OK has no body.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Length: {auto}
  - from: alice
    to: bob
    label: ACK
    caption: Alice's phone confirms the 200 OK.
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b28c1
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}
  - kind: media
    from: alice
    to: bob
    proto: rtp
    label: RTP audio (PCMU)
    caption: Alice and Bob talk, on the reserved resources.
