id: bye-no-record-route
title: "Broken: no Record-Route, so the BYE skips Proxy B"
summary: "Proxy B bills the call but does not record-route. The ACK and the BYE go straight to Bob, so the call record never closes."
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: proxyB, label: Proxy B, kind: proxy, sub: 203.0.113.10 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: proxyB
    label: "INVITE"
    caption: "Alice calls Bob. Proxy B, the billing proxy of biloxi.example, gets the INVITE."
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl1
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 5c0e7a19@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: proxyB
    to: bob
    label: "INVITE"
    caption: "Proxy B starts a call record and forwards the INVITE. It does not add Record-Route."
    message: |
      INVITE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKbl1b
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl1
      Max-Forwards: 69
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 5c0e7a19@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: bob
    to: proxyB
    label: "200 OK"
    caption: "Bob answers."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKbl1b
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl1
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>;tag=c4a90e
      Call-ID: 5c0e7a19@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: proxyB
    to: alice
    label: "200 OK"
    caption: "Proxy B forwards the 200 OK. Alice's route set is empty."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl1
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>;tag=c4a90e
      Call-ID: 5c0e7a19@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: alice
    to: bob
    label: "ACK"
    caption: "Alice sends the ACK straight to Bob's Contact. Proxy B does not see it."
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl2
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>;tag=c4a90e
      Call-ID: 5c0e7a19@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}

  - from: alice
    to: bob
    label: "BYE"
    caption: "After 3 minutes, Alice hangs up. The BYE goes straight to Bob."
    warn: "Proxy B never sees the BYE. Its call record stays open, and the bill shows the wrong duration."
    message: |
      BYE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl3
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>;tag=c4a90e
      Call-ID: 5c0e7a19@192.0.2.10
      CSeq: 2 BYE
      Content-Length: {auto}

  - from: bob
    to: alice
    label: "200 OK"
    caption: "Bob ends the call. Proxy B still counts minutes."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl3
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>;tag=c4a90e
      Call-ID: 5c0e7a19@192.0.2.10
      CSeq: 2 BYE
      Content-Length: {auto}
