id: srtp-dtls-both-active
title: "Broken: both sides are DTLS active"
summary: "Alice offers a=setup:active instead of actpass, and Bob also answers active. Both start a DTLS handshake as the client, and no media flows."
broken: true
breaks: [dtls-setup]
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: bob
    label: "INVITE (UDP/TLS/RTP/SAVP)"
    caption: "Alice's offer says a=setup:active: she will start the DTLS handshake herself."
    rfc: rfc4145-4.1-roles
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKd2b8f6i
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: d2b8f6c3a9@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 UDP/TLS/RTP/SAVP 0 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16
      a=setup:active
      a=fingerprint:sha-256 4A:AD:B9:B1:3F:82:18:3B:54:02:12:DF:3E:5D:49:6B:19:E5:7C:AB:3E:4B:65:7D:D1:93:A0:72:CF:1B:9C:0D

  - from: bob
    to: alice
    label: "200 OK (setup:active)"
    caption: "Bob also answers a=setup:active. Both sides now think they start the handshake."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKd2b8f6i
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: d2b8f6c3a9@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 UDP/TLS/RTP/SAVP 0 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16
      a=setup:active
      a=fingerprint:sha-256 D1:2C:6E:94:05:7A:B3:31:88:FE:4C:19:6D:A2:5B:E7:30:09:7F:CC:41:2E:A8:5D:93:6B:F0:17:22:C4:8E:51

  - from: alice
    to: bob
    label: "ACK"
    caption: "The call is up, but the DTLS roles clash."
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKd2b8f6ia
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: d2b8f6c3a9@192.0.2.10
      CSeq: 1 ACK
      Content-Length: 0

  - kind: media
    from: alice
    to: bob
    proto: net
    label: "DTLS ClientHello"
    caption: "Alice starts a handshake as the client."
    oneway: true
    detail: |
      UDP  192.0.2.10:49170 → 203.0.113.20:3456
      DTLS 1.2  ClientHello

  - kind: media
    from: bob
    to: alice
    proto: net
    label: "DTLS ClientHello"
    caption: "Bob also starts one as the client. Neither side acts as the server, so neither handshake finishes."
    oneway: true
    warn: "Neither side acts as the DTLS server. No keys, no SRTP: the call is up but silent."
    detail: |
      UDP  203.0.113.20:3456 → 192.0.2.10:49170
      DTLS 1.2  ClientHello
