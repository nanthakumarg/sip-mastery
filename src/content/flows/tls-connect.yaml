id: tls-connect
title: "SIP over TLS: the handshake and the certificate check"
summary: "Alice's phone opens TLS to Proxy A, checks that the certificate names atlanta.example, then registers over the connection."
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: proxyA, label: Proxy A, kind: proxy, sub: proxy.atlanta.example }
steps:
  - kind: media
    from: alice
    to: proxyA
    proto: net
    label: "TLS ClientHello"
    caption: "Alice opens TCP to port 5061 and starts TLS. SNI names the SIP domain she wants: atlanta.example."
    rfc: rfc5922-7.8-sni
    oneway: true
    detail: |
      TCP  192.0.2.10:52381 → proxy.atlanta.example:5061 (SYN, SYN-ACK, ACK)
      TLS 1.3  ClientHello
        server_name (SNI): atlanta.example
        supported_versions: TLS 1.3, TLS 1.2

  - kind: media
    from: proxyA
    to: alice
    proto: net
    label: "TLS ServerHello, Certificate"
    caption: "The proxy sends its certificate. Alice checks the CA, the dates, and that a SIP identity matches atlanta.example."
    rfc: rfc5922-7.3-client
    oneway: true
    detail: |
      TLS 1.3  ServerHello
        {EncryptedExtensions, Certificate, CertificateVerify, Finished}
        Certificate: subject CN=proxy.atlanta.example
                     subjectAltName URI:sip:atlanta.example, DNS:proxy.atlanta.example
                     issuer: a CA that Alice trusts

      Check (RFC 5922 §7.3): URI:sip:atlanta.example matches the SIP domain → OK

  - kind: media
    from: alice
    to: proxyA
    proto: net
    label: "TLS Finished"
    caption: "The handshake is complete. TLS encrypts everything after this."
    oneway: true
    detail: |
      TLS 1.3  {Finished}

  - from: alice
    to: proxyA
    label: "REGISTER (TLS)"
    caption: "The REGISTER travels inside TLS. Via says TLS, the port is 5061, and the Contact asks for transport=tls."
    message: |
      REGISTER sip:atlanta.example SIP/2.0
      Via: SIP/2.0/TLS 192.0.2.10:5061;branch=z9hG4bKtls1reg;alias
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=a73kszlfl
      To: Alice <sip:alice@atlanta.example>
      Call-ID: 1j9FpLxk3uxtm8tn@192.0.2.10
      CSeq: 1 REGISTER
      Contact: <sip:alice@192.0.2.10:5061;transport=tls>
      Expires: 3600
      Content-Length: 0

  - from: proxyA
    to: alice
    label: "200 OK"
    caption: "The response comes back on the same connection. Alice keeps it open for incoming calls."
    rfc: rfc3261-18.2.2-reliable
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/TLS 192.0.2.10:5061;branch=z9hG4bKtls1reg;alias
      From: Alice <sip:alice@atlanta.example>;tag=a73kszlfl
      To: Alice <sip:alice@atlanta.example>;tag=37GkEhwl6
      Call-ID: 1j9FpLxk3uxtm8tn@192.0.2.10
      CSeq: 1 REGISTER
      Contact: <sip:alice@192.0.2.10:5061;transport=tls>;expires=3600
      Content-Length: 0
