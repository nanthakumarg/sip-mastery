id: session-timer-refresh
title: "Session timer: Bob refreshes"
summary: Bob is the refresher. Every 900 s he sends an UPDATE, and each 200 OK restarts the session timer on both sides.
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: bob
    label: INVITE
    caption: Alice supports session timers and asks for an interval of 1800 s (30 minutes).
    message: |
      INVITE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKst1
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=t6a1
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 9b1f7d24@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Allow: INVITE, ACK, CANCEL, BYE, OPTIONS, UPDATE
      Supported: timer
      Session-Expires: 1800
      Min-SE: 90
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: bob
    to: alice
    label: "200 OK"
    caption: Bob accepts 1800 s and chooses himself, the UAS, as the refresher.
    rfc: rfc4028-3-refresher
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKst1
      From: Alice <sip:alice@atlanta.example>;tag=t6a1
      To: Bob <sip:bob@biloxi.example>;tag=t8b2
      Call-ID: 9b1f7d24@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Allow: INVITE, ACK, CANCEL, BYE, OPTIONS, UPDATE
      Require: timer
      Session-Expires: 1800;refresher=uas
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: alice
    to: bob
    label: ACK
    caption: Alice ACKs. Both phones start a 1800 s session timer.
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKst2
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=t6a1
      To: Bob <sip:bob@biloxi.example>;tag=t8b2
      Call-ID: 9b1f7d24@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}

  - from: bob
    to: alice
    label: UPDATE (refresh)
    caption: At 900 s, half the interval, Bob refreshes. In this UPDATE Bob is the UAC, so refresher=uac.
    rfc: rfc4028-7.2-half
    message: |
      UPDATE sip:alice@192.0.2.10:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKup1
      Max-Forwards: 70
      From: Bob <sip:bob@biloxi.example>;tag=t8b2
      To: Alice <sip:alice@atlanta.example>;tag=t6a1
      Call-ID: 9b1f7d24@192.0.2.10
      CSeq: 101 UPDATE
      Contact: <sip:bob@203.0.113.20:5060>
      Supported: timer
      Session-Expires: 1800;refresher=uac
      Content-Length: {auto}

  - from: alice
    to: bob
    label: "200 OK"
    caption: "The 200 OK restarts the timer: the session now lasts until 2700 s."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKup1
      From: Bob <sip:bob@biloxi.example>;tag=t8b2
      To: Alice <sip:alice@atlanta.example>;tag=t6a1
      Call-ID: 9b1f7d24@192.0.2.10
      CSeq: 101 UPDATE
      Contact: <sip:alice@192.0.2.10:5060>
      Require: timer
      Session-Expires: 1800;refresher=uac
      Content-Length: {auto}

  - from: bob
    to: alice
    label: UPDATE (refresh)
    caption: At 1800 s, Bob refreshes again.
    message: |
      UPDATE sip:alice@192.0.2.10:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKup2
      Max-Forwards: 70
      From: Bob <sip:bob@biloxi.example>;tag=t8b2
      To: Alice <sip:alice@atlanta.example>;tag=t6a1
      Call-ID: 9b1f7d24@192.0.2.10
      CSeq: 102 UPDATE
      Contact: <sip:bob@203.0.113.20:5060>
      Supported: timer
      Session-Expires: 1800;refresher=uac
      Content-Length: {auto}

  - from: alice
    to: bob
    label: "200 OK"
    caption: The session now lasts until 3600 s.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKup2
      From: Bob <sip:bob@biloxi.example>;tag=t8b2
      To: Alice <sip:alice@atlanta.example>;tag=t6a1
      Call-ID: 9b1f7d24@192.0.2.10
      CSeq: 102 UPDATE
      Contact: <sip:alice@192.0.2.10:5060>
      Require: timer
      Session-Expires: 1800;refresher=uac
      Content-Length: {auto}

  - from: alice
    to: bob
    label: BYE
    caption: At 2400 s, Alice hangs up.
    message: |
      BYE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKst3
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=t6a1
      To: Bob <sip:bob@biloxi.example>;tag=t8b2
      Call-ID: 9b1f7d24@192.0.2.10
      CSeq: 2 BYE
      Content-Length: {auto}

  - from: bob
    to: alice
    label: "200 OK"
    caption: Bob ends the call.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKst3
      From: Alice <sip:alice@atlanta.example>;tag=t6a1
      To: Bob <sip:bob@biloxi.example>;tag=t8b2
      Call-ID: 9b1f7d24@192.0.2.10
      CSeq: 2 BYE
      Content-Length: {auto}
