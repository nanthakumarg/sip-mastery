id: register-outbound
title: "With SIP Outbound: the new Contact replaces the old one"
summary: "The mobile app registers with an instance ID and a reg-id. After it moves to 4G, its new registration replaces the old binding."
registrar: { lane: registrar, outbound: true, gruu: true }
lanes:
  - { id: mobile, label: Mobile, kind: ua, sub: 198.51.100.77 }
  - { id: registrar, label: Registrar, kind: registrar, sub: biloxi.example }
steps:
  - from: mobile
    to: registrar
    at: 0
    label: "REGISTER"
    caption: "Bob's mobile app registers over TCP on Wi-Fi. Its Contact carries an instance ID and reg-id=1."
    rfc: rfc5626-3.1-instance
    status: { mobile: "Wi-Fi" }
    message: |
      REGISTER sip:biloxi.example SIP/2.0
      Via: SIP/2.0/TCP 198.51.100.77:41270;branch=z9hG4bKr024x7
      Max-Forwards: 70
      From: Bob <sip:bob@biloxi.example>;tag=m0b4x2
      To: Bob <sip:bob@biloxi.example>
      Call-ID: Mb48wn93@198.51.100.77
      CSeq: 1 REGISTER
      Supported: path, outbound, gruu
      Contact: <sip:bob@198.51.100.77:41270;transport=tcp>;+sip.instance="<urn:uuid:5f3c0a2e-6b1d-4c8e-9a47-2d61b0e8c3f5>";reg-id=1
      Expires: 600
      Content-Length: 0

  - from: registrar
    to: mobile
    label: "200 OK"
    caption: "Require: outbound confirms SIP Outbound. The Contact carries two GRUUs."
    rfc: rfc5627-3.2-two-gruus
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/TCP 198.51.100.77:41270;branch=z9hG4bKr024x7
      From: Bob <sip:bob@biloxi.example>;tag=m0b4x2
      To: Bob <sip:bob@biloxi.example>;tag=rg8825
      Call-ID: Mb48wn93@198.51.100.77
      CSeq: 1 REGISTER
      Require: outbound
      Date: Sun, 04 Oct 2026 09:00:00 GMT
      Contact: <sip:bob@198.51.100.77:41270;transport=tcp>;+sip.instance="<urn:uuid:5f3c0a2e-6b1d-4c8e-9a47-2d61b0e8c3f5>";reg-id=1;pub-gruu="sip:bob@biloxi.example;gr=urn:uuid:5f3c0a2e-6b1d-4c8e-9a47-2d61b0e8c3f5";temp-gruu="sip:tgruu.1er2har@biloxi.example;gr";expires=600
      Content-Length: 0

  - from: mobile
    to: registrar
    at: 110
    proto: rtcp
    label: "keepalive ping"
    caption: "Every 95 to 120 seconds, the app sends a double CRLF on the connection."
    rfc: rfc5626-3.5.1-crlf
    detail: |
      \r\n\r\n   (double CRLF: the "ping")

  - from: registrar
    to: mobile
    proto: rtcp
    label: "keepalive pong"
    caption: "The Registrar answers with one CRLF. The connection and the NAT mapping stay open."
    detail: |
      \r\n   (one CRLF: the "pong")

  - from: mobile
    to: registrar
    at: 240
    label: "REGISTER"
    caption: "Bob leaves the building. The phone moves to 4G, opens a new connection, and registers its new address."
    status: { mobile: "4G" }
    message: |
      REGISTER sip:biloxi.example SIP/2.0
      Via: SIP/2.0/TCP 198.51.100.200:50122;branch=z9hG4bKr025x7
      Max-Forwards: 70
      From: Bob <sip:bob@biloxi.example>;tag=m0b4x2
      To: Bob <sip:bob@biloxi.example>
      Call-ID: Mb48wn93@198.51.100.77
      CSeq: 2 REGISTER
      Supported: path, outbound, gruu
      Contact: <sip:bob@198.51.100.200:50122;transport=tcp>;+sip.instance="<urn:uuid:5f3c0a2e-6b1d-4c8e-9a47-2d61b0e8c3f5>";reg-id=1
      Expires: 600
      Content-Length: 0

  - from: registrar
    to: mobile
    label: "200 OK"
    caption: "Same instance ID and reg-id: the new Contact replaces the old one. One binding, and it works."
    rfc: rfc5626-3.2-replace
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/TCP 198.51.100.200:50122;branch=z9hG4bKr025x7
      From: Bob <sip:bob@biloxi.example>;tag=m0b4x2
      To: Bob <sip:bob@biloxi.example>;tag=rg8826
      Call-ID: Mb48wn93@198.51.100.77
      CSeq: 2 REGISTER
      Require: outbound
      Date: Sun, 04 Oct 2026 09:04:00 GMT
      Contact: <sip:bob@198.51.100.200:50122;transport=tcp>;+sip.instance="<urn:uuid:5f3c0a2e-6b1d-4c8e-9a47-2d61b0e8c3f5>";reg-id=1;pub-gruu="sip:bob@biloxi.example;gr=urn:uuid:5f3c0a2e-6b1d-4c8e-9a47-2d61b0e8c3f5";temp-gruu="sip:tgruu.1f122zq@biloxi.example;gr";expires=600
      Content-Length: 0
