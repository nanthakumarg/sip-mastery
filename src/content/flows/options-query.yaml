id: options-query
title: OPTIONS asks what Bob's phone can do
summary: Alice's phone asks Bob's phone for its capabilities without ringing it. The 200 OK lists the methods, extensions, and body types that Bob's phone supports.
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: bob
    label: OPTIONS
    caption: Alice's phone asks Bob's phone about its capabilities. Bob's phone does not ring.
    rfc: rfc3261-11-options
    message: |
      OPTIONS sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKhjhs8ass877
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=1928301774
      To: <sip:bob@biloxi.example>
      Call-ID: a84b4c76e66710@192.0.2.10
      CSeq: 63104 OPTIONS
      Contact: <sip:alice@192.0.2.10:5060>
      Accept: application/sdp
      Content-Length: {auto}

  - from: bob
    to: alice
    label: 200 OK
    caption: Bob's phone lists its methods in Allow, its extensions in Supported, and its media in the SDP.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKhjhs8ass877
      From: Alice <sip:alice@atlanta.example>;tag=1928301774
      To: <sip:bob@biloxi.example>;tag=93810874
      Call-ID: a84b4c76e66710@192.0.2.10
      CSeq: 63104 OPTIONS
      Contact: <sip:bob@203.0.113.20:5060>
      Allow: INVITE, ACK, CANCEL, OPTIONS, BYE, PRACK, UPDATE, INFO, REFER, NOTIFY, MESSAGE
      Accept: application/sdp
      Accept-Encoding: gzip
      Accept-Language: en
      Supported: 100rel, timer, replaces, norefersub
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 0 RTP/AVP 0 8 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
      a=rtpmap:101 telephone-event/8000
