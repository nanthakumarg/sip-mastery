id: wss-cert-mismatch
title: "WSS with the wrong certificate: no connection"
summary: The gateway's certificate names its internal host, so the browser refuses the TLS connection and the web app cannot register.
lanes:
  - id: browser
    label: Browser
    kind: ua
    sub: https://app.atlanta.example
  - id: gw
    label: WebRTC gateway
    kind: sbc
    sub: wss://wss.atlanta.example
steps:
  - from: browser
    to: gw
    proto: net
    label: TLS ClientHello
    caption: The web app opens wss://wss.atlanta.example. The browser starts TLS, and names that host in SNI.
    detail: |-
      TCP  192.168.1.20:51844 → 203.0.113.80:443 (SYN, SYN-ACK, ACK)
      TLS 1.3  ClientHello
        server_name (SNI): wss.atlanta.example
        ALPN: http/1.1
  - from: gw
    to: browser
    proto: net
    label: TLS ServerHello, Certificate
    caption: "The gateway presents its default certificate: a self-signed one, for its internal name."
    detail: |-
      TLS 1.3  ServerHello
        {Certificate, CertificateVerify, Finished}
        Certificate: subject CN=sbc01.corp.internal
                     issuer: CN=sbc01.corp.internal (self-signed)
  - from: browser
    to: gw
    proto: err
    label: TLS alert (bad_certificate)
    caption: The name does not match, and nobody the browser trusts signed it. The browser closes the connection.
    warn: A browser shows no "accept the risk" page for a WebSocket. The web app just gets error 1006, and cannot register or call.
    detail: |-
      TLS 1.3  Alert: bad_certificate
      TCP  FIN
      JavaScript: WebSocket error; close event code 1006 (abnormal closure)
