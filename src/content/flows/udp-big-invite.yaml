id: udp-big-invite
title: "Broken: a large INVITE over UDP"
summary: "Proxy A adds a Via and a Record-Route, and the INVITE grows to 1410 bytes. Over UDP, on a path with a 1400-byte MTU, it becomes two IP fragments, and a firewall drops the second."
broken: true
breaks: [udp-size]
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: proxyA, label: Proxy A, kind: proxy, sub: 198.51.100.10 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: proxyA
    label: "INVITE (UDP)"
    caption: "Alice sends a large INVITE: audio, video, and ICE candidates. At 1296 bytes, it still fits in one UDP packet."
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9big
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: b19c8e2a7d@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Allow: INVITE, ACK, CANCEL, BYE, OPTIONS, UPDATE, PRACK, REFER, INFO
      Supported: 100rel, timer, replaces
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      a=ice-ufrag:8hhY
      a=ice-pwd:asd88fgpdd777uzjYhagZg
      m=audio 49170 RTP/AVP 111 9 0 8 101
      a=rtpmap:111 opus/48000/2
      a=fmtp:111 minptime=10;useinbandfec=1
      a=rtpmap:9 G722/8000
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16
      a=ptime:20
      a=candidate:1 1 UDP 2130706431 192.0.2.10 49170 typ host
      a=candidate:2 1 UDP 1694498815 198.51.100.7 40210 typ srflx raddr 192.0.2.10 rport 49170
      m=video 51372 RTP/AVP 96 97
      a=rtpmap:96 H264/90000
      a=fmtp:96 profile-level-id=42e01f;packetization-mode=1
      a=rtpmap:97 VP8/90000
      a=rtcp-fb:96 nack pli
      a=rtcp-fb:97 nack pli
      a=candidate:1 1 UDP 2130706431 192.0.2.10 51372 typ host
      a=candidate:2 1 UDP 1694498815 198.51.100.7 40212 typ srflx raddr 192.0.2.10 rport 51372

  - from: proxyA
    to: alice
    label: "100 Trying"
    caption: "Proxy A takes the call."
    message: |
      SIP/2.0 100 Trying
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9big
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: b19c8e2a7d@192.0.2.10
      CSeq: 1 INVITE
      Content-Length: 0

  - from: proxyA
    to: bob
    label: "INVITE (UDP)"
    caption: "Proxy A adds its Via and Record-Route: 1410 bytes. The path MTU is 1400, so IP cuts the UDP packet in two."
    rfc: rfc3261-18.1.1-1300
    lost: true
    detail: |
      The path to Bob crosses a VPN tunnel: MTU 1400.
      UDP datagram: 1418 bytes (SIP + 8). IP packet: 1438 bytes, too big.
      IPv4 fragments:
        fragment 1  1376 bytes of data  (offset 0)
        fragment 2  42 bytes of data  (offset 1376)  ← dropped by a firewall
      Without fragment 2, Bob cannot rebuild the datagram, so the INVITE is lost.
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP proxy.atlanta.example:5060;branch=z9hG4bKpa7c1big
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9big
      Max-Forwards: 69
      Record-Route: <sip:proxy.atlanta.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: b19c8e2a7d@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Allow: INVITE, ACK, CANCEL, BYE, OPTIONS, UPDATE, PRACK, REFER, INFO
      Supported: 100rel, timer, replaces
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      a=ice-ufrag:8hhY
      a=ice-pwd:asd88fgpdd777uzjYhagZg
      m=audio 49170 RTP/AVP 111 9 0 8 101
      a=rtpmap:111 opus/48000/2
      a=fmtp:111 minptime=10;useinbandfec=1
      a=rtpmap:9 G722/8000
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16
      a=ptime:20
      a=candidate:1 1 UDP 2130706431 192.0.2.10 49170 typ host
      a=candidate:2 1 UDP 1694498815 198.51.100.7 40210 typ srflx raddr 192.0.2.10 rport 49170
      m=video 51372 RTP/AVP 96 97
      a=rtpmap:96 H264/90000
      a=fmtp:96 profile-level-id=42e01f;packetization-mode=1
      a=rtpmap:97 VP8/90000
      a=rtcp-fb:96 nack pli
      a=rtcp-fb:97 nack pli
      a=candidate:1 1 UDP 2130706431 192.0.2.10 51372 typ host
      a=candidate:2 1 UDP 1694498815 198.51.100.7 40212 typ srflx raddr 192.0.2.10 rport 51372

  - from: proxyA
    to: bob
    label: "INVITE (retransmit)"
    caption: "Timer A fires and Proxy A resends the whole INVITE. The firewall drops the same fragment again."
    lost: true
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP proxy.atlanta.example:5060;branch=z9hG4bKpa7c1big
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9big
      Max-Forwards: 69
      Record-Route: <sip:proxy.atlanta.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: b19c8e2a7d@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Allow: INVITE, ACK, CANCEL, BYE, OPTIONS, UPDATE, PRACK, REFER, INFO
      Supported: 100rel, timer, replaces
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      a=ice-ufrag:8hhY
      a=ice-pwd:asd88fgpdd777uzjYhagZg
      m=audio 49170 RTP/AVP 111 9 0 8 101
      a=rtpmap:111 opus/48000/2
      a=fmtp:111 minptime=10;useinbandfec=1
      a=rtpmap:9 G722/8000
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16
      a=ptime:20
      a=candidate:1 1 UDP 2130706431 192.0.2.10 49170 typ host
      a=candidate:2 1 UDP 1694498815 198.51.100.7 40210 typ srflx raddr 192.0.2.10 rport 49170
      m=video 51372 RTP/AVP 96 97
      a=rtpmap:96 H264/90000
      a=fmtp:96 profile-level-id=42e01f;packetization-mode=1
      a=rtpmap:97 VP8/90000
      a=rtcp-fb:96 nack pli
      a=rtcp-fb:97 nack pli
      a=candidate:1 1 UDP 2130706431 192.0.2.10 51372 typ host
      a=candidate:2 1 UDP 1694498815 198.51.100.7 40212 typ srflx raddr 192.0.2.10 rport 51372

  - from: proxyA
    to: alice
    label: "408 Request Timeout"
    caption: "After 32 seconds, Timer B ends the transaction. Bob's phone never rang."
    warn: "The call fails for one reason: the message is too large for UDP."
    message: |
      SIP/2.0 408 Request Timeout
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9big
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=pa71k2
      Call-ID: b19c8e2a7d@192.0.2.10
      CSeq: 1 INVITE
      Content-Length: 0

  - from: alice
    to: proxyA
    label: "ACK"
    caption: "Alice acknowledges the 408 on her hop."
    message: |
      ACK sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9big
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=pa71k2
      Call-ID: b19c8e2a7d@192.0.2.10
      CSeq: 1 ACK
      Content-Length: 0
