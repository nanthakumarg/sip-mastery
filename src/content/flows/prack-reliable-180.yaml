id: prack-reliable-180
title: A reliable 180, with a lost PRACK
summary: "Bob's 180 is reliable: it carries Require: 100rel and RSeq. The first PRACK is lost, so the 180 and the PRACK are both retransmitted."
lanes:
  - id: alice
    label: Alice
    kind: ua
    sub: 192.0.2.10
  - id: bob
    label: Bob
    kind: ua
    sub: 203.0.113.20
steps:
  - from: alice
    to: bob
    label: INVITE
    caption: "Alice calls Bob. Supported: 100rel says her phone can acknowledge provisional responses."
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Supported: 100rel
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
    rfc: rfc3262-3-require
  - from: bob
    to: alice
    label: 180 Ringing (reliable)
    caption: "Bob's phone rings. Require: 100rel makes this 180 reliable, and RSeq numbers it."
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Require: 100rel
      RSeq: 1
      Content-Length: {auto}
    rfc: rfc3262-3-rseq
  - from: alice
    to: bob
    label: PRACK
    caption: Alice's phone acknowledges the 180. The packet never arrives.
    message: |
      PRACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b2048
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 2 PRACK
      RAck: 1 1 INVITE
      Content-Length: {auto}
    lost: true
  - from: bob
    to: alice
    label: 180 Ringing (retransmission)
    caption: No PRACK yet, so Bob's phone sends the 180 again after 500 ms, with the same RSeq.
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Require: 100rel
      RSeq: 1
      Content-Length: {auto}
    rfc: rfc3262-3-retransmit
  - from: alice
    to: bob
    label: PRACK (retransmission)
    caption: Alice's phone retransmits the PRACK itself, after 500 ms (Timer E). RAck names RSeq 1 of INVITE 1.
    message: |
      PRACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b2048
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 2 PRACK
      RAck: 1 1 INVITE
      Content-Length: {auto}
    rfc: rfc3262-7.2-rack
  - from: bob
    to: alice
    label: 200 OK (PRACK)
    caption: Bob's phone confirms the PRACK and stops retransmitting the 180.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b2048
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 2 PRACK
      Content-Length: {auto}
  - from: bob
    to: alice
    label: 200 OK
    caption: Bob answers. The 200 OK carries the SDP answer.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
  - from: alice
    to: bob
    label: ACK
    caption: Alice's phone confirms the 200 OK.
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b231b
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}
  - kind: media
    from: alice
    to: bob
    proto: rtp
    label: RTP audio (PCMU)
    caption: Alice and Bob talk.
