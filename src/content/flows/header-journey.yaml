id: header-journey
title: One INVITE, four hops
summary: Alice's INVITE travels through Proxy A, an SBC, and Proxy B to Bob's phone. Each element changes some headers and leaves the rest alone.
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.168.1.20 }
  - { id: proxyA, label: Proxy A, kind: proxy, sub: 198.51.100.10 }
  - { id: sbc, label: SBC, kind: sbc, sub: 198.51.100.200 }
  - { id: proxyB, label: Proxy B, kind: proxy, sub: 203.0.113.10 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: proxyA
    label: INVITE
    caption: Alice's phone builds the INVITE behind a NAT router. It asks for its phone number as identity.
    rfc: rfc3261-8.1.1-mandatory
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.168.1.20:5060;branch=z9hG4bK74bf9;rport
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.168.1.20
      CSeq: 1 INVITE
      Contact: <sip:alice@192.168.1.20:5060>
      P-Preferred-Identity: <tel:+14045550101>
      Supported: timer, 100rel
      Session-Expires: 1800
      Min-SE: 90
      Allow: INVITE, ACK, CANCEL, BYE, OPTIONS, UPDATE, REFER
      User-Agent: Linphone/5.2
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.168.1.20
      s=-
      c=IN IP4 192.168.1.20
      t=0 0
      m=audio 49170 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000

  - from: proxyA
    to: sbc
    label: INVITE
    caption: Proxy A records the NAT address in Alice's Via, asserts Alice's identity, and adds Record-Route.
    rfc: rfc3325-4-pai
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 198.51.100.10:5060;branch=z9hG4bKpa4790
      Via: SIP/2.0/UDP 192.168.1.20:5060;branch=z9hG4bK74bf9;received=192.0.2.10;rport=40112
      Max-Forwards: 69
      Record-Route: <sip:proxy.atlanta.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.168.1.20
      CSeq: 1 INVITE
      Contact: <sip:alice@192.168.1.20:5060>
      P-Asserted-Identity: "Alice" <sip:alice@atlanta.example>, <tel:+14045550101>
      Supported: timer, 100rel
      Session-Expires: 1800
      Min-SE: 90
      Allow: INVITE, ACK, CANCEL, BYE, OPTIONS, UPDATE, REFER
      User-Agent: Linphone/5.2
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.168.1.20
      s=-
      c=IN IP4 192.168.1.20
      t=0 0
      m=audio 49170 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000

  - from: sbc
    to: proxyB
    label: INVITE (outer side)
    caption: The SBC starts a new INVITE. It hides every inner address and keeps the asserted identity for a trusted peer.
    rfc: rfc7092-4.3-sbc-default
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 198.51.100.200:5060;branch=z9hG4bK-sbc-5b2e
      Max-Forwards: 68
      From: Alice <sip:alice@atlanta.example>;tag=sbc-3c9d0f
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 9e7d6c5b4a21@198.51.100.200
      CSeq: 1 INVITE
      Contact: <sip:alice@198.51.100.200:5060>
      P-Asserted-Identity: "Alice" <sip:alice@atlanta.example>, <tel:+14045550101>
      Supported: timer, 100rel
      Session-Expires: 1800
      Min-SE: 90
      Allow: INVITE, ACK, CANCEL, BYE, OPTIONS, UPDATE, REFER
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=sbc 1700000 1700000 IN IP4 198.51.100.200
      s=-
      c=IN IP4 198.51.100.200
      t=0 0
      m=audio 40000 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000

  - from: proxyB
    to: bob
    label: INVITE
    caption: Proxy B routes to Bob's Contact, adds Record-Route, and lowers the session timer to its own limit.
    rfc: rfc3261-8.1.1.6-max-forwards
    message: |
      INVITE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKpb721e
      Via: SIP/2.0/UDP 198.51.100.200:5060;branch=z9hG4bK-sbc-5b2e
      Max-Forwards: 67
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=sbc-3c9d0f
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 9e7d6c5b4a21@198.51.100.200
      CSeq: 1 INVITE
      Contact: <sip:alice@198.51.100.200:5060>
      P-Asserted-Identity: "Alice" <sip:alice@atlanta.example>, <tel:+14045550101>
      Supported: timer, 100rel
      Session-Expires: 900
      Min-SE: 90
      Allow: INVITE, ACK, CANCEL, BYE, OPTIONS, UPDATE, REFER
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=sbc 1700000 1700000 IN IP4 198.51.100.200
      s=-
      c=IN IP4 198.51.100.200
      t=0 0
      m=audio 40000 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
