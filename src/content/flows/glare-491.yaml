id: glare-491
title: "Glare: two re-INVITEs cross"
summary: In a call, Alice puts Bob on hold just as Bob adds video. Both re-INVITEs cross, both get 491, and both retry after a random wait.
lanes:
  - { id: alice, label: Alice, kind: ua, sub: owns the Call-ID }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: bob
    label: INVITE (hold)
    caption: Alice puts the call on hold with a re-INVITE. Her SDP says sendonly.
    message: |
      INVITE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKh01
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=a73kszlfl
      To: Bob <sip:bob@biloxi.example>;tag=1410948204
      Call-ID: 6d1a3c8e@192.0.2.10
      CSeq: 2 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844527 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
      a=sendonly

  - from: bob
    to: alice
    label: INVITE (add video)
    caption: At the same moment, Bob adds video with his own re-INVITE.
    message: |
      INVITE sip:alice@192.0.2.10:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKv01
      Max-Forwards: 70
      From: Bob <sip:bob@biloxi.example>;tag=1410948204
      To: Alice <sip:alice@atlanta.example>;tag=a73kszlfl
      Call-ID: 6d1a3c8e@192.0.2.10
      CSeq: 4712 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844565 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
      m=video 3458 RTP/AVP 96
      a=rtpmap:96 H264/90000

  - from: bob
    to: alice
    label: "491 Request Pending"
    caption: "Bob has a re-INVITE of his own in progress, so he rejects Alice's with 491."
    rfc: rfc3261-14.2-491
    message: |
      SIP/2.0 491 Request Pending
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKh01
      From: Alice <sip:alice@atlanta.example>;tag=a73kszlfl
      To: Bob <sip:bob@biloxi.example>;tag=1410948204
      Call-ID: 6d1a3c8e@192.0.2.10
      CSeq: 2 INVITE
      Content-Length: {auto}

  - from: alice
    to: bob
    label: ACK
    caption: Alice ACKs the 491. Her session stays as it was.
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKh01
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=a73kszlfl
      To: Bob <sip:bob@biloxi.example>;tag=1410948204
      Call-ID: 6d1a3c8e@192.0.2.10
      CSeq: 2 ACK
      Content-Length: {auto}

  - from: alice
    to: bob
    label: "491 Request Pending"
    caption: "Alice has the same problem, so she rejects Bob's re-INVITE with 491 too."
    message: |
      SIP/2.0 491 Request Pending
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKv01
      From: Bob <sip:bob@biloxi.example>;tag=1410948204
      To: Alice <sip:alice@atlanta.example>;tag=a73kszlfl
      Call-ID: 6d1a3c8e@192.0.2.10
      CSeq: 4712 INVITE
      Content-Length: {auto}

  - from: bob
    to: alice
    label: ACK
    caption: Bob ACKs the 491.
    message: |
      ACK sip:alice@192.0.2.10:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKv01
      Max-Forwards: 70
      From: Bob <sip:bob@biloxi.example>;tag=1410948204
      To: Alice <sip:alice@atlanta.example>;tag=a73kszlfl
      Call-ID: 6d1a3c8e@192.0.2.10
      CSeq: 4712 ACK
      Content-Length: {auto}

  - from: bob
    to: alice
    label: INVITE (add video)
    caption: Bob does not own the Call-ID, so he waits 0 to 2 seconds. After 1.3 s he tries again.
    rfc: rfc3261-14.1-491-timer
    message: |
      INVITE sip:alice@192.0.2.10:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKv02
      Max-Forwards: 70
      From: Bob <sip:bob@biloxi.example>;tag=1410948204
      To: Alice <sip:alice@atlanta.example>;tag=a73kszlfl
      Call-ID: 6d1a3c8e@192.0.2.10
      CSeq: 4713 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844565 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
      m=video 3458 RTP/AVP 96
      a=rtpmap:96 H264/90000

  - from: alice
    to: bob
    label: "200 OK"
    caption: Nothing crosses this time. Alice accepts the video.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKv02
      From: Bob <sip:bob@biloxi.example>;tag=1410948204
      To: Alice <sip:alice@atlanta.example>;tag=a73kszlfl
      Call-ID: 6d1a3c8e@192.0.2.10
      CSeq: 4713 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844527 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
      m=video 51372 RTP/AVP 96
      a=rtpmap:96 H264/90000

  - from: bob
    to: alice
    label: ACK
    caption: Bob ACKs the 200 OK. The call now has video.
    message: |
      ACK sip:alice@192.0.2.10:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKv03
      Max-Forwards: 70
      From: Bob <sip:bob@biloxi.example>;tag=1410948204
      To: Alice <sip:alice@atlanta.example>;tag=a73kszlfl
      Call-ID: 6d1a3c8e@192.0.2.10
      CSeq: 4713 ACK
      Content-Length: {auto}

  - from: alice
    to: bob
    label: INVITE (hold)
    caption: Alice owns the Call-ID, so she waits 2.1 to 4 seconds. After 3.2 s she tries again.
    message: |
      INVITE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKh02
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=a73kszlfl
      To: Bob <sip:bob@biloxi.example>;tag=1410948204
      Call-ID: 6d1a3c8e@192.0.2.10
      CSeq: 3 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844528 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
      a=sendonly
      m=video 51372 RTP/AVP 96
      a=rtpmap:96 H264/90000

  - from: bob
    to: alice
    label: "200 OK"
    caption: Bob accepts the hold.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKh02
      From: Alice <sip:alice@atlanta.example>;tag=a73kszlfl
      To: Bob <sip:bob@biloxi.example>;tag=1410948204
      Call-ID: 6d1a3c8e@192.0.2.10
      CSeq: 3 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844566 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000
      a=recvonly
      m=video 3458 RTP/AVP 96
      a=rtpmap:96 H264/90000

  - from: alice
    to: bob
    label: ACK
    caption: Alice ACKs the 200 OK. Both changes are now done, one after the other.
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKh03
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=a73kszlfl
      To: Bob <sip:bob@biloxi.example>;tag=1410948204
      Call-ID: 6d1a3c8e@192.0.2.10
      CSeq: 3 ACK
      Content-Length: {auto}
