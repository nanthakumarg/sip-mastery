  - from: bob
    to: proxyB
    label: 200 OK
    caption: Bob's phone shows the message.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKpb15b8
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      From: Alice <sip:alice@atlanta.example>;tag=m7a09
      To: Bob <sip:bob@biloxi.example>;tag=b9e23
      Call-ID: im-big-4a1@192.0.2.10
      CSeq: 1 MESSAGE
      Content-Length: {auto}
  - from: proxyB
    to: alice
    label: 200 OK
    caption: This time every fragment arrived. On a busy network, many such messages vanish.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      From: Alice <sip:alice@atlanta.example>;tag=m7a09
