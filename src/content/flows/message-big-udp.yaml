    rfc: rfc3428-8-1300
    warn: Above 1300 bytes, UDP splits the packet into IP fragments. If the network drops one fragment, the whole message never arrives.
  - from: proxyB
    to: bob
    label: MESSAGE
    caption: Proxy B forwards it over UDP as well, in fragments.
    message: |
      MESSAGE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKpb15b8
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b1d75
      Max-Forwards: 69
      From: Alice <sip:alice@atlanta.example>;tag=m7a09
