id: fork-one-answers
title: "Forking: one phone answers"
summary: "Proxy B forks Alice's INVITE to Bob's three devices. Each one rings and creates an early dialog. The desk phone answers; Proxy B cancels the others."
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: proxyB, label: Proxy B, kind: proxy, sub: 203.0.113.10 }
  - { id: desk, label: Desk phone, kind: ua, sub: 203.0.113.20 }
  - { id: mobile, label: Mobile, kind: ua, sub: 203.0.113.40 }
  - { id: soft, label: Softphone, kind: ua, sub: 203.0.113.60 }
steps:
  - from: alice
    to: proxyB
    label: INVITE
    caption: Alice calls bob@biloxi.example.
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776fork
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: proxyB
    to: alice
    label: "100 Trying"
    caption: Proxy B answers 100 Trying on this hop.
    message: |
      SIP/2.0 100 Trying
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776fork
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 INVITE
      Content-Length: {auto}

  - from: proxyB
    to: desk
    label: INVITE
    caption: Bob has 3 registered devices. Proxy B forks the INVITE to the desk phone, with its own branch.
    message: |
      INVITE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKf1a
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776fork
      Max-Forwards: 69
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: proxyB
    to: mobile
    label: INVITE
    caption: Proxy B also sends the INVITE to the mobile.
    message: |
      INVITE sip:bob@203.0.113.40:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKf1b
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776fork
      Max-Forwards: 69
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: proxyB
    to: soft
    label: INVITE
    caption: Proxy B also sends the INVITE to the softphone.
    message: |
      INVITE sip:bob@203.0.113.60:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKf1c
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776fork
      Max-Forwards: 69
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: desk
    to: proxyB
    label: "180 Ringing"
    caption: "The desk phone rings. It picks its own To tag: d7c1."
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKf1a
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776fork
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>;tag=d7c1
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Length: {auto}

  - from: proxyB
    to: alice
    label: "180 Ringing"
    caption: Alice now has 1 early dialog, one for each To tag.
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776fork
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>;tag=d7c1
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Length: {auto}

  - from: mobile
    to: proxyB
    label: "180 Ringing"
    caption: "The mobile rings. It picks its own To tag: m2a8."
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKf1b
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776fork
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>;tag=m2a8
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.40:5060>
      Content-Length: {auto}

  - from: proxyB
    to: alice
    label: "180 Ringing"
    caption: Alice now has 2 early dialogs, one for each To tag.
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776fork
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>;tag=m2a8
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.40:5060>
      Content-Length: {auto}

  - from: soft
    to: proxyB
    label: "180 Ringing"
    caption: "The softphone rings. It picks its own To tag: s9e3."
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKf1c
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776fork
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>;tag=s9e3
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.60:5060>
      Content-Length: {auto}

  - from: proxyB
    to: alice
    label: "180 Ringing"
    caption: Alice now has 3 early dialogs, one for each To tag.
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776fork
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>;tag=s9e3
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.60:5060>
      Content-Length: {auto}

  - from: desk
    to: proxyB
    label: "200 OK"
    caption: Bob answers on the desk phone.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKf1a
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776fork
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>;tag=d7c1
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: proxyB
    to: alice
    label: "200 OK"
    caption: "Alice's dialog with the desk phone becomes confirmed. The other two early dialogs wait to end."
    rfc: rfc3261-13.2.2.4-early-end
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776fork
      Record-Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>;tag=d7c1
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: alice
    to: proxyB
    label: ACK
    caption: Alice ACKs the 200 OK of the desk phone.
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKak1
      Max-Forwards: 70
      Route: <sip:proxy.biloxi.example;lr>
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>;tag=d7c1
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}

  - from: proxyB
    to: desk
    label: ACK
    caption: Proxy B forwards the ACK to the desk phone.
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKpk1
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKak1
      Max-Forwards: 69
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>;tag=d7c1
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}

  - from: proxyB
    to: mobile
    label: CANCEL
    caption: "Proxy B cancels the branch to the mobile: someone answered."
    message: |
      CANCEL sip:bob@203.0.113.40:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKf1b
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 CANCEL
      Content-Length: {auto}

  - from: mobile
    to: proxyB
    label: "200 OK (CANCEL)"
    caption: The mobile accepts the CANCEL.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKf1b
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>;tag=m2a8
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 CANCEL
      Content-Length: {auto}

  - from: mobile
    to: proxyB
    label: "487 Request Terminated"
    caption: The mobile stops ringing and ends its INVITE with 487.
    message: |
      SIP/2.0 487 Request Terminated
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKf1b
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776fork
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>;tag=m2a8
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 INVITE
      Content-Length: {auto}

  - from: proxyB
    to: mobile
    label: ACK
    caption: Proxy B ACKs the 487 on this hop. It does not forward the 487 to Alice.
    message: |
      ACK sip:bob@203.0.113.40:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKf1b
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>;tag=m2a8
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}

  - from: proxyB
    to: soft
    label: CANCEL
    caption: "Proxy B cancels the branch to the softphone: someone answered."
    message: |
      CANCEL sip:bob@203.0.113.60:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKf1c
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 CANCEL
      Content-Length: {auto}

  - from: soft
    to: proxyB
    label: "200 OK (CANCEL)"
    caption: The softphone accepts the CANCEL.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKf1c
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>;tag=s9e3
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 CANCEL
      Content-Length: {auto}

  - from: soft
    to: proxyB
    label: "487 Request Terminated"
    caption: The softphone stops ringing and ends its INVITE with 487.
    message: |
      SIP/2.0 487 Request Terminated
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKf1c
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK776fork
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>;tag=s9e3
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 INVITE
      Content-Length: {auto}

  - from: proxyB
    to: soft
    label: ACK
    caption: Proxy B ACKs the 487 on this hop. It does not forward the 487 to Alice.
    message: |
      ACK sip:bob@203.0.113.60:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKf1c
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=88sja8x
      To: Bob <sip:bob@biloxi.example>;tag=s9e3
      Call-ID: f81d4fae7dec11d0@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}
