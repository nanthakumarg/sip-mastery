id: invite-retransmit
title: Retransmissions over UDP
summary: Alice calls Bob directly over UDP. The network loses the INVITE and then the 486. Timer A and Timer G send them again.
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: bob
    label: INVITE
    caption: Alice sends the INVITE over UDP and starts Timer A (500 ms). The network loses the INVITE.
    lost: true
    message: |
      INVITE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=4fa21b
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 7f3a92c1@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000

  - from: alice
    to: bob
    label: INVITE (again)
    caption: "Timer A fires. Alice sends the same INVITE again: same branch, same CSeq, same bytes."
    rfc: rfc3261-17.1.1.2-timer-a
    message: |
      INVITE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=4fa21b
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 7f3a92c1@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000

  - from: bob
    to: alice
    label: "100 Trying"
    caption: Bob answers 100 Trying at once. Alice stops sending the INVITE.
    rfc: rfc3261-17.2.1-100
    message: |
      SIP/2.0 100 Trying
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=4fa21b
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 7f3a92c1@192.0.2.10
      CSeq: 1 INVITE
      Content-Length: {auto}

  - from: bob
    to: alice
    label: "180 Ringing"
    caption: "Bob's phone rings. The To header now has Bob's tag."
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=4fa21b
      To: Bob <sip:bob@biloxi.example>;tag=8c2e71
      Call-ID: 7f3a92c1@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Length: {auto}

  - from: bob
    to: alice
    label: "486 Busy Here"
    caption: Bob rejects the call and starts Timer G (500 ms). The network loses the 486.
    lost: true
    message: |
      SIP/2.0 486 Busy Here
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=4fa21b
      To: Bob <sip:bob@biloxi.example>;tag=8c2e71
      Call-ID: 7f3a92c1@192.0.2.10
      CSeq: 1 INVITE
      Content-Length: {auto}

  - from: bob
    to: alice
    label: "486 Busy Here (again)"
    caption: Timer G fires. Bob sends the same 486 again.
    rfc: rfc3261-17.2.1-timer-g
    message: |
      SIP/2.0 486 Busy Here
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=4fa21b
      To: Bob <sip:bob@biloxi.example>;tag=8c2e71
      Call-ID: 7f3a92c1@192.0.2.10
      CSeq: 1 INVITE
      Content-Length: {auto}

  - from: alice
    to: bob
    label: ACK
    caption: Alice ACKs the 486 with the branch of the INVITE. Bob stops sending the 486.
    rfc: rfc3261-17.1.1.3-ack-via
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=4fa21b
      To: Bob <sip:bob@biloxi.example>;tag=8c2e71
      Call-ID: 7f3a92c1@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}
