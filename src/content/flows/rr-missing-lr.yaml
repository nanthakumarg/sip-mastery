id: rr-missing-lr
title: "Broken: Record-Route without lr"
summary: "Proxy B's Record-Route URI has no lr. Alice must use strict routing, and the BYE reaches Bob only because Proxy B repairs it."
broken: true
breaks: [record-route-lr]
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: proxyB, label: Proxy B, kind: proxy, sub: 203.0.113.10 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: proxyB
    label: "INVITE"
    caption: "Alice calls Bob. Proxy B, the billing proxy of biloxi.example, gets the INVITE."
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl1
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 5c0e7a21@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: proxyB
    to: bob
    label: "INVITE"
    caption: "Proxy B starts a call record and adds Record-Route, but the URI has no lr parameter."
    rfc: rfc3261-16.6-lr
    warn: "RFC 3261 requires lr in every Record-Route URI. Without it, in-dialog requests use strict routing."
    message: |
      INVITE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKbl1b
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl1
      Max-Forwards: 69
      Record-Route: <sip:proxy.biloxi.example>
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 5c0e7a21@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: bob
    to: proxyB
    label: "200 OK"
    caption: "Bob answers. The 200 OK copies the Record-Route."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKbl1b
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl1
      Record-Route: <sip:proxy.biloxi.example>
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>;tag=c4a90e
      Call-ID: 5c0e7a21@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: proxyB
    to: alice
    label: "200 OK"
    caption: "Alice's route set is Proxy B, and its URI has no lr. Alice must use strict routing."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl1
      Record-Route: <sip:proxy.biloxi.example>
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>;tag=c4a90e
      Call-ID: 5c0e7a21@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: alice
    to: proxyB
    label: "ACK"
    caption: "Strict routing: Proxy B goes in the Request-URI, and Bob's Contact goes last in Route."
    rfc: rfc3261-12.2.1.1-strict
    message: |
      ACK sip:proxy.biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl2
      Max-Forwards: 70
      Route: <sip:bob@203.0.113.20:5060>
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>;tag=c4a90e
      Call-ID: 5c0e7a21@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}

  - from: proxyB
    to: bob
    label: "ACK"
    caption: "Proxy B finds its own URI in the Request-URI. It moves the last Route value back into the Request-URI."
    rfc: rfc3261-16.4-strict
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKbl2b
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl2
      Max-Forwards: 69
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>;tag=c4a90e
      Call-ID: 5c0e7a21@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}

  - from: alice
    to: proxyB
    label: "BYE"
    caption: "After 3 minutes, Alice hangs up. The BYE follows the route set to Proxy B."
    message: |
      BYE sip:proxy.biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl3
      Max-Forwards: 70
      Route: <sip:bob@203.0.113.20:5060>
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>;tag=c4a90e
      Call-ID: 5c0e7a21@192.0.2.10
      CSeq: 2 BYE
      Content-Length: {auto}

  - from: proxyB
    to: bob
    label: "BYE"
    caption: "Proxy B repairs the BYE again and closes the call record. A proxy that does not recognise its URI fails here."
    warn: "This works only if Proxy B recognises its own Record-Route URI. Many elements and B2BUAs do not."
    message: |
      BYE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKbl3b
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl3
      Max-Forwards: 69
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>;tag=c4a90e
      Call-ID: 5c0e7a21@192.0.2.10
      CSeq: 2 BYE
      Content-Length: {auto}

  - from: bob
    to: proxyB
    label: "200 OK"
    caption: "Bob ends the call."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.10:5060;branch=z9hG4bKbl3b
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl3
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>;tag=c4a90e
      Call-ID: 5c0e7a21@192.0.2.10
      CSeq: 2 BYE
      Content-Length: {auto}

  - from: proxyB
    to: alice
    label: "200 OK"
    caption: "Proxy B forwards the 200 OK to Alice."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKbl3
      From: Alice <sip:alice@atlanta.example>;tag=8d2f61
      To: Bob <sip:bob@biloxi.example>;tag=c4a90e
      Call-ID: 5c0e7a21@192.0.2.10
      CSeq: 2 BYE
      Content-Length: {auto}
