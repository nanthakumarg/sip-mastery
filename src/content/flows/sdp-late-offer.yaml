id: sdp-late-offer
title: "Late offer: the SDP offer in the 200 OK"
summary: "Alice's INVITE has no SDP. Bob's 200 OK carries the offer, and Alice's ACK carries the answer."
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: bob
    label: "INVITE (no SDP)"
    caption: "The INVITE has no body. Gateways and B2BUAs do this when they do not know the media yet."
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKab91c01
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: b91c2d3e4f5061@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Length: 0

  - from: bob
    to: alice
    label: "180 Ringing"
    caption: "Bob's phone rings. No SDP yet."
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKab91c01
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: b91c2d3e4f5061@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Length: 0

  - from: bob
    to: alice
    label: "200 OK (offer)"
    caption: "Bob answers the call. Because the INVITE had no offer, Bob's 200 OK must carry one."
    rfc: rfc3261-13.2.1-patterns
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKab91c01
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: b91c2d3e4f5061@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0 8 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16
      a=ptime:20

  - from: alice
    to: bob
    label: "ACK (answer)"
    caption: "The ACK carries the answer: PCMU and telephone-event. Alice cannot reject the call here; she can only answer, then send BYE."
    rfc: rfc3261-13.2.2.4-ack-answer
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKab91c02
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: b91c2d3e4f5061@192.0.2.10
      CSeq: 1 ACK
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16
      a=ptime:20

  - kind: media
    from: alice
    to: bob
    label: "RTP audio (PCMU)"
    caption: "Media starts after the ACK. Bob could not send any before he knew where to send it."
