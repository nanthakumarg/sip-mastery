id: tls-cert-mismatch
title: "Broken: the certificate does not name the SIP domain"
summary: "The proxy presents a certificate for its web site only. Alice's phone cannot match atlanta.example, closes the connection, and never registers."
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: proxyA, label: Proxy A, kind: proxy, sub: proxy.atlanta.example }
steps:
  - kind: media
    from: alice
    to: proxyA
    proto: net
    label: "TLS ClientHello"
    caption: "Alice opens TCP to port 5061 and starts TLS. SNI names the SIP domain she wants: atlanta.example."
    rfc: rfc5922-7.8-sni
    oneway: true
    detail: |
      TCP  192.0.2.10:52381 → proxy.atlanta.example:5061 (SYN, SYN-ACK, ACK)
      TLS 1.3  ClientHello
        server_name (SNI): atlanta.example
        supported_versions: TLS 1.3, TLS 1.2

  - kind: media
    from: proxyA
    to: alice
    proto: net
    label: "TLS ServerHello, Certificate"
    caption: "The proxy sends a certificate for www.atlanta.example only. It is valid, but for the wrong name."
    oneway: true
    detail: |
      TLS 1.3  ServerHello
        {EncryptedExtensions, Certificate, CertificateVerify, Finished}
        Certificate: subject CN=www.atlanta.example
                     subjectAltName DNS:www.atlanta.example
                     issuer: a CA that Alice trusts

      Check (RFC 5922 §7.3): no identity matches atlanta.example → FAIL

  - kind: media
    from: alice
    to: proxyA
    proto: err
    label: "TLS alert (bad_certificate)"
    caption: "Alice's phone rejects the certificate and closes the connection. It sends no SIP at all."
    rfc: rfc5922-7.3-close
    oneway: true
    warn: "The phone shows \"registration failed\". The log says only \"TLS handshake failed\"."
    detail: |
      TLS 1.3  Alert: bad_certificate
      TCP  FIN
