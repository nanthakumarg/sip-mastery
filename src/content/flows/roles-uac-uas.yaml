id: roles-uac-uas
title: One call, two roles that swap
summary: A user agent is a UAC when it sends a request and a UAS when it answers one. The role lasts for one transaction.
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: bob
    label: INVITE
    caption: Alice's phone sends a request. For this transaction, Alice's phone is the UAC.
    rfc: rfc3261-6-uac
    message: |
      INVITE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 8
      a=rtpmap:0 PCMU/8000
      a=rtpmap:8 PCMA/8000

  - from: bob
    to: alice
    label: 180 Ringing
    caption: Bob's phone answers the request, so it is the UAS. Bob's phone rings.
    rfc: rfc3261-6-uas
    message: |
      SIP/2.0 180 Ringing
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Length: {auto}

  - from: bob
    to: alice
    label: 200 OK
    caption: Bob answers. The UAS sends the final response for the INVITE transaction.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74bf9
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0
      a=rtpmap:0 PCMU/8000

  - from: alice
    to: bob
    label: ACK
    caption: Alice's phone confirms the 200 OK. The ACK goes straight to Bob's Contact address.
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bK74b76
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 ACK
      Content-Length: {auto}

  - from: bob
    to: alice
    label: BYE
    caption: Bob hangs up. Bob's phone sends a new request, so now it is the UAC.
    message: |
      BYE sip:alice@192.0.2.10:5060 SIP/2.0
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKnashds7
      Max-Forwards: 70
      From: Bob <sip:bob@biloxi.example>;tag=314159
      To: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 BYE
      Content-Length: {auto}

  - from: alice
    to: bob
    label: 200 OK
    caption: Alice's phone answers the BYE. For this transaction, Alice's phone is the UAS.
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 203.0.113.20:5060;branch=z9hG4bKnashds7
      From: Bob <sip:bob@biloxi.example>;tag=314159
      To: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      Call-ID: 3848276298220188511@192.0.2.10
      CSeq: 1 BYE
      Content-Length: {auto}
