id: websocket-register
title: "SIP over WebSocket: a browser registers"
summary: "A web page opens a secure WebSocket to the proxy, asks for the sip subprotocol, and sends SIP messages as WebSocket messages."
lanes:
  - { id: alice, label: Alice, kind: ua, sub: web browser }
  - { id: proxyA, label: Proxy A, kind: proxy, sub: wss://proxy.atlanta.example }
steps:
  - kind: media
    from: alice
    to: proxyA
    proto: net
    label: "TLS handshake"
    caption: "The browser opens TCP and TLS to port 443, as for any HTTPS page."
    detail: |
      TCP  → proxy.atlanta.example:443
      TLS 1.3 handshake (the browser checks the certificate, as for HTTPS)

  - kind: media
    from: alice
    to: proxyA
    proto: net
    label: "WebSocket upgrade (GET)"
    caption: "The page asks to turn the HTTPS connection into a WebSocket, with the sip subprotocol."
    rfc: rfc7118-4.1-handshake
    oneway: true
    detail: |
      GET / HTTP/1.1
      Host: proxy.atlanta.example
      Upgrade: websocket
      Connection: Upgrade
      Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==
      Origin: https://www.atlanta.example
      Sec-WebSocket-Protocol: sip
      Sec-WebSocket-Version: 13

  - kind: media
    from: proxyA
    to: alice
    proto: net
    label: "101 Switching Protocols"
    caption: "The proxy agrees: the connection now carries SIP, one SIP message in each WebSocket message."
    oneway: true
    detail: |
      HTTP/1.1 101 Switching Protocols
      Upgrade: websocket
      Connection: Upgrade
      Sec-WebSocket-Accept: s3pPLMBiTxaQ9kYGzzhZRbK+xOo=
      Sec-WebSocket-Protocol: sip

  - from: alice
    to: proxyA
    label: "REGISTER (WSS)"
    caption: "JavaScript cannot learn its own IP address, so the Via and Contact use a random .invalid name. Outbound keeps the connection as the route to Alice."
    rfc: rfc7118-5.1-via
    message: |
      REGISTER sip:atlanta.example SIP/2.0
      Via: SIP/2.0/WSS df7jal23ls0d.invalid;branch=z9hG4bKwsreg1
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=65bnmj.34asd
      To: Alice <sip:alice@atlanta.example>
      Call-ID: aiuy7k9njasd
      CSeq: 1 REGISTER
      Supported: path, outbound, gruu
      Contact: <sip:alice@df7jal23ls0d.invalid;transport=ws>;reg-id=1;+sip.instance="<urn:uuid:f81d4fae-7dec-11d0-a765-00a0c91e6bf6>"
      Expires: 600
      Content-Length: 0

  - from: proxyA
    to: alice
    label: "200 OK"
    caption: "Calls for Alice will come back over this WebSocket. If the page closes, the registration is useless."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/WSS df7jal23ls0d.invalid;branch=z9hG4bKwsreg1
      From: Alice <sip:alice@atlanta.example>;tag=65bnmj.34asd
      To: Alice <sip:alice@atlanta.example>;tag=wsr8cd1
      Call-ID: aiuy7k9njasd
      CSeq: 1 REGISTER
      Require: outbound
      Contact: <sip:alice@df7jal23ls0d.invalid;transport=ws>;reg-id=1;+sip.instance="<urn:uuid:f81d4fae-7dec-11d0-a765-00a0c91e6bf6>";expires=600
      Content-Length: 0
