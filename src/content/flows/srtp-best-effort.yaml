id: srtp-best-effort
title: "Best-effort SRTP: RTP/AVP with a=crypto"
summary: "Alice offers RTP/AVP with a key. Bob's phone ignores a=crypto, which it does not know, and answers plain RTP."
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: bob
    label: "INVITE (RTP/AVP + crypto)"
    caption: "Alice offers RTP/AVP, so any phone can accept, and adds a=crypto in case Bob can do SRTP."
    rfc: rfc4568-6-savp
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/TLS 192.0.2.10:5061;branch=z9hG4bKb9a3f5i
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: b9a3f5d7c2@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5061;transport=tls>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16
      a=crypto:1 AES_CM_128_HMAC_SHA1_80 inline:WVNfX19zZW1jdGwgKCkgewkyMjA7fQp9CnVubGVz|2^31

  - from: bob
    to: alice
    label: "200 OK (RTP/AVP)"
    caption: "Bob's phone ignores the attribute it does not understand and answers without a=crypto."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/TLS 192.0.2.10:5061;branch=z9hG4bKb9a3f5i
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: b9a3f5d7c2@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5061;transport=tls>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16

  - from: alice
    to: bob
    label: "ACK"
    caption: "The call is up."
    message: |
      ACK sip:bob@203.0.113.20:5061;transport=tls SIP/2.0
      Via: SIP/2.0/TLS 192.0.2.10:5061;branch=z9hG4bKb9a3f5ia
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: b9a3f5d7c2@192.0.2.10
      CSeq: 1 ACK
      Content-Length: 0

  - kind: media
    from: alice
    to: bob
    label: "RTP audio"
    caption: "The call works, but the media is plain RTP. A phone should show the user that the call is not encrypted."
