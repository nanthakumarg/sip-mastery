id: srtp-savp-488
title: "RTP/SAVP to a peer without SRTP: 488"
summary: "Alice offers only SRTP. Bob's phone does not support SRTP, so it rejects the call with 488."
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: bob
    label: "INVITE (RTP/SAVP)"
    caption: "Alice requires SRTP: her only m= line is RTP/SAVP."
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/TLS 192.0.2.10:5061;branch=z9hG4bKb4e8c2i
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: b4e8c2a6d1@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5061;transport=tls>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/SAVP 0 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16
      a=crypto:1 AES_CM_128_HMAC_SHA1_80 inline:WVNfX19zZW1jdGwgKCkgewkyMjA7fQp9CnVubGVz|2^31

  - from: bob
    to: alice
    label: "488 Not Acceptable Here"
    caption: "Bob's phone knows only RTP/AVP. It has nothing it can accept, so it rejects the whole call."
    message: |
      SIP/2.0 488 Not Acceptable Here
      Via: SIP/2.0/TLS 192.0.2.10:5061;branch=z9hG4bKb4e8c2i
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: b4e8c2a6d1@192.0.2.10
      CSeq: 1 INVITE
      Warning: 302 biloxi.example "Incompatible transport protocol"
      Content-Length: 0

  - from: alice
    to: bob
    label: "ACK"
    caption: "Alice acknowledges the 488. The call fails, though both phones can do G.711."
    message: |
      ACK sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/TLS 192.0.2.10:5061;branch=z9hG4bKb4e8c2i
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: b4e8c2a6d1@192.0.2.10
      CSeq: 1 ACK
      Content-Length: 0
