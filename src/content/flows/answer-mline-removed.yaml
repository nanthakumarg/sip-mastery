id: answer-mline-removed
title: "Broken: the answer removes the video m= line"
summary: "Bob's phone answers with one m= line for an offer with two. Alice cannot match the streams and hangs up."
broken: true
breaks: [sdp-mlines]
lanes:
  - { id: alice, label: Alice, kind: ua, sub: 192.0.2.10 }
  - { id: bob, label: Bob, kind: ua, sub: 203.0.113.20 }
steps:
  - from: alice
    to: bob
    label: "INVITE (audio, video)"
    caption: "Alice's video phone offers two streams: audio, then video."
    message: |
      INVITE sip:bob@biloxi.example SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKaf1a201
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>
      Call-ID: f1a2b3c4d5e6@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:alice@192.0.2.10:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=alice 2890844526 2890844526 IN IP4 192.0.2.10
      s=-
      c=IN IP4 192.0.2.10
      t=0 0
      m=audio 49170 RTP/AVP 0 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16
      m=video 51372 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 profile-level-id=42e01f;packetization-mode=1

  - from: bob
    to: alice
    label: "200 OK (audio only)"
    caption: "Bob's phone has no camera, so it removes the video m= line from the answer."
    rfc: rfc3264-6-mlines
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKaf1a201
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: f1a2b3c4d5e6@192.0.2.10
      CSeq: 1 INVITE
      Contact: <sip:bob@203.0.113.20:5060>
      Content-Type: application/sdp
      Content-Length: {auto}

      v=0
      o=bob 2808844564 2808844564 IN IP4 203.0.113.20
      s=-
      c=IN IP4 203.0.113.20
      t=0 0
      m=audio 3456 RTP/AVP 0 101
      a=rtpmap:0 PCMU/8000
      a=rtpmap:101 telephone-event/8000
      a=fmtp:101 0-16

  - from: alice
    to: bob
    label: "ACK"
    caption: "Alice must ACK the 200 OK, but the answer does not match her offer."
    message: |
      ACK sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKaf1a202
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: f1a2b3c4d5e6@192.0.2.10
      CSeq: 1 ACK
      Content-Length: 0

  - from: alice
    to: bob
    label: "BYE"
    caption: "Alice's phone cannot match the streams, so it ends the call."
    rfc: rfc3261-13.2.2.4-bye
    warn: "The call fails, although both phones can do audio."
    message: |
      BYE sip:bob@203.0.113.20:5060 SIP/2.0
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKaf1a203
      Max-Forwards: 70
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: f1a2b3c4d5e6@192.0.2.10
      CSeq: 2 BYE
      Content-Length: 0

  - from: bob
    to: alice
    label: "200 OK"
    caption: "The call ends after a second."
    message: |
      SIP/2.0 200 OK
      Via: SIP/2.0/UDP 192.0.2.10:5060;branch=z9hG4bKaf1a203
      From: Alice <sip:alice@atlanta.example>;tag=9fxced76sl
      To: Bob <sip:bob@biloxi.example>;tag=314159
      Call-ID: f1a2b3c4d5e6@192.0.2.10
      CSeq: 2 BYE
      Content-Length: 0
