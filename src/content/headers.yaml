# Header reference for the message inspector.
# `summary` is one or two short sentences in controlled English.
# `rfc` and `section` build the "Read the RFC" link.

headers:
  Via:
    summary: Records the path of the request. Responses follow the Via headers back, and the top branch identifies the transaction.
    rfc: 3261
    section: "20.42"
    who: Each element that sends a request adds one. Each element removes its own from the response.
  Max-Forwards:
    summary: Limits the number of hops. Each proxy subtracts 1. At 0 the request is rejected with 483.
    rfc: 3261
    section: "20.22"
    who: The UAC sets 70. Each proxy decrements it.
  Route:
    summary: Forces the request through the listed proxies, in order. Each proxy removes its own entry.
    rfc: 3261
    section: "20.34"
    who: The UAC adds it (outbound proxy or route set). Each listed proxy removes its own entry.
  Record-Route:
    summary: A proxy adds itself here to stay in the path of later requests in the dialog.
    rfc: 3261
    section: "20.30"
    who: Each proxy that wants to stay in the path. The UAC reverses the list to build the route set.
  From:
    summary: The logical sender of the request. The From tag identifies the UAC side of the dialog.
    rfc: 3261
    section: "20.20"
    who: The UAC. It never changes in the dialog.
  To:
    summary: The logical target of the request. The UAS adds a To tag in its responses.
    rfc: 3261
    section: "20.39"
    who: The UAC sets the URI. The UAS adds the tag.
  Call-ID:
    summary: A unique ID for all messages of one call or one registration.
    rfc: 3261
    section: "20.8"
    who: The UAC. A retry after a challenge keeps the same Call-ID.
  CSeq:
    summary: A sequence number and a method. It orders requests and matches responses to requests.
    rfc: 3261
    section: "20.16"
    who: The UAC. A retry after a challenge adds 1. An ACK for a non-2xx response keeps the INVITE number.
  Contact:
    summary: The address where this user agent can be reached directly.
    rfc: 3261
    section: "20.10"
    who: The UAC in requests, the UAS in responses. A registrar returns all active bindings.
  Expires:
    summary: How many seconds a registration or subscription stays valid.
    rfc: 3261
    section: "20.19"
    who: The UAC requests a value. The registrar can return a shorter value.
  WWW-Authenticate:
    summary: The challenge in a 401. It gives the realm, a nonce, the qop, and the algorithm.
    rfc: 3261
    section: "20.44"
    who: A registrar or UAS.
  Authorization:
    summary: The credentials that answer a 401. The response value proves the UAC knows the password.
    rfc: 3261
    section: "20.7"
    who: The UAC, after a 401 or from a cached challenge.
  Proxy-Authenticate:
    summary: The challenge in a 407. It gives the realm, a nonce, the qop, and the algorithm.
    rfc: 3261
    section: "20.27"
    who: A proxy.
  Proxy-Authorization:
    summary: The credentials that answer a 407. Only the proxy with the matching realm consumes them.
    rfc: 3261
    section: "20.28"
    who: The UAC. Proxies never add it.
  Require:
    summary: Extensions (option tags) that the receiver MUST understand to process this request. If it does not, it answers 420 Bad Extension.
    rfc: 3261
    section: "20.32"
  Proxy-Require:
    summary: Like Require, but for the proxies on the path. A proxy that does not understand a listed extension answers 420.
    rfc: 3261
    section: "20.29"
  Unsupported:
    summary: In a 420 response, lists the extensions from Require or Proxy-Require that the server does not understand.
    rfc: 3261
    section: "20.40"
  Accept:
    summary: The body types that the sender can receive, for example application/sdp.
    rfc: 3261
    section: "20.1"
  Accept-Encoding:
    summary: The content encodings, such as gzip, that the sender can receive.
    rfc: 3261
    section: "20.2"
  Accept-Language:
    summary: The languages that the sender prefers for reason phrases, warnings, and bodies.
    rfc: 3261
    section: "20.3"
  RSeq:
    summary: The sequence number of a reliable provisional response. The PRACK repeats it in RAck.
    rfc: 3262
    section: "7.1"
  RAck:
    summary: In a PRACK, names the reliable provisional response it acknowledges, by RSeq, CSeq number, and method.
    rfc: 3262
    section: "7.2"
  Allow:
    summary: The methods that the sender supports, for example INVITE, ACK, BYE, CANCEL, OPTIONS.
    rfc: 3261
    section: "20.5"
  Supported:
    summary: The extensions (option tags) that the sender supports, for example timer or 100rel.
    rfc: 3261
    section: "20.37"
  Subject:
    summary: A short summary of the call, for people to read. Compact form s.
    rfc: 3261
    section: "20.36"
  Geolocation:
    summary: "Points to the caller's location. A cid: URI points to a body part with the same Content-ID."
    rfc: 6442
    section: "4.1"
  Geolocation-Routing:
    summary: Says whether proxies may use the location to route the request, for example to the nearest emergency centre.
    rfc: 6442
    section: "4.2"
  P-Asserted-Identity:
    summary: The caller identity that a trusted proxy verified, for example by Digest authentication. Trusted only between elements in the same trust domain.
    rfc: 3325
    section: "9.1"
    who: The first trusted proxy adds it. A proxy removes it before an untrusted hop if Privacy says id.
  P-Preferred-Identity:
    summary: The identity the user would like the network to assert, when the user has more than one.
    rfc: 3325
    section: "9.2"
    who: The UAC adds it. The first trusted proxy removes it and adds P-Asserted-Identity.
  Privacy:
    summary: The privacy the user asks for, such as id (hide the asserted identity outside the trust domain), header, session, user, or none.
    rfc: 3323
    section: "4.2"
    who: The UAC adds it. A privacy service applies it.
  History-Info:
    summary: The list of Request-URIs the request had, and why each one changed. Used by voicemail and call centres.
    rfc: 7044
    section: "5"
    who: Each element that forwards or retargets the request adds an entry.
  Diversion:
    summary: Who forwarded the call, and why (for example no-answer). Historic, but common on SIP trunks.
    rfc: 5806
    section: "4"
    who: The element that forwards the call adds an entry.
  Session-Expires:
    summary: The session interval in seconds, and which side refreshes the session (refresher=uac or uas).
    rfc: 4028
    section: "4"
    who: The UAC proposes it. Proxies may lower it. The UAS confirms it in the 2xx.
  Min-SE:
    summary: The smallest session interval that an element accepts. Never below 90 seconds.
    rfc: 4028
    section: "5"
    who: The UAC, and any proxy that needs a larger minimum.
  Reason:
    summary: Why a request ends something, as a SIP code or a Q.850 cause, for example in a BYE or a CANCEL.
    rfc: 3326
    section: "2"
    who: The UA or proxy that ends the call, or a gateway that translates a PSTN cause.
  Warning:
    summary: A warning code, the host that sent it, and a text. Codes 3xx explain SDP problems.
    rfc: 3261
    section: "20.43"
    who: Any element that sends a response.
  Retry-After:
    summary: How long to wait before trying again, after 503, 500, 486, 480, and similar responses.
    rfc: 3261
    section: "20.33"
  Min-Expires:
    summary: In a 423 response, the shortest registration or subscription time the server accepts.
    rfc: 3261
    section: "20.23"
  Event:
    summary: The event package of a SUBSCRIBE or NOTIFY, such as presence or message-summary. Compact form o.
    rfc: 6665
    section: "8.2.1"
  Subscription-State:
    summary: In a NOTIFY, whether the subscription is active, pending, or terminated, and for how long.
    rfc: 6665
    section: "8.2.3"
  Refer-To:
    summary: In a REFER, the URI that the receiver should contact. Compact form r.
    rfc: 3515
    section: "2.1"
  Referred-By:
    summary: Who asked for the REFER. Carried into the new INVITE. Compact form b.
    rfc: 3892
    section: "3"
  Replaces:
    summary: Says that a new INVITE replaces an existing dialog, named by Call-ID and tags. Used in attended transfer.
    rfc: 3891
    section: "6.1"
  Identity:
    summary: A signed token (PASSporT) that proves the caller's number. The basis of STIR/SHAKEN (Module 28).
    rfc: 8224
    section: "4"
  Path:
    summary: In a REGISTER, the proxies that requests for this user must pass through, such as an edge proxy.
    rfc: 3327
    section: "4"
  Call-Info:
    summary: More information about the caller or callee, such as a picture or a web page, with a purpose parameter.
    rfc: 3261
    section: "20.9"
  Alert-Info:
    summary: In an INVITE, a URI for a special ringtone. In a 180, a special ringback.
    rfc: 3261
    section: "20.4"
  Content-Disposition:
    summary: How to handle the body, for example session (an SDP) or render.
    rfc: 3261
    section: "20.11"
  Recv-Info:
    summary: The Info Packages that this side accepts in INFO requests.
    rfc: 6086
    section: "7.3"
  Info-Package:
    summary: In an INFO request, the Info Package this INFO belongs to.
    rfc: 6086
    section: "7.2"
  Content-Type:
    summary: The type of the body, for example application/sdp.
    rfc: 3261
    section: "20.15"
  Content-Length:
    summary: The size of the body in bytes. The value is 0 when there is no body.
    rfc: 3261
    section: "20.14"
  Date:
    summary: The date and time the message was sent. Phones without a clock can set their time from a registrar's 200 OK.
    rfc: 3261
    section: "20.17"
  User-Agent:
    summary: The software of the UAC. Useful for troubleshooting.
    rfc: 3261
    section: "20.41"
  Server:
    summary: The software of the UAS.
    rfc: 3261
    section: "20.35"

startLines:
  request:
    summary: The request line. It has the method, the Request-URI (the current target), and the SIP version.
    rfc: 3261
    section: "7.1"
  response:
    summary: The status line. It has the SIP version, the status code, and a reason phrase. Only the code matters to software.
    rfc: 3261
    section: "7.2"

sdp:
  v: { summary: SDP version. Always 0. }
  o: { summary: "Origin: user, session ID, session version, network type, address type, and address. The version goes up with each new offer." }
  s: { summary: Session name. Often "-". }
  c: { summary: Connection data. The IP address that receives the media. }
  t: { summary: Timing. "0 0" means the session has no fixed start or end. }
  m: { summary: "Media description: media type, port, profile, and payload types in order of preference." }
  a: { summary: An attribute, such as a codec mapping (rtpmap) or a direction (sendrecv). }
  b: { summary: Bandwidth information. }
